iap langkah sebelum beralih ke langkah seterusnya.", "st": ["Latihan berpandu", "Contoh", "Struktur", "Langkah"]}, {"t": "👀 Tunjuk Cara Ulangan", "d": "Guru mendemonstrasi semula kemahiran dengan penerangan yang lebih perlahan dan jelas. Gunakan bahan bantu visual semasa demonstrasi. Minta murid meniru dan mengulang selepas guru. Ulang beberapa kali sehingga murid dapat melakukannya secara berdikari.", "st": ["Demonstrasi", "Pengulangan", "Visual", "Tiru"]}, {"t": "📊 Bahan Bantu Visual", "d": "Gunakan gambar rajah, carta, peta konsep, infografik dan video untuk menjelaskan konsep secara visual. Minta murid melukis atau mewarna gambar rajah sendiri. Kaitkan konsep abstrak dengan contoh konkrit yang boleh dilihat dan disentuh oleh murid.", "st": ["Visual", "Peta konsep", "Infografik", "Konkrit"]}, {"t": "✏️ Latihan Pengukuhan Bertulis", "d": "Sediakan latihan tambahan yang lebih mudah untuk membina keyakinan murid. Mulakan dengan soalan aras rendah sebelum beralih ke aras sederhana. Beri contoh jawapan sebelum murid memulakan latihan. Periksa dan betulkan jawapan murid serta beri maklum balas segera.", "st": ["Latihan", "Pengukuhan", "Keyakinan", "Maklum balas"]}, {"t": "🤝 Pembelajaran Berpasangan (Peer Tutoring)", "d": "Pasangkan murid cemerlang dengan murid pemulihan. Murid cemerlang membimbing rakan dalam menyelesaikan tugasan. Guru memantau dan memberi bantuan jika perlu. Aktiviti ini bukan sahaja membantu murid pemulihan malah mengukuhkan kefahaman murid cemerlang.", "st": ["Bimbingan rakan", "Kolaboratif", "Sosial", "Peer tutoring"]}, {"t": "🎲 Permainan Pendidikan", "d": "Gunakan permainan papan, kad imbas atau permainan digital untuk mengukuhkan kemahiran secara menyeronokkan. Contoh: domino perkataan, bingo matematik, atau kuiz interaktif. Permainan meningkatkan motivasi dan mengurangkan tekanan pembelajaran.", "st": ["Permainan", "Motivasi", "Interaktif", "Seronok"]}, {"t": "🃏 Kad Imbasan (Flashcards)", "d": "Gunakan kad imbasan berwarna dengan gambar dan perkataan. Guru menunjukkan kad, murid menyebut perkataan. Ulang secara konsisten sehingga murid dapat mengingat. Boleh dijadikan permainan siapa cepat dia dapat untuk meningkatkan semangat.", "st": ["Kad imbasan", "Pengulangan", "Visual", "Permainan"]}, {"t": "🎵 Nyanyian dan Gerakan", "d": "Gunakan lagu, irama dan gerakan badan untuk mengukuhkan konsep. Sesuai untuk murid kinestetik. Cipta lirik mudah berdasarkan topik pembelajaran. Murid menyanyi sambil membuat gerakan. Aktiviti ini meningkatkan ingatan jangka panjang.", "st": ["Muzik", "Gerakan", "Kinestetik", "Kreatif"]}, {"t": "🗺️ Peta Konsep Bergambar", "d": "Murid melengkapkan peta konsep bergambar yang mengandungi gambar dan kata kunci. Guru menyediakan peta konsep yang separa lengkap. Murid mengisi tempat kosong dengan perkataan atau gambar yang betul. Aktiviti ini membantu murid mengorganisasi maklumat.", "st": ["Visual", "Organisasi", "Kreatif", "Peta minda"]}, {"t": "📖 Bacaan Bergilir (Guided Reading)", "d": "Guru dan murid membaca bersama-sama. Guru berhenti pada perkataan sukar dan membimbing sebutan. Bincangkan maksud perkataan dalam konteks. Minta murid membaca semula ayat untuk meningkatkan kefahaman dan kefasihan.", "st": ["Bacaan berpandu", "Sebutan", "Kefahaman", "Fasih"]}, {"t": "🔤 Dialog Strip Sequencing", "d": "Potong dialog pendek menjadi jalur-jalur ayat. Murid menyusun dialog mengikut urutan yang betul. Baca dialog bersama selepas selesai menyusun. Aktiviti ini membantu murid memahami struktur ayat dan urutan perbualan.", "st": ["Susunan", "Urutan", "Bertutur", "Membaca"]}, {"t": "📄 Cloze Passage dengan Gambar", "d": "Sediakan teks cloze di mana perkataan yang hilang ditunjukkan sebagai gambar di atas ruang kosong. Murid menulis perkataan yang betul berdasarkan gambar. Aktiviti ini membantu murid memahami konteks dan meningkatkan kosa kata.", "st": ["Cloze", "Visual", "Kefahaman", "Kosa kata"]}, {"t": "🔍 Error Hunt (Cari Kesalahan)", "d": "Tunjukkan 3 ayat bergambar - 1 betul dan 2 dengan kesalahan ejaan/tatabahasa. Murid membulatkan kesalahan dan menulis jawapan betul. Bincangkan jenis kesalahan dan cara membetulkannya. Aktiviti ini meningkatkan kemahiran menyunting.", "st": ["Pengenalpastian", "Pembetulan", "Visual", "Analisis"]}, {"t": "📝 Mini Whiteboard Quick-Write", "d": "Guru menunjukkan gambar dan menyebut perkataan/ayat. Murid menulis pada papan putih mini masing-masing. Semua murid menunjukkan papan serentak. Guru memberi maklum balas segera. Aktiviti ini membolehkan guru menilai pemahaman semua murid dengan cepat.", "st": ["Penulisan", "Maklum balas", "Cepat", "Penilaian"]}, {"t": "🏃 Alphabet / Phonics Hopscotch", "d": "Lukis grid hopscotch dengan huruf atau suku kata di atas lantai. Murid melompat ke huruf dan menyebut bunyi atau perkataan yang bermula dengan huruf tersebut. Gandingkan dengan sebutan perkataan penuh. Aktiviti fizikal ini sesuai untuk murid kinestetik.", "st": ["Kinestetik", "Fonik", "Permainan", "Fizikal"]}, {"t": "📑 Word Family Sorting", "d": "Gunakan poket carta dengan kepala keluarga perkataan (-at, -an, -op, -it). Sediakan kad perkataan pelbagai keluarga. Murid menyusun kad ke dalam keluarga perkataan yang betul. Sebut perkataan selepas menyusun. Aktiviti ini mengukuhkan kemahiran membaca dan mengeja.", "st": ["Pengelasan", "Rakan sebaya", "Visual", "Fonik"]}, {"t": "📦 Realia Show & Tell", "d": "Bawa objek sebenar ke dalam kelas. Guru menyebut nama objek, murid mengulang. Minta murid mengambil objek yang betul apabila guru menyebut namanya. Kemudian murid menyebut sendiri nama objek sambil menunjukkannya. Aktiviti ini mengukuhkan perkaitan antara objek dan perkataan.", "st": ["Objek sebenar", "Visual", "Verbal", "Kinestetik"]}, {"t": "⚽ Question-Question Pass", "d": "Murid berdiri dalam bulatan. Guru memulakan dengan bertanya soalan mudah sambil memegang bola. Bola dihantar kepada murid yang menjawab soalan, kemudian murid tersebut bertanya soalan baru kepada rakan yang lain. Aktiviti ini melatih kemahiran bertutur dan mendengar.", "st": ["Bertutur", "Sosial", "Permainan", "Mendengar"]}, {"t": "🖼️ Talk-the-Picture Frame", "d": "Beri setiap pasangan satu gambar yang besar dan menarik. Murid bergilir-gilir menunjuk dan menyebut apa yang mereka lihat menggunakan rangka ayat yang diberi. Rakan pasangan membantu jika perlu. Aktiviti ini membina keyakinan bertutur.", "st": ["Visual", "Berpasangan", "Bertutur", "Keyakinan"]}, {"t": "✏️ Latihan Menulis Huruf/Perkataan", "d": "Gunakan buku latihan khas dengan titik panduan dan garis bantu. Murid menulis huruf atau perkataan dengan meniru titik-titik. Kurangkan panduan secara beransur-ansur sehingga murid boleh menulis tanpa panduan. Beri ganjaran untuk tulisan yang kemas.", "st": ["Penulisan", "Mekanis", "Latih tubi", "Psikomotor"]}, {"t": "🧮 Pengiraan Menggunakan Bahan Maujud", "d": "Gunakan blok, biji benih, straw atau benda konkrit lain untuk mengira, menambah dan menolak. Murid secara fizikal menggerakkan objek semasa mengira. Aktiviti ini membantu murid memahami konsep nombor secara konkrit sebelum beralih ke abstrak.", "st": ["Konkrit", "Maujud", "Matematik", "Kinestetik"]}, {"t": "📏 Garis Nombor", "d": "Lukis garis nombor yang besar di lantai atau atas meja. Murid melangkah atau menuding ke nombor yang betul semasa membuat pengiraan. Gunakan warna berbeza untuk nombor positif dan negatif. Aktiviti ini memudahkan kefahaman operasi tambah dan tolak.", "st": ["Visual", "Konkrit", "Operasi", "Matematik"]}, {"t": "🧠 Permainan Memori (Memory Game)", "d": "Kad gambar dan perkataan diletakkan terbalik. Murid membuka dua kad untuk mencari padanan gambar-perkataan. Sebut perkataan dengan kuat apabila mendapat padanan. Aktiviti ini mengukuhkan ingatan jangka pendek dan perkaitan gambar-perkataan.", "st": ["Memori", "Padanan", "Permainan", "Kognitif"]}, {"t": "📒 Buku Skrap Pemulihan", "d": "Murid mengumpul semua hasil kerja pemulihan dalam sebuah buku skrap khas. Setiap minggu, murid dan guru melihat perkembangan yang telah dicapai. Beri stiker bintang untuk setiap pencapaian. Aktiviti ini meningkatkan motivasi dan keyakinan diri murid.", "st": ["Dokumentasi", "Motivasi", "Kendiri", "Refleksi"]}, {"t": "✂️ Aktiviti Potong dan Tampal", "d": "Murid memotong gambar atau perkataan dari majalah atau lembaran kerja. Kemudian mereka menampal pada tempat yang betul dalam buku latihan. Aktiviti ini melatih kemahiran psikomotor halus sambil belajar mengelaskan maklumat.", "st": ["Psikomotor", "Pengelasan", "Kreatif", "Fokus"]}, {"t": "💬 Soalan Lisan Berbimbing", "d": "Guru mengemukakan soalan secara lisan dengan bimbingan rapat. Beri masa menunggu yang mencukupi untuk murid berfikir. Beri petunjuk jika murid tidak dapat menjawab. Aktiviti ini dijalankan tanpa tekanan untuk membina keyakinan murid.", "st": ["Lisan", "Bimbingan", "Keyakinan", "Sabar"]}, {"t": "💻 Pembelajaran Atas Talian", "d": "Gunakan platform seperti Quizizz, Google Forms, YouTube atau aplikasi pendidikan lain. Sediakan aktiviti interaktif yang menyeronokkan. Murid boleh mengakses di rumah atau di makmal komputer. Aktiviti ini meningkatkan literasi digital murid.", "st": ["Digital", "Interaktif", "Kendiri", "TMK"]}, {"t": "📓 Jurnal Pembelajaran", "d": "Murid menulis jurnal ringkas setiap hari tentang apa yang mereka pelajari dan apa yang masih sukar difahami. Guru membaca dan memberi komen. Aktiviti ini melatih murid mereflek pembelajaran sendiri dan mengenal pasti kelemahan.", "st": ["Refleksi", "Penulisan", "Kendiri", "Metakognisi"]}, {"t": "🎪 Stesen Pemulihan", "d": "Sediakan 3-4 stesen di dalam kelas dengan aktiviti pemulihan yang berbeza. Murid bergerak secara berkumpulan kecil dari satu stesen ke stesen lain. Setiap stesen mengambil masa 5-7 minit. Guru memantau dan membimbing di stesen yang memerlukan.", "st": ["Kumpulan kecil", "Bimbingan", "Stesen", "Pelbagai"]}, {"t": "🎯 Permainan Sasaran Kata", "d": "Lukis sasaran di papan tulis dengan titik markah. Murid membaling bola magnet atau melemparkan dart magnet ke sasaran. Mereka perlu menyebut perkataan berdasarkan tempat bola mendarat. Aktiviti ini menggabungkan pergerakan fizikal dengan pembelajaran.", "st": ["Permainan", "Sebutan", "Fizikal", "Motivasi"]}, {"t": "🧩 Puzzle Pendidikan", "d": "Gunakan puzzle gambar atau perkataan yang dipotong menjadi kepingan. Murid menyusun semula puzzle untuk membentuk gambar atau perkataan yang lengkap. Aktiviti ini mengukuhkan kemahiran membaca, mengeja dan mengenal pola.", "st": ["Puzzle", "Visual", "Kognitif", "Penyelesaian"]}, {"t": "🎤 Karaoke Pembelajaran", "d": "Murid menyanyikan lagu pembelajaran dengan lirik dipaparkan di skrin. Lirik mengandungi perkataan atau konsep yang sedang dipelajari. Murid menyanyi sambil membaca lirik. Aktiviti ini menyeronokkan dan mengukuhkan ingatan.", "st": ["Muzik", "Pengulangan", "Menyanyi", "Seronok"]}, {"t": "📋 Checklist Kendiri", "d": "Sediakan senarai semak mudah yang mengandungi kriteria yang perlu dikuasai. Murid menyemak sendiri tahap penguasaan mereka dengan menanda (✓) pada petak yang sesuai. Guru menyemak semula dan membincangkan hasilnya dengan murid.", "st": ["Kendiri", "Refleksi", "Penilaian", "Metakognisi"]}, {"t": "🎭 Main Peranan (Role Play)", "d": "Murid melakonkan situasi harian yang berkaitan dengan topik pembelajaran. Guru memberi skrip mudah atau murid boleh improvisasi. Bimbing murid dalam melafazkan dialog dengan sebutan dan intonasi yang betul. Aktiviti ini meningkatkan keyakinan.", "st": ["Lakonan", "Sosial", "Kreatif", "Bertutur"]}, {"t": "🔢 Kad Nombor Berwarna", "d": "Gunakan kad nombor berwarna untuk konsep matematik asas seperti nilai tempat, lebih besar/lebih kecil. Susun kad mengikut urutan. Bandingkan dua kad untuk menentukan nilai yang lebih besar. Aktiviti ini memudahkan kefahaman konsep matematik.", "st": ["Visual", "Matematik", "Warna", "Perbandingan"]}, {"t": "📖 Bacaan Bergambar Besar", "d": "Gunakan buku cerita bergambar besar dengan teks yang mudah dan font besar. Guru membaca sambil menunjuk pada setiap perkataan. Murid membaca bersama-sama. Bincangkan gambar untuk meningkatkan kefahaman.", "st": ["Bacaan", "Visual", "Bimbingan", "Kefahaman"]}, {"t": "🎲 Dadu Perkataan", "d": "Buat dadu besar dengan perkataan atau gambar pada setiap permukaan. Murid melambung dadu dan menyebut perkataan yang tertera pada permukaan atas. Boleh dijadikan permainan berkumpulan. Aktiviti ini menyeronokkan dan mengukuhkan kosa kata.", "st": ["Permainan", "Sebutan", "Interaktif", "Kosa kata"]}, {"t": "📝 Lembaran Kerja Imbuhan", "d": "Sediakan latihan khusus untuk imbuhan awalan (meN-, ber-, ter-) dan akhiran (-kan, -i). Gunakan gambar sebagai petunjuk. Murid melengkapkan ayat dengan imbuhan yang betul. Ulang latihan dengan pelbagai contoh ayat.", "st": ["Tatabahasa", "Latih tubi", "Struktur", "Ayat"]}, {"t": "🧑‍🤝‍🧑 Kumpulan Fokus", "d": "Kumpulkan 3-4 orang murid pemulihan dalam satu kumpulan kecil. Guru memberi bimbingan intensif secara kumpulan. Setiap murid diberi peluang untuk mencuba dan mendapat maklum balas. Aktiviti ini membolehkan guru memberi perhatian lebih.", "st": ["Kumpulan kecil", "Intensif", "Bimbingan", "Fokus"]}, {"t": "🎯 Papan Permainan Ejaan", "d": "Cipta papan permainan ejaan dengan petak-petak yang mengandungi huruf. Murid melambung dadu dan bergerak mengikut bilangan petak. Mereka perlu mengeja perkataan berdasarkan huruf yang didarat. Aktiviti ini menggabungkan permainan dengan pembelajaran ejaan.", "st": ["Ejaan", "Permainan", "Visual", "Menarik"]}, {"t": "📸 Aktiviti Fotografi", "d": "Murid mengambil gambar objek di sekitar sekolah atau rumah menggunakan tablet/telefon. Kemudian mereka melabel gambar tersebut dengan perkataan yang betul. Aktiviti ini mengaitkan pembelajaran dengan dunia sebenar dan meningkatkan kreativiti.", "st": ["Kreatif", "Visual", "Teknologi", "Dunia sebenar"]}, {"t": "🎬 Video Pendek", "d": "Murid menonton video pendek (2-3 minit) yang berkaitan dengan topik pembelajaran. Selepas menonton, murid menjawab soalan mudah secara lisan atau bertulis. Tonton semula bahagian yang sukar jika perlu.", "st": ["Visual", "Digital", "Kefahaman", "Sebutan"]}, {"t": "🧩 Teka Silang Kata", "d": "Sediakan silang kata mudah dengan gambar sebagai petunjuk. Murid mengisi ruangan kosong dengan perkataan yang betul. Aktiviti ini mengukuhkan ejaan dan kosa kata secara menyeronokkan. Boleh dijalankan secara individu atau berpasangan.", "st": ["Kosa kata", "Pengukuhan", "Puzzle", "Ejaan"]}, {"t": "📑 Kad Tugasan Harian", "d": "Sediakan kad tugasan harian dengan arahan yang jelas dan ringkas untuk murid pemulihan. Setiap kad mengandungi 2-3 tugasan mudah yang boleh diselesaikan dalam 10-15 minit. Tugasan bertambah aras secara beransur-ansur.", "st": ["Rutin", "Bimbingan", "Struktur", "Konsisten"]}, {"t": "🎤 Bacaan Berirama", "d": "Murid membaca teks pendek mengikut irama atau rap yang menarik. Guru menunjuk cara bacaan berirama. Murid mengulang dengan iringan muzik atau tepukan. Aktiviti ini meningkatkan kelancaran membaca dan keyakinan.", "st": ["Bacaan", "Irama", "Seronok", "Keyakinan"]}, {"t": "🎨 Mewarna Sambil Belajar", "d": "Sediakan lembaran mewarna yang mengandungi perkataan, huruf atau konsep yang perlu dipelajari. Murid mewarna sambil menyebut perkataan atau konsep tersebut. Aktiviti ini menggabungkan pembelajaran dengan aktiviti santai yang menenangkan.", "st": ["Mewarna", "Visual", "Santai", "Kreatif"]}, {"t": "📋 Buku Panduan Mini", "d": "Murid mencipta buku panduan mini tentang topik yang sukar difahami. Buku mengandungi definisi, gambar dan contoh. Gunakan kertas A4 yang dilipat menjadi buku kecil. Aktiviti ini membantu murid merujuk semula konsep yang telah dipelajari.", "st": ["Kreatif", "Dokumentasi", "Rujukan", "Organisasi"]}, {"t": "🤖 Pembelajaran Gamifikasi", "d": "Gunakan elemen permainan seperti lencana, mata ganjaran, tahap dan cabaran untuk meningkatkan motivasi murid pemulihan. Beri lencana untuk setiap pencapaian. Kumpul mata untuk dapatkan ganjaran. Aktiviti ini meningkatkan semangat untuk belajar.", "st": ["Gamifikasi", "Motivasi", "Digital", "Ganjaran"]}, {"t": "📞 Telefon Bual (Paper Cup Phone)", "d": "Buat telefon daripada cawan kertas dan benang. Murid bercakap melalui telefon untuk meningkatkan kemahiran lisan. Aktiviti ini menyeronokkan dan mengurangkan rasa malu untuk bercakap kerana tidak berhadapan langsung dengan rakan.", "st": ["Bertutur", "Mendengar", "Kreatif", "Seronok"]}];

  '🎶 Lagu Tema Berirama: Murid menyanyikan lagu berkaitan topik sambil bertepuk tangan, kemudian guru mengaitkan lirik dengan isi pelajaran. [Dif: A - terangkan maksud lirik dan kaitkan topik, B - nyanyi dengan bimbingan, C - tepuk irama mengikut rakaman]',

/* ── Year-proof calendar helpers (used by the Settings calendar generator) ── */
function tkPad(n){return (n<10?'0':'')+n;}
function tkFmt(d){return tkPad(d.getDate())+'/'+tkPad(d.getMonth()+1)+'/'+d.getFullYear();}
function tkParseYMD(s){var p=String(s||'').split('-').map(Number);if(p.length!==3||!p[0]||!p[1]||!p[2])return null;var d=new Date(p[0],p[1]-1,p[2]);return isNaN(d.getTime())?null:d;}
function tkMonday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var dow=x.getDay();x.setDate(x.getDate()+(dow===1?0:((8-dow)%7)));return x;}
function tkGen(startYMD,weeks,holidayStr){
  var start=tkParseYMD(startYMD); if(!start)return null;
  var n=parseInt(weeks,10); if(isNaN(n)||n<1||n>60)return null;
  var hol={}; String(holidayStr||'').split(/[,\s;]+/).forEach(function(x){var v=parseInt(x,10);if(v>0)hol[v]=1;});
  var cur=tkMonday(start), out=[], counter=0;
  for(var i=1;i<=n;i++){
    var s=new Date(cur), e=new Date(cur); e.setDate(e.getDate()+4);
    if(hol[i]){out.push({m:0,s:tkFmt(s),e:tkFmt(e),t:1,b:0,l:'🎉 Cuti'});}
    else{counter++;out.push({m:counter,s:tkFmt(s),e:tkFmt(e),t:counter<=18?1:2,b:1});}
    cur.setDate(cur.getDate()+7);
  }
  return out;
}

  promoteStudents(){

  doPromote(){
    const order=['Prasekolah','Year 1','Year 2','Year 3','Year 4','Year 5','Year 6'];
    const next={'Prasekolah':'Year 1','Year 1':'Year 2','Year 2':'Year 3','Year 3':'Year 4','Year 4':'Year 5','Year 5':'Year 6','Year 6':'Graduated'};
    const news={};
    let grads=0;
    order.forEach(function(cls){
      if(!this.STUDENTS[cls]||!this.STUDENTS[cls].length)return;
      const target=next[cls];
      if(target==='Graduated'){grads+=this.STUDENTS[cls].length;return;}
      news[target]=news[target]||[];
      this.STUDENTS[cls].forEach(function(n){if(news[target].indexOf(n)<0)news[target].push(n);});
    },this);
    this.STUDENTS={};order.forEach(function(cls){if(news[cls])this.STUDENTS[cls]=news[cls];},this);
    try{localStorage.setItem('erphp_students',JSON.stringify(this.STUDENTS));}catch(e){}
    const shift={'Prasekolah':'Year 1','Year 1':'Year 2','Year 2':'Year 3','Year 3':'Year 4','Year 4':'Year 5','Year 5':'Year 6'};
    const np={};order.forEach(function(cls){var t=shift[cls];if(t&&this.progress[cls])np[t]=this.progress[cls];},this);
    this.progress=np;
    const nph={};order.forEach(function(cls){var t=shift[cls];if(t&&this.tpHist[cls])nph[t]=this.tpHist[cls];},this);
    this.tpHist=nph;
    this.saveProg();this.saveTpHist();this.sv();
    alert(this.ttl('mur_promoted',{g:grads}));
  },

    let n=0;
    const self=this;

      if(!q||q.id===p.id) return;

      if(!Array.isArray(q._students)||!q._students.length){ try{ q._tpInit=true; self.ls(q); }catch(e){} }
      if(!Array.isArray(q._students)) return;
      q._students.forEach(function(s){

      {c:'Tahun 5',d:'Khamis',p:'1',s:'RBT',n:'🛠️ RBT'},
      {c:'Tahun 6',d:'Jumaat',p:'P',s:'PJ',n:'🏃 PJ'},
      {c:'Tahun 2',d:'Jumaat',p:'2',s:'BC',n:'📝 BC'},
      {c:'Tahun 6',d:'Jumaat',p:'9',s:'MZ',n:'🎵 MZ'}
    ];
    // Seed the built-in demo timetable only on a fresh install (never resurrect a deleted teacher).
    if(!localStorage.getItem('erphp_slots'))this.SLOTS.SAW=sawSlots;
    try{this.examGen();}catch(e){}
    this.sv();
  },

  /* ── 2027 Takwim Preset & Carry-Forward & AI Content & Exam Generator ── */
  loadTakwimPreset(yr){
    const list=yr===2026?TAKWIM_2026:TAKWIM_2027;
    this.TAKWIM=JSON.parse(JSON.stringify(list));
    this.session=String(yr);
    this.wkStale=false;
    try{localStorage.setItem('esess',this.session);localStorage.setItem('etakwim',JSON.stringify(this.TAKWIM));}catch(e){}
    this.currentWeek=this._aWk();
    this.sv();
    alert('Takwim KPM '+yr+' ('+this.TAKWIM.filter(w=>w.m>0).length+' minggu pengajaran) dimuatkan.');
  },
  carryForward(p){
    if(!p)return;
    const c=this.dupPlan(p);
    const w=parseInt(p._wk,10);
    if(!isNaN(w)){c._wk=String(w+1);c.d=this.shiftDate(p.d,7);}
    this.rph=[c,...this.rph];
    this.pushHist('Tangguh Minggu Depan');
    this.sv();
    alert('RPH '+p.sn+' ('+p.c+') ditangguhkan & disalin ke Minggu '+c._wk+'.');
  },
  async aiGenPlan(p){
    if(!p)return;
    this.snap(p);
    p._aiBusy='⏳ AI…';
    const yr=this.rptYearNum(p.c)||3;
    const lang=this.lg(p.s,this.tg);
    const payload={
      subject:p.s,
      year:yr,
      language:lang,
      week:parseInt(p._wk,10)||1,
      sk:p.sk||[],
      sp:p.sp||[],
      theme:(p.tema&&p.tema[0])||'',
      unit:(p.unit&&p.unit[0])||'',
      topic:(p.unit&&p.unit[0])||'',
      studentCount:(p._students&&p._students.length)||25
    };
    try{
      const resp=await fetch('/api/generate-content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(resp.ok){
        const data=await resp.json();
        if(data&&data.ok){
          if(Array.isArray(data.objectives)&&data.objectives.length)p.obj=data.objectives;
          if(Array.isArray(data.successCriteria)&&data.successCriteria.length)p.kj=data.successCriteria;
          if(data.activities){
            const phases=lang==='en'?['🎯 Set Induction','📚 Pre-lesson','📖 Lesson Development','💡 Post-lesson','🎯 Closure']:lang==='bm'?['🎯 Set Induksi','📚 Pra-PdP','📖 Perkembangan PdP','💡 Pasca-PdP','🎯 Penutup']:['🎯 导入','📚 课前活动','📖 主要教学','💡 课后活动','🎯 总结'];
            const keys=['setInduction','preLesson','development','postLesson','closure'];
            const duDef=[8,7,22,5,5];
            p.acts=keys.map((k,i)=>({ph:phases[i],d:data.activities[k]||'',dr:duDef[i],t:'',s:''}));
          }
          if(Array.isArray(data.remedial)&&data.remedial.length){
            p.rem=data.remedial.map((txt,i)=>({t:'🩺 Pemulihan '+(i+1),d:String(txt),st:[]}));
          }
          if(data.reflection)p.ref=data.reflection;
          p._aiBusy='';
          this.sv();
          return;
        }
      }
    }catch(e){}
    // Offline fallback: align to SP & regenerate activities
    this.alignToSp(p);
    p._aiBusy='';
    this.sv();
  },
  examThemesForYear(){
    const y=String(this.ex.year||3);
    if(typeof window.EXAM_THEMES!=='undefined'&&window.EXAM_THEMES[y])return window.EXAM_THEMES[y];
    return ['World of Self, Family and Friends','World of Stories','World of Knowledge'];
  },
  examSyncWeekTheme(){
    const y=String(this.ex.year||3);
    const w=String(this.ex.week||0);
    if(w!=='0'&&typeof window.EXAM_WEEK_MAP!=='undefined'&&window.EXAM_WEEK_MAP[y]&&window.EXAM_WEEK_MAP[y][w]){
      this.ex.theme=window.EXAM_WEEK_MAP[y][w];
    }
  },
  examSyncFromRph(){
    const wk=parseInt(this.currentWeek,10);
    if(!isNaN(wk)&&wk>=1&&wk<=40){
      this.ex.week=wk;
      this.examSyncWeekTheme();
    }
    const biPlan=(this.rph||[]).find(p=>p.s==='BI'&&(String(p._wk)===String(this.currentWeek)||!this.currentWeek));
    if(biPlan){
      const y=this.rptYearNum(biPlan.c);
      if(y>=1&&y<=6)this.ex.year=y;
      this.examSyncWeekTheme();
    }
    this.examGen();
  },
  openExamFromPlan(p){
    if(!p)return;
    const y=this.rptYearNum(p.c);
    if(y>=1&&y<=6)this.ex.year=y;
    const w=parseInt(p._wk,10);
    if(!isNaN(w)&&w>=1&&w<=40)this.ex.week=w;
    this.examSyncWeekTheme();
    this.a='exam';
    this.examGen();
  },
  examRegen(){
    this.ex.seed=(parseInt(this.ex.seed,10)||1)+Math.floor(Math.random()*7)+1;
    const themes=this.examThemesForYear();
    if(themes.length&&this.ex.theme){
      const idx=themes.indexOf(this.ex.theme);
      this.ex.theme=themes[(idx+1)%themes.length];
    }
    this.examGen();
  },
  async examGen(){
    this.ex.busy=true;
    const payload={
      year:Number(this.ex.year)||3,
      exam_type:this.ex.exam_type||'upsa',
      difficulty:this.ex.difficulty||'medium',
      seed:Number(this.ex.seed)||1,
      week:Number(this.ex.week)||0,
      theme:this.ex.theme||'',
      school:(this.school&&this.school.n)||'SJK(C) PIN MIN, BIDOR',
      teacher:this.tN()||'',
      session:this.session||'2027',
      pictures:!!this.ex.pictures,
      answer_sheet:!!this.ex.answer_sheet,
      answer_key:!!this.ex.answer_key,
      ab_set:!!this.ex.ab_set,
      want_docx:true
    };
    try{
      const resp=await fetch('/api/exam',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(resp.ok){
        const data=await resp.json();
        if(data&&data.ok){
          this.ex.res=data;
          this.ex.mode='api';
          this.ex.busy=false;
          return;
        }
      }
    }catch(e){}
    // Offline fallback from bundled EXAM_OFFLINE_CACHE
    const yKey=String(payload.year);
    if(typeof window.EXAM_OFFLINE_CACHE!=='undefined'&&window.EXAM_OFFLINE_CACHE[yKey]){
      this.ex.res=JSON.parse(JSON.stringify(window.EXAM_OFFLINE_CACHE[yKey]));
      this.ex.mode='offline';
    }
    this.ex.busy=false;
  },
  examDlDocx(key,suffix){
    if(!this.ex.res||!this.ex.res.docx||!this.ex.res.docx[key])return;
    const b64=this.ex.res.docx[key];
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    const et=(this.ex.exam_type||'upsa').toUpperCase();
    a.download=et+'_Year'+this.ex.year+'_BI_Set'+this.ex.seed+(suffix||'')+'.docx';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  },
  examPrint(){
    if(!this.ex.res||!this.ex.res.html)return;
    const w=window.open('','_blank');
    if(!w){alert('Sila benarkan popup untuk mencetak.');return;}
    let htmlContent=this.ex.res.html.paper||'';
    if(this.ex.view==='key'){
      htmlContent='<!doctype html><html><head><meta charset="utf-8"><title>Answer Key & JSU</title><style>body{font-family:sans-serif;padding:12mm}table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:4px 8px;font-size:10pt}</style></head><body>'+(this.ex.res.html.answer_key||'')+(this.ex.res.html.jsu||'')+'</body></html>';
    }else if(this.ex.view==='sheet'){
      htmlContent='<!doctype html><html><head><meta charset="utf-8"><title>Answer Sheet</title><style>body{font-family:sans-serif;padding:12mm}table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:4px 8px;font-size:10pt}</style></head><body>'+(this.ex.res.html.answer_sheet||'')+'</body></html>';
    }else if(this.ex.view==='marks'){
      htmlContent=this.ex.res.html.marksheet||htmlContent;
    }
    w.document.write(htmlContent);
    w.document.close();
    setTimeout(()=>{try{w.focus();w.print();}catch(e){}},350);
  },
  examClassPupils(){
    const cls='Year '+(this.ex.year||3);
    return (this.STUDENTS&&this.STUDENTS[cls])?this.STUDENTS[cls]:[];
  },
  examScoreGet(stu,part){
    const cls='Year '+(this.ex.year||3);
    return (this.ex.scores[cls]&&this.ex.scores[cls][stu]&&this.ex.scores[cls][stu][part]!=null)?this.ex.scores[cls][stu][part]:18;
  },
  examScoreSet(stu,part,val){
    const cls='Year '+(this.ex.year||3);
    if(!this.ex.scores[cls])this.ex.scores[cls]={};
    if(!this.ex.scores[cls][stu])this.ex.scores[cls][stu]={obj:18,wrt:16};
    let n=Math.max(0,Math.min(25,parseInt(val,10)||0));
    this.ex.scores[cls][stu][part]=n;
    try{localStorage.setItem('eexam_scores',JSON.stringify(this.ex.scores));}catch(e){}
  },
  examScoreTotal(stu){
    return (+this.examScoreGet(stu,'obj')||0)+(+this.examScoreGet(stu,'wrt')||0);
  },
  examScoreTp(stu){
    const tot=this.examScoreTotal(stu);
    const pct=tot*2;
    if(pct>=85)return 6;
    if(pct>=70)return 5;
    if(pct>=55)return 4;
    if(pct>=40)return 3;
    if(pct>=20)return 2;
    return 1;
  },
  examApplyMarksToTp(){
    const cls='Year '+(this.ex.year||3);
    const pupils=this.examClassPupils();
    if(!pupils.length)return;
    if(!this.progress[cls])this.progress[cls]={};
    pupils.forEach(stu=>{
      const tp=this.examScoreTp(stu);
      this.progress[cls][stu]=tp;
    });
    // Also sync to any BI RPH plans for this class
    this.rph.forEach(p=>{
      if(this.cohort(p)===cls&&p.s==='BI'&&Array.isArray(p._students)){
        p._students.forEach(s=>{
          if(s&&s.n&&this.progress[cls][s.n]!=null){
            s.tp=this.progress[cls][s.n];
            s.c=s.tp<=2?'Bimbingan tambahan diperlukan dalam kemahiran asas.':s.tp<=4?'Bimbingan sederhana untuk meningkatkan kefahaman.':'Aktiviti pengayaan untuk mencabar pemikiran.';
          }
        });
      }
    });
    this.saveProg();
    this.sv();
    alert('TP daripada markah peperiksaan Tahun '+this.ex.year+' telah disimpan ke Rekod Transit & Prestasi ('+pupils.length+' murid)!');
  },
}));});
</script>
