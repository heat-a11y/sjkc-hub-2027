const ACTS = {"bm": {"i": ["🎵 Murid menyanyikan lagu bertema yang berkaitan dengan topik pembelajaran yang akan diajar. Guru memimpin nyanyian dengan iringan gitar atau rakaman audio sambil menayangkan lirik lagu di papan putih. Murid diminta membuat gerakan kreatif yang sesuai dengan lirik lagu secara berkumpulan. Selepas nyanyian, guru bersoal jawab dengan murid tentang isi lagu untuk merangsang pemikiran dan mengaitkan dengan topik pembelajaran. [Dif: A - Nyanyi dengan gerakan kreatif dan ubah suai lirik lagu, B - Nyanyi dengan bimbingan lirik dan tunjuk cara guru, C - Dengar lagu sambil menepuk irama mengikut rentak]", "🎬 Guru menayangkan video pendek (2-3 minit) yang berkaitan dengan topik pembelajaran seperti fenomena alam, situasi harian atau kisah menarik. Sebelum tayangan, guru mengemukakan 2-3 soalan rangsangan untuk membina skema sedia ada murid. Semasa tayangan, murid diminta mengambil nota ringkas atau mengingati maklumat penting. Selepas tayangan, murid dibimbing untuk meneka tajuk pembelajaran berdasarkan isi video dan perkaitan dengan pengalaman sedia ada. [Dif: A - Mengaitkan isi video dengan tajuk pembelajaran dalam ayat lengkap dan memberi contoh, B - Meneka tajuk pembelajaran dalam satu perkataan atau frasa, C - Memadankan gambar dari video dengan tajuk pembelajaran]", "🧩 Permainan Cari Pasangan dijalankan dengan menyediakan kad bergambar dan kad berperkataan. Setiap murid memegang sekeping kad secara rawak. Apabila guru memberi isyarat, murid bergerak mencari rakan yang memegang kad padanan (gambar dengan perkataan). Pasangan yang lengkap duduk bersama dan membaca kad masing-masing. Aktiviti ini membantu murid menguasai kosa kata baru secara menyeronokkan. [Dif: A - Padan perkataan dengan ayat penerangan yang lengkap, B - Padan gambar dengan perkataan yang betul, C - Padan gambar dengan gambar yang sama]", "🎭 Guru membawa masuk boneka jari atau puppets dan bercerita dengan intonasi yang menarik dan ekspresi muka yang pelbagai. Boneka dijadikan sebagai alat perantara untuk menyampaikan isi cerita yang berkaitan dengan topik. Semasa bercerita, guru berhenti di bahagian-bahagian tertentu untuk bertanya soalan ramalan. Murid dibimbing meneka watak, jalan cerita, konflik dan pengajaran yang boleh diambil daripada cerita tersebut. [Dif: A - Bercerita semula menggunakan ayat sendiri dengan kreatif, B - Mengulang dialog watak utama dengan intonasi, C - Menamakan watak-watak dalam cerita]", "🖼️ Guru menyediakan 4-6 keping gambar bersiri yang tidak tersusun. Murid secara berkumpulan diminta menyusun gambar mengikut urutan yang betul berdasarkan pemahaman mereka tentang tema. Selepas selesai menyusun, setiap kumpulan menerangkan jalan cerita yang terbentuk. Guru membimbing murid mengenal pasti urutan yang paling logik dan munasabah. [Dif: A - Menyusun gambar dan menghasilkan cerita lengkap dengan ayat sendiri, B - Menyusun gambar dan membaca ayat penerangan yang disediakan, C - Menyusun gambar mengikut urutan dengan bimbingan]", "❓ Guru membawa objek maujud atau gambar yang menarik dan berkaitan dengan topik. Objek diletakkan di hadapan kelas atau diedarkan kepada kumpulan. Guru mengemukakan soalan rangsangan seperti \"Apa yang kamu nampak?\", \"Apa yang kamu rasa?\" atau \"Apakah yang ingin kamu tahu tentang objek ini?\" untuk membangkitkan rasa ingin tahu murid. Murid menjawab secara lisan berdasarkan pemerhatian mereka. [Dif: A - Jawab dalam ayat lengkap dengan sebab dan contoh, B - Jawab dalam frasa yang sesuai, C - Menunjuk dan mengangguk atau geleng kepala]", "🔄 Permainan Cari Perbezaan dijalankan dengan menayangkan dua gambar yang hampir serupa tetapi mempunyai beberapa perbezaan. Murid secara berkumpulan atau individu diminta membandingkan dan mencari sebanyak mungkin perbezaan. Aktiviti ini melatih kemahiran pemerhatian dan tumpuan murid. [Dif: A - Menerangkan perbezaan dalam ayat lengkap, B - Mencari dan menunjuk perbezaan yang ditemui, C - Memadankan objek yang sama dalam kedua-dua gambar]", "👂 Guru memainkan bunyi atau audio pendek yang berkaitan dengan topik seperti bunyi haiwan, bunyi kenderaan, bunyi alam atau bunyi persekitaran. Murid mendengar dengan teliti dan meneka sumber bunyi tersebut. Aktiviti ini merangsang pendengaran dan meningkatkan kemahiran mendengar aktif dalam kalangan murid. [Dif: A - Meneka dan menghuraikan ciri-ciri bunyi dengan lengkap, B - Meneka sumber bunyi dengan tepat, C - Memilih gambar yang sesuai dengan bunyi yang didengar]", "🎈 Permainan Bola Berbual: Murid duduk dalam bulatan. Guru memulakan permainan dengan mengemukakan satu soalan sambil memegang bola. Bola dihantar secara rawak kepada murid. Penerima bola perlu menjawab soalan dengan yakin sebelum menghantar bola kepada rakan yang lain. Aktiviti ini membina keyakinan murid untuk bercakap di hadapan kumpulan. [Dif: A - Menjawab soalan KBAT dengan ayat lengkap dan alasan, B - Menjawab soalan mudah dengan frasa, C - Membantu rakan menjawab dengan memberi petunjuk]", "📦 Kotak Misteri: Guru menyediakan sebuah kotak tertutup yang mengandungi objek berkaitan topik. Murid secara bergilir memasukkan tangan ke dalam kotak dan meraba objek tanpa melihat. Mereka perlu meneka objek berdasarkan deria sentuhan. Selepas meneka, objek dikeluarkan untuk disahkan. Aktiviti ini merangsang rasa ingin tahu dan melatih kemahiran membuat inferens. [Dif: A - Menerangkan ciri-ciri objek yang diraba dengan lengkap, B - Meneka objek dengan tepat, C - Merasa dan menunjuk gambar objek yang sama]", "🎼 Teka Bunyi: Guru memainkan bunyi-bunyian seperti hujan, angin, haiwan atau kenderaan. Murid dengar dan teka bunyi tersebut. Aktiviti ini merangsang pendengaran dan mengaitkan bunyi dengan tema pembelajaran. Guru mengaitkan bunyi dengan topik yang akan diajar. [Dif: A - Menerangkan kaitan bunyi dengan topik dalam ayat lengkap, B - Meneka bunyi dengan tepat, C - Menunjuk gambar sumber bunyi]", "👀 Cuci Mata Bergambar: Guru menayangkan koleksi gambar menarik berkaitan topik selama 30 saat. Murid diminta mengingati seberapa banyak gambar yang boleh. Selepas tayangan, murid menyenaraikan gambar yang diingati. Aktiviti ini merangsang ingatan visual dan fokus. [Dif: A - Menyenaraikan dan menghubung kait gambar dalam ayat, B - Menyebut gambar yang diingati, C - Menunjuk gambar yang sama pada kad]", "🤔 Soalan Provokatif: Guru mengemukakan soalan yang mencabar pemikiran seperti 'Apa akan jadi jika...' atau 'Bolehkah kita...'. Murid diberi masa berfikir sebelum menjawab. Soalan provokatif merangsang rasa ingin tahu dan pemikiran kritis. [Dif: A - Menjawab soalan provokatif dengan alasan dan contoh, B - Memberi pendapat ringkas, C - Memilih jawapan yang diberi]", "🎯 Tembak Sasar: Guru melukis sasaran di papan putih dengan tiga bulatan. Murid membaling dart magnet atau bola lembut. Soalan ditulis pada setiap bulatan mengikut aras kesukaran. Murid menjawab soalan berdasarkan tempat dart mendarat. [Dif: A - Soalan aras tinggi di bulatan tengah, B - Soalan sederhana di bulatan kedua, C - Soalan mudah di bulatan luar]", "🧠 Imbas Kembali: Murid menutup mata dan mengimbas kembali apa yang telah dipelajari dalam sesi lepas. Guru membimbing dengan soal jawab ringkas. Aktiviti ini mengaktifkan memori jangka panjang. [Dif: A - Menyebut 5 perkara yang diingati dalam ayat lengkap, B - Menyebut 3 perkataan berkaitan, C - Menunjuk gambar dari sesi lepas]", "🎪 Drama Spontan: Guru memberikan situasi ringkas dan murid melakonkan secara spontan di hadapan kelas. Lakonan berkaitan dengan topik yang akan diajar. Aktiviti ini membina keyakinan dan kreativiti. [Dif: A - Melakonkan watak dengan dialog dan ekspresi, B - Melakonkan watak dengan bimbingan, C - Menjadi pemerhati dan memberi komen]", "🔦 Sorotan Cerita: Guru menceritakan kisah pendek yang menarik tanpa menghabiskan cerita. Murid dikehendaki meneka pengakhiran cerita. Cerita dikaitkan dengan topik pembelajaran. Ini merangsang imaginasi dan inferens. [Dif: A - Mereka cipta pengakhiran sendiri dengan kreatif, B - Memilih pengakhiran daripada pilihan, C - Melukis gambar pengakhiran cerita]", "🎲 Dadu Soalan: Guru menyediakan dadu besar dengan soalan pada setiap muka. Murid secara bergilir melambung dadu dan menjawab soalan yang tertera. Soalan berkaitan dengan tajuk atau pengalaman sedia ada. [Dif: A - Soalan aras KBAT pada muka dadu, B - Soalan aras sederhana, C - Soalan bergambar dengan bantuan]", "🌈 Pelangi Kata: Guru menulis perkataan kunci pada jalur-jalur kertas pelbagai warna. Murid memilih satu warna dan membaca perkataan tersebut. Kemudian murid menerangkan maksud perkataan dalam ayat mudah. [Dif: A - Menerangkan maksud dan memberi contoh ayat, B - Membaca dan menyebut maksud, C - Mengecam perkataan dan menunjuk gambar]", "🕵️ Detektif Kelas: Guru menyembunyikan beberapa objek atau gambar di merata kelas. Murid menjadi detektif dan mencari objek tersembunyi. Setiap objek dikaitkan dengan topik pembelajaran. [Dif: A - Menerangkan kaitan objek dengan topik dalam ayat, B - Menamakan objek yang dijumpai, C - Menunjuk objek dan meniru bunyi]", "🌊 Gelombang Soalan: Murid duduk dalam bulatan. Guru memulakan dengan bertanya soalan kepada murid di sebelah kiri. Murid menjawab dan seterusnya bertanya soalan kepada rakan di sebelah. Soalan berkaitan tajuk berjalan seperti gelombang. [Dif: A - Menanya soalan aras tinggi kepada rakan, B - Menjawab soalan dengan tepat, C - Mendengar dan meniru jawapan rakan]", "🔐 Kotak Misteri 2: Guru menyediakan 3-4 kotak tertutup bernombor. Setiap kotak mengandungi petunjuk berkaitan topik. Murid secara berkumpulan memilih kotak untuk dibuka dan menyelesaikan cabaran. [Dif: A - Menyelesaikan cabaran tanpa bantuan, B - Menyelesaikan dengan bimbingan rakan, C - Mendapat bantuan guru]", "⭐ Pusingan Bintang: Guru melukis bintang di papan dengan soalan pada setiap hujung bintang. Murid melambung dadu dan menjawab soalan berdasarkan nombor yang diperoleh. Aktiviti ini menyeronokkan dan menguji kefahaman sedia ada. [Dif: A - Soalan KBAT berbentuk penyelesaian masalah, B - Soalan pemahaman aras sederhana, C - Soalan kemahiran asas]", "🌿 Alam Sekitar: Guru membawa murid ke luar kelas atau tingkap untuk memerhati alam sekitar. Murid menceritakan apa yang mereka lihat, dengar dan rasa. Perkaitan dengan topik dibuat melalui soal jawab. [Dif: A - Menghuraikan pemerhatian dalam perenggan pendek, B - Menyebut 3-5 perkara yang diperhatikan, C - Menunjuk dan menamakan objek]", "📞 Telefon Cakera: Guru menyediakan telefon mainan atau 'telefon cawan'. Murid bercakap secara berpasangan tentang topik. Aktiviti ini membina kemahiran komunikasi dan keyakinan bercakap. [Dif: A - Berdialog tentang topik dengan ayat lengkap, B - Bertanya dan menjawab soalan mudah, C - Mendengar dan mengulang]", "🎤 Karaoke Mini: Guru menyediakan mikrofon mainan dan lirik lagu bertema. Murid menyanyi secara solo atau berkumpulan dengan iringan muzik. Aktiviti ini membina keyakinan dan mengingati konsep. [Dif: A - Menyanyi dan mencipta gerakan sendiri, B - Menyanyi dengan bimbingan lirik, C - Menepuk irama sambil mendengar]", "🧩 Teka Silang Kata Mini: Guru menyediakan grid silang kata mudah dengan 4-6 perkataan. Murid secara berpasangan mengisi ruang kosong berdasarkan klue bergambar. [Dif: A - Mengisi semua ruang tanpa bantuan, B - Mengisi dengan bimbingan rakan, C - Memadankan perkataan dengan gambar]", "🏆 Pertandingan Kumpulan: Guru membahagikan murid kepada 4-5 kumpulan. Soalan berkaitan tajuk dikemukakan. Kumpulan pertama yang menjawab dengan betul mendapat mata. [Dif: A - Soalan aras tinggi untuk mata bonus, B - Soalan aras sederhana, C - Soalan asas untuk semua kumpulan]", "📸 Tangkap Gambar: Guru menunjukkan gambar selama 5 saat dan menyembunyikannya. Murid melukis atau menerangkan gambar tersebut dari ingatan. Aktiviti ini melatih daya ingatan visual. [Dif: A - Melukis dan menerangkan gambar dengan lengkap, B - Melukis gambar mengikut ingatan, C - Memilih gambar yang sama dari beberapa pilihan]", "🎭 Pantomim: Guru menunjukkan aksi tanpa suara (pantomim) berkaitan topik. Murid meneka apa yang dilakonkan. Aktiviti ini menyeronokkan dan merangsang pemikiran kreatif. [Dif: A - Melakonkan pantomim sendiri untuk ditonton rakan, B - Meneka aksi pantomim dengan tepat, C - Meniru aksi guru]"], "p": ["📇 Guru memperkenalkan kosa kata baru menggunakan kad imbasan (flashcards) berwarna dan bersaiz besar. Setiap kad mengandungi gambar yang menarik dan perkataan yang jelas. Guru menunjukkan kad sambil menyebut perkataan dengan sebutan yang betul dan intonasi yang sesuai. Murid mengecam, mengeja dan menyebut perkataan secara kelas, kumpulan dan individu. Kaitkan gambar dengan perkataan untuk memudahkan kefahaman. [Dif: A - Membina ayat menggunakan perkataan baru, B - Menyebut dan mengeja perkataan, C - Mengulang sebutan selepas guru]", "👥 Perbincangan kumpulan kecil menggunakan teknik Think-Pair-Share (Fikir-Pasang-Kongsi). Guru mengemukakan soalan atau isu berkaitan topik. Murid diberi masa 1-2 minit untuk berfikir secara individu (Think). Kemudian mereka berbincang dengan pasangan (Pair) untuk berkongsi idea. Akhirnya, beberapa pasangan dipilih untuk berkongsi dengan seluruh kelas (Share). [Dif: A - Kongsi idea dalam ayat lengkap dengan alasan, B - Kongsi pandangan dalam frasa ringkas, C - Mendengar dan mengulang idea rakan]", "🔗 Guru menyediakan kad bergambar dan kad berperkataan. Murid diminta memadankan gambar dengan perkataan yang betul. Aktiviti dilakukan secara individu atau berpasangan di atas meja atau papan putih. Guru membimbing dan memberi maklum balas. Sebut perkataan dengan kuat selepas padanan dibuat. [Dif: A - Padankan dan menulis ayat mudah, B - Padankan dan menyebut perkataan, C - Padankan gambar yang sama]", "🗣️ Latihan mendengar dan mengulang sebutan frasa penting. Guru menyebut frasa dengan intonasi dan tekanan yang betul. Murid mendengar dengan teliti dan mengulang sebutan secara kelas (choral repetition), kumpulan kecil dan individu. Beri penekanan pada sebutan perkataan sukar dan intonasi ayat. [Dif: A - Menyebut frasa dengan intonasi dan ekspresi yang betul, B - Menyebut frasa mudah dengan bantuan, C - Menyebut perkataan utama]", "📋 Permainan Kad Kategori: Murid diberikan kad perkataan dan diminta mengelaskannya ke dalam kumpulan yang betul seperti haiwan, tumbuhan, warna atau bentuk. Guru menyediakan kategori di papan tulis atau atas meja. Murid menampal kad di bawah kategori yang betul sambil menyebut perkataan tersebut. [Dif: A - Mengelaskan dan memberi alasan pengelasan, B - Mengelaskan dengan bimbingan rakan, C - Memadankan dengan contoh yang diberi]", "📝 Latihan lisan secara kelas: Guru menunjukkan gambar atau objek. Murid menjawab secara serentak (choral response) untuk membina keyakinan. Kemudian secara individu untuk penilaian. Guru memberi maklum balas segera. [Dif: A - Jawab dalam ayat lengkap, B - Jawab dalam satu perkataan, C - Angkat tangan atau tunjuk jawapan]", "🎯 Aktiviti menyusun kad perkataan mengikut kategori masa seperti Minggu, Bulan dan Tahun. Murid diberikan kad-kad perkataan yang bercampur aduk dan diminta menyusun mengikut urutan yang betul secara berkumpulan. [Dif: A - Menyusun dan membina ayat tentang masa, B - Menyusun kad mengikut urutan, C - Memadankan kad dengan gambar]", "🎲 Permainan papan pendidikan: Murid membaling dadu dan bergerak mengikut bilangan petak. Setiap petak mengandungi soalan berkaitan topik seperti teka perkataan, jawab soalan atau buat ayat. Murid perlu menjawab soalan dengan betul untuk terus bergerak. [Dif: A - Soalan aras KBAT, B - Soalan aras sederhana, C - Membantu rakan menjawab soalan]", "🃏 Kad Teka: Murid memilih kad dan perlu menerangkan perkataan kepada rakan tanpa menyebut perkataan tersebut. Rakan lain meneka perkataan yang diterangkan. Aktiviti ini melatih kemahiran berfikir dan berkomunikasi. [Dif: A - Menerangkan menggunakan ayat lengkap, B - Menggunakan bahasa badan dan isyarat, C - Menunjukkan gambar kepada rakan]", "✏️ Murid melukis peta minda ringkas tentang pengetahuan sedia ada berkaitan topik. Guru membimbing murid mengenal pasti idea utama dan idea sampingan. Murid melukis peta minda masing-masing di atas kertas atau menggunakan aplikasi digital. [Dif: A - Peta minda lengkap dengan sub-topik dan cabang, B - Peta minda separa dengan bimbingan, C - Mewarna dan menampal gambar pada peta]", "📖 Bacaan Bergilir: Murid membaca teks pendek secara bergilir dalam kumpulan. Setiap murid membaca 1-2 ayat. Guru membetulkan sebutan dan intonasi. Aktiviti ini memupuk kemahiran membaca dan keyakinan diri. [Dif: A - Membaca dengan intonasi dan sebutan yang betul, B - Membaca ayat mudah dengan bimbingan, C - Membaca perkataan demi perkataan]", "🃏 Permainan Kad Imbasan: Guru menyediakan kad imbasan bergambar. Murid secara berpasangan meneka perkataan berdasarkan gambar. Kad dikumpul mengikut tema. [Dif: A - Membina ayat menggunakan perkataan pada kad, B - Menyebut perkataan dengan betul, C - Memadankan kad dengan objek sebenar]", "✂️ Gunting dan Padan: Murid mengunting gambar dan perkataan dari majalah atau lembaran kerja. Kemudian memadankan gambar dengan perkataan yang betul dalam buku latihan. [Dif: A - Menulis ayat berdasarkan padanan, B - Memadankan dan menampal dengan kemas, C - Mewarna gambar yang telah dipadankan]", "🎵 Lagu Ejaan: Guru mengajar murid mengeja perkataan melalui lagu atau nyanyian berirama. Murid mengeja sambil menepuk meja atau bertepuk tangan. [Dif: A - Mengeja perkataan suku kata demi suku kata, B - Mengeja perkataan 3-4 huruf, C - Mengeja sambil melihat kad perkataan]", "🗣️ Bual Bicara Pasangan: Murid berpasangan dan berbual tentang topik menggunakan frasa yang diberi. Guru menyediakan kerangka perbualan. Setiap pasangan mendapat masa 2-3 minit. [Dif: A - Berbual tanpa kerangka dengan ayat sendiri, B - Menggunakan kerangka perbualan yang diberi, C - Mengulang frasa yang disebut rakan]", "🧮 Susun Kad Huruf: Murid diberi set kad huruf. Guru menyebut perkataan, murid menyusun huruf mengikut urutan yang betul. Aktiviti mengukuhkan kemahiran mengeja dan mengenal huruf. [Dif: A - Menyusun huruf menjadi perkataan tanpa contoh, B - Menyusun huruf berpandukan kad perkataan, C - Meniru susunan huruf dari rakan]", "🎯 Lempar dan Sebut: Guru melukis bulatan bernombor di lantai. Murid membaling bola kecil ke dalam bulatan. Murid menyebut perkataan atau frasa berdasarkan nombor yang kena. [Dif: A - Menyebut dan membina ayat, B - Menyebut frasa dengan betul, C - Menyebut perkataan asas]", "📝 Salin Cantik: Murid menyalin ayat pendek dalam buku latihan dengan tulisan yang kemas dan cantik. Guru menekankan aspek tulisan, jarak huruf dan kebersihan. [Dif: A - Menyalin perenggan pendek dengan tulisan kemas, B - Menyalin 2-3 ayat mudah, C - Menyalin perkataan mengikut titik-titik]", "🔍 Cari dan Warnakan: Murid mencari perkataan tersembunyi dalam grid huruf. Perkataan yang ditemui diwarnakan. Aktiviti ini mengukuhkan kemahiran mengecam perkataan. [Dif: A - Mencari 6-8 perkataan tersembunyi, B - Mencari 4-5 perkataan mudah, C - Mencari perkataan dengan bantuan gambar]", "🎪 Gerai Bacaan: Guru menyediakan 3-4 gerai bacaan dengan bahan bacaan berbeza (cerita, fakta, puisi, komik). Murid melawat setiap gerai dan membaca bahan yang disediakan. [Dif: A - Membaca dan menulis ringkasan, B - Membaca dan menyebut isi penting, C - Melihat gambar dan membaca setakat mampu]", "📇 Kad Bergilir: Guru menyediakan kad soalan dan kad jawapan. Murid secara bergilir mengambil kad soalan dan mencari pasangan jawapan yang betul di sudut lain kelas. [Dif: A - Menjawab soalan pemahaman, B - Memadankan soalan dengan jawapan, C - Memadankan gambar dengan perkataan]", "✏️ Bulatkan Jawapan: Guru mengedarkan lembaran kerja dengan soalan pelbagai aras. Murid membaca soalan dan membulatkan jawapan yang betul. Aktiviti ini melatih kemahiran membaca dan memahami. [Dif: A - Menjawab soalan pemahaman dan menulis ayat, B - Membulatkan jawapan yang betul, C - Mewarna jawapan yang betul]", "🗂️ Portfolio Mini: Murid menyusun dan mengemas kini portfolio pembelajaran. Guru membimbing murid memilih hasil kerja terbaik untuk disimpan dalam portfolio. [Dif: A - Menulis refleksi ringkas tentang hasil kerja, B - Menyusun hasil kerja mengikut tarikh, C - Mewarna muka depan portfolio]", "🔗 Rantai Perkataan: Murid duduk dalam bulatan. Murid pertama menyebut satu perkataan. Murid seterusnya menyebut perkataan yang bermula dengan huruf terakhir perkataan sebelumnya. Aktiviti ini mengukuhkan kosa kata. [Dif: A - Menyebut perkataan suku kata yang mencabar, B - Menyebut perkataan 3-4 huruf, C - Menyebut perkataan dengan bantuan rakan]", "🎲 Papan Permainan: Guru menyediakan papan permainan ringkas dengan laluan bernombor. Murid melambung dadu dan bergerak mengikut bilangan. Setiap petak mengandungi tugasan seperti membaca, mengeja atau menyebut. [Dif: A - Tugasan aras tinggi seperti membina ayat, B - Tugasan aras sederhana, C - Tugasan asas seperti menunjuk]", "📣 Pengumuman: Murid secara bergilir menjadi 'penyampai berita' dan mengumumkan fakta atau maklumat ringkas di hadapan kelas menggunakan mikrofon. [Dif: A - Menyampaikan maklumat dengan yakin dan lancar, B - Membaca teks pengumuman yang disediakan, C - Membaca sepatah dua perkataan]", "🖍️ Mewarna Kod: Guru menyediakan lembaran mewarna dengan kod warna berdasarkan perkataan. Murid membaca perkataan dan mewarna mengikut kod yang diberikan. [Dif: A - Mewarna dengan kemas dan mengikut garis, B - Mewarna dengan bimbingan kod warna, C - Mewarna secara bebas]", "👥 Kongsi Rakan: Murid berkongsi apa yang mereka tahu tentang topik dengan rakan sebelah. Aktiviti ini dijalankan dalam masa 2 minit. Kemudian beberapa orang murid diminta berkongsi dengan kelas. [Dif: A - Berkongsi 4-5 maklumat berkaitan, B - Berkongsi 2-3 maklumat ringkas, C - Mendengar dan mengulang maklumat rakan]", "📋 Senarai Semak: Murid menyemak pemahaman mereka menggunakan senarai semak bergambar. Mereka menanda ✓ pada perkara yang sudah tahu dan ? pada perkara yang belum tahu. [Dif: A - Menulis senarai sendiri, B - Menanda pada senarai yang disediakan, C - Menanda dengan bantuan guru]", "🎬 Tayangan Slaid: Guru menayangkan slaid ringkas tentang topik. Setiap slaid mengandungi satu perkataan atau konsep dengan gambar. Murid membaca bersama-sama secara koral. [Dif: A - Menjelaskan konsep dalam slaid, B - Membaca perkataan pada slaid, C - Menunjuk gambar pada slaid]"], "d": ["📖 Aktiviti membaca petikan secara berpasangan. Guru menyediakan petikan pada 3 aras kesukaran (mudah, sederhana, mencabar). Murid membaca bergilir dengan pasangan dan membincangkan isi petikan. Guru menyediakan soalan kefahaman beraras yang merangkumi soalan literal, inferensi dan KBAT. Murid menjawab soalan secara lisan atau bertulis. [Dif: A - Membaca petikan aras tinggi dan menjawab soalan KBAT, B - Membaca petikan aras sederhana dan menjawab soalan literal, C - Membaca petikan bergambar dan melukis jawapan]", "✍️ Menulis karangan atau ayat berpandu dengan menggunakan peta pemikiran i-Think. Murid merancang penulisan menggunakan peta bulatan, peta buih atau peta pokok sebelum menulis. Karangan dihasilkan secara individu atau berpasangan. Guru menyediakan rangka karangan dan senarai semak untuk membimbing murid. [Dif: A - Menulis karangan lengkap dengan isi tersusun dan ayat gramatis, B - Menulis ayat berpandu menggunakan rangka dan frasa, C - Menyusun ayat yang diberikan dan menyalin tulisan]", "🎭 Aktiviti lakonan (Role Play): Murid melakonkan dialog dalam situasi harian berkaitan topik. Guru menyediakan kad situasi yang pelbagai. Murid merancang dialog secara berkumpulan dan berlatih sebelum melakonkan di hadapan kelas. Guru menilai intonasi, sebutan dan ekspresi. [Dif: A - Mencipta dialog sendiri berdasarkan situasi dengan kreatif, B - Menggunakan dialog yang diberi dengan olahan, C - Melakonkan dialog dengan bimbingan guru]", "🖼️ Gallery Walk: Hasil kerja murid dipamerkan di atas meja atau dilekat di dinding kelas. Murid berjalan dalam kumpulan melihat hasil kerja rakan sambil mencatat maklumat penting. Mereka meninggalkan komen pada sticky note atau kad feedback. Setiap kumpulan berhenti di setiap stesen selama 2-3 minit. [Dif: A - Menulis komen yang bernas, membina dan spesifik, B - Menulis komen ringkas yang positif, C - Menampal stiker atau tanda pada hasil kerja]", "📘 Mencipta buku mini (foldable booklet) berdasarkan topik. Guru menyediakan template buku mini daripada sehelai kertas A4. Murid mengisi kandungan buku mengikut kreativiti masing-masing seperti definisi, gambar, contoh dan rumusan. Buku mini mengandungi ringkasan isi pelajaran. [Dif: A - Mengisi kandungan lengkap dengan ayat sendiri dan ilustrasi, B - Mengisi kandungan berpandu soalan dan gambar, C - Mewarna gambar dan menampal label yang diberi]", "🏫 Aktiviti Stesen Pembelajaran: Murid bergerak dalam kumpulan ke 4-5 stesen yang menyediakan tugasan berbeza. Setiap stesen mengambil masa 5-7 minit. Stesen termasuk stesen membaca, menulis, mewarna, permainan dan kreativiti. Guru memantau dan membimbing di stesen yang memerlukan bantuan. [Dif: A - Stesen cabaran KBAT dengan tugasan kompleks, B - Stesen tugasan sederhana dengan arahan jelas, C - Stesen bimbingan guru dengan bantuan rapat]", "🧩 Permainan Bahasa: Scrabble, Boggle, Permainan Kad Perkataan atau Silang Kata. Murid bermain dalam kumpulan kecil untuk mengukuhkan kosa kata, ejaan dan struktur ayat. Permainan dijalankan secara pusingan dalam tempoh masa yang ditetapkan. [Dif: A - Membina ayat daripada perkataan yang ditemui, B - Mencari perkataan tersembunyi dalam grid, C - Memadankan huruf untuk membentuk perkataan]", "🗺️ Mencipta peta minda atau peta pemikiran secara berkumpulan. Gunakan kertas mahjong dan pen marker berwarna. Murid melukis peta minda yang kreatif dengan gambar dan warna. Setiap kumpulan membentangkan peta minda mereka. Hasil kerja dipamerkan di sudut kelas. [Dif: A - Peta minda lengkap dengan sub-topik dan cabang terperinci, B - Peta bulatan dengan idea utama berkaitan, C - Peta bergambar dengan bantuan rakan]", "💻 Penggunaan aplikasi pendidikan seperti Quizizz, Kahoot!, Google Classroom atau Wordwall. Murid menjawab kuiz interaktif secara individu atau berkumpulan menggunakan telefon bimbit, tablet atau komputer. Soalan merangkumi pelbagai aras kesukaran. Markah dipaparkan secara langsung. [Dif: A - Soalan aras KBAT dengan penaakulan, B - Soalan aras sederhana dengan pilihan, C - Soalan bergambar dengan pilihan jawapan]", "🎨 Aktiviti kraftangan: Menghasilkan poster, buku skrap, model 3D atau diorama berkaitan topik. Murid menggunakan bahan seperti kertas warna, kotak terbuang, gam, gunting, pensel warna dan bahan kitar semula. Hasil kerja dipamerkan dan dibentangkan. [Dif: A - Menghasilkan kraftangan secara kreatif tanpa contoh, B - Menggunakan template dan contoh yang diberi, C - Membantu mewarna dan menghias]", "🔬 Eksperimen atau penyiasatan secara berkumpulan. Murid menjalankan aktiviti saintifik untuk menguji hipotesis. Mereka merekod pemerhatian, menganalisis data dan membuat kesimpulan secara berkumpulan. Guru membimbing langkah demi langkah. [Dif: A - Mereka bentuk eksperimen sendiri dengan kawalan pembolehubah, B - Mengikut langkah eksperimen yang disediakan, C - Membantu rakan merekod data dan pemerhatian]", "📊 Projek berkumpulan: Murid menyiapkan projek secara berkumpulan dan membentangkan hasil kerja. Projek merangkumi penyelidikan, pengumpulan maklumat, analisis dan persembahan kreatif. Tempoh projek 1-2 minggu. [Dif: A - Projek kompleks dengan penyelidikan mendalam dan analisis, B - Projek sederhana dengan bimbingan dan panduan, C - Membantu kumpulan dalam tugasan mudah]", "🎪 Karnival pembelajaran: Murid menyediakan gerai interaktif berkaitan topik. Setiap kumpulan menguruskan satu gerai dengan aktiviti seperti kuiz, permainan atau pameran. Kelas lain atau guru pelawat melawat gerai-gerai tersebut. [Dif: A - Mengurus dan mengendalikan gerai sepenuhnya, B - Membantu menguruskan gerai dengan bimbingan, C - Melawat dan menyertai aktiviti gerai]", "📝 Pembelajaran berasaskan projek (PBL): Murid menyiapkan folio atau buku skrap secara berkumpulan. Projek merangkumi tajuk, objektif, kandungan, ilustrasi dan rumusan. Sumber rujukan termasuk buku, internet dan temu bual. [Dif: A - Folio lengkap dengan kandungan terperinci dan kreatif, B - Buku skrap dengan isi berpandu dan contoh, C - Koleksi gambar dan bahan dengan label]", "🎯 Aktiviti Hot Seat: Seorang murid duduk di kerusi panas di hadapan kelas. Rakan sekelas bertanya soalan berkaitan topik secara bergilir. Murid di kerusi panas perlu menjawab soalan dengan yakin dan jelas. Aktiviti ini melatih keyakinan dan kefasihan. [Dif: A - Memberi soalan yang mencabar dan mendalam, B - Menjawab soalan dengan yakin dan tepat, C - Mencatat jawapan dan membantu rakan]", "📚 Bacaan Kumpulan: Murid dibahagikan kepada kumpulan kecil. Setiap kumpulan membaca petikan yang berbeza mengikut aras. Selepas membaca, mereka membincangkan isi petikan dan melengkapkan peta minda. [Dif: A - Petikan aras tinggi dengan soalan KBAT, B - Petikan aras sederhana, C - Petikan bergambar dengan soalan mudah]", "✍️ Penulisan Kreatif: Murid menulis karangan pendek atau cerita berdasarkan gambar rangsangan. Guru menyediakan bank kata dan frasa. Murid digalakkan menggunakan kreativiti. [Dif: A - Menulis 3-4 perenggan dengan idea asli, B - Menulis 1-2 perenggan dengan bimbingan, C - Menulis 3-5 ayat mudah]", "🎭 Main Peranan 2: Murid melakonkan situasi harian yang melibatkan penggunaan bahasa yang sopan. Contohnya di kedai, di perpustakaan atau di pejabat guru. Dialog dibina secara berkumpulan. [Dif: A - Mencipta dialog sendiri dengan situasi baru, B - Menggunakan dialog sedia ada dengan pengubahsuaian, C - Melakonkan dialog pendek dengan bimbingan]", "📊 Carta Bar dan Graf: Murid membina carta bar atau graf berdasarkan data yang diberi. Mereka mentafsir data dan membuat kesimpulan secara bertulis atau lisan. [Dif: A - Membina carta dan mentafsir data dalam perenggan, B - Membina carta berpandu dengan soalan, C - Mewarna carta yang disediakan]", "🎨 Folio Kreatif: Murid menyiapkan folio bertema secara individu atau berkumpulan. Folio mengandungi tajuk, kandungan, gambar, ilustrasi dan rumusan. Tempoh penyiapan 3-5 hari. [Dif: A - Folio lengkap dengan kandungan terperinci, B - Folio dengan isi berpandu dan contoh, C - Koleksi gambar dan bahan dengan label]", "🧪 Eksperimen Bahasa: Murid menjalankan eksperimen bahasa seperti menyusun perkataan mengikut urutan abjad, mengenal pasti pola ayat atau mengelaskan kata mengikut golongan. [Dif: A - Menjalankan eksperimen tanpa contoh, B - Menggunakan lembaran berpandu, C - Menyusun kad perkataan]", "📝 Karangan Bergambar: Murid menulis karangan berdasarkan 4-6 gambar bersiri. Mereka menyusun gambar mengikut urutan yang betul sebelum menulis. [Dif: A - Menulis karangan lengkap dengan ayat gramatis, B - Menulis 2-3 ayat bagi setiap gambar, C - Menulis perkataan bagi setiap gambar]", "🔍 Kajian Teks: Murid mengkaji teks contoh untuk mengenal pasti ciri-ciri bahasa seperti kata adjektif, kata kerja atau kata hubung. Mereka menandakan dan mengelaskan perkataan yang ditemui. [Dif: A - Mengenal pasti dan mengelas semua golongan kata, B - Mencari kata kunci dengan bimbingan, C - Memadankan perkataan dengan golongan kata]", "📖 Bacaan Intensif: Murid membaca petikan secara intensif dan menjawab soalan pemahaman pelbagai aras. Soalan merangkumi aras literal, inferens dan penilaian. [Dif: A - Soalan KBAT dengan penaakulan, B - Soalan inferens dengan pilihan, C - Soalan literal bergambar]", "🤝 Pembelajaran Koperatif (Jigsaw): Setiap ahli kumpulan menjadi pakar dalam sub-topik tertentu. Mereka berkumpul dengan pakar dari kumpulan lain untuk berbincang. Kemudian kembali ke kumpulan asal untuk mengajar rakan. [Dif: A - Menjadi pakar dan mengajar rakan dengan efektif, B - Menjadi pakar dengan bimbingan bahan, C - Menerima pengajaran daripada rakan pakar]", "🎮 Gamifikasi Pembelajaran: Murid bermain permainan pendidikan seperti Wordwall, Kahoot atau Quizizz. Soalan berkaitan topik yang dipelajari. Markah dikumpul dan pemenang diberi pengiktirafan. [Dif: A - Soalan KBAT dengan masa terhad, B - Soalan aras sederhana, C - Soalan bergambar dengan pilihan jawapan]", "📽️ Pembentangan Digital: Murid menyediakan pembentangan ringkas menggunakan PowerPoint, Canva atau Google Slides. Mereka membentang di hadapan kelas. [Dif: A - Pembentangan dengan kandungan lengkap dan kreatif, B - Pembentangan dengan template disediakan, C - Membantu menyediakan slaid]", "📰 Projek Buletin Kelas: Murid menghasilkan buletin kelas yang mengandungi berita, artikel pendek, puisi dan hasil karya. Buletin diedarkan kepada kelas lain atau ibu bapa. [Dif: A - Menulis artikel dan menyunting kandungan, B - Menulis artikel pendek dengan bimbingan, C - Mewarna dan menghias buletin]", "🎯 Fokus Kumpulan: Setiap kumpulan diberi tugasan khusus yang berbeza aras. Kumpulan A - tugasan mencabar, Kumpulan B - tugasan sederhana, Kumpulan C - tugasan asas. Murid menyelesaikan tugasan dalam kumpulan masing-masing. [Dif: A - Tugasan KBAT dengan penyelesaian masalah, B - Tugasan pemahaman dan aplikasi, C - Tugasan mengenal pasti dan menamakan]", "🔬 Projek Inkuiri: Murid menjalankan projek inkuiri secara berkumpulan. Mereka mengemukakan soalan, mencari maklumat, menganalisis dan membuat kesimpulan. Tajuk projek dipilih sendiri atau diberi. [Dif: A - Projek inkuiri penuh dengan hipotesis dan analisis, B - Projek inkuiri berpandu dengan soalan, C - Mengumpul maklumat dari sumber yang diberi]"], "ps": ["👨‍🏫 Pembentangan hasil kerja kumpulan terpilih di hadapan kelas. Wakil kumpulan membentang dengan menggunakan alat bantu seperti poster, slaid atau model. Penerangan merangkumi objektif, proses dan hasil kerja. Kumpulan lain memberi maklum balas dan bertanya soalan. [Dif: A - Membentang dengan yakin, jelas dan kreatif, B - Membentang dengan bimbingan guru dan nota, C - Menunjukkan hasil kerja sambil guru menerangkan]", "📝 Kuiz Kahoot! atau Quizizz secara berkumpulan atau individu. Soalan kuiz merangkumi pelbagai aras kesukaran daripada aras rendah hingga KBAT. Murid menjawab dalam masa yang ditetapkan. Markah dan kedudukan dipaparkan secara langsung untuk meningkatkan motivasi. [Dif: A - Soalan aras KBAT dengan penaakulan, B - Soalan aras sederhana dengan pilihan, C - Soalan bergambar dengan pilihan jawapan]", "💬 Sesi refleksi: Murid berkongsi satu perkara yang mereka pelajari pada hari ini secara lisan. Guru meminta beberapa orang murid secara rawak untuk berkongsi. Refleksi boleh juga dilakukan secara bertulis dalam jurnal pembelajaran ringkas. [Dif: A - Berkongsi dalam ayat lengkap dengan contoh dan kaitan, B - Berkongsi dalam frasa ringkas, C - Menunjuk pada gambar atau bahan belajar]", "✏️ Aktiviti 3-2-1: Murid menulis 3 perkara yang dipelajari, 2 perkara yang menarik dan 1 soalan yang masih tertanya-tanya. Tulis di atas kertas atau sticky note. Kemudian lekatkan pada papan refleksi di sudut kelas. [Dif: A - Menulis lengkap dalam ayat gramatis, B - Menulis isi berpandu soalan bimbingan, C - Melukis gambar dan menulis label]", "🗣️ Sumbangsaran secara kelas untuk merumuskan isi pelajaran. Guru menulis idea-idea murid di papan putih dalam bentuk peta minda. Murid membincangkan perkaitan antara idea dan membuat rumusan bersama. [Dif: A - Memberi idea bernas yang berhubung kait, B - Setuju atau tidak setuju dengan alasan yang sesuai, C - Mengulang idea yang disebut rakan]", "⭐ Penilaian rakan sebaya: Murid menilai hasil kerja rakan menggunakan rubrik mudah seperti bintang atau smiley face. Murid memberi komen lisan atau bertulis tentang kekuatan dan cadangan penambahbaikan. [Dif: A - Menggunakan rubrik penilaian dengan tepat dan objektif, B - Memberi bintang dan komen ringkas, C - Menampal stiker pada hasil kerja]", "📊 Pameran hasil kerja (Mini Exhibition): Semua hasil kerja dipamerkan di sudut kelas atau meja. Murid berjalan melihat pameran secara berkumpulan. Beberapa orang murid dipilih untuk menerangkan hasil kerja mereka kepada pengunjung. [Dif: A - Mengatur dan menyusun pameran dengan kreatif, B - Menerangkan hasil kerja dengan jelas, C - Melawat dan melihat pameran]", "🎯 Kuiz lisan pantas: Guru mengemukakan soalan spontan secara rawak untuk menguji kefahaman murid. Murid menjawab secara lisan. Soalan merangkumi pelbagai aras daripada soalan mudah hingga KBAT. [Dif: A - Soalan KBAT yang mencabar pemikiran, B - Soalan aras sederhana, C - Soalan mudah dengan bantuan dan petunjuk]", "🔄 Aktiviti Round Table: Setiap murid dalam kumpulan menulis satu idea secara bergilir pada sehelai kertas. Kertas dipusingkan mengikut arah jam sehingga semua ahli kumpulan memberi sumbangan. Hasil dikongsi dengan kelas. [Dif: A - Menulis idea lengkap dalam ayat gramatis, B - Menulis kata kunci berkaitan topik, C - Melukis gambar berkaitan idea]", "💭 Refleksi bertulis dalam jurnal pembelajaran ringkas. Murid menulis apa yang dipelajari, apa yang menarik dan apa yang masih kurang jelas. Guru membaca dan memberi komen dan galakan. [Dif: A - Menulis perenggan penuh dengan refleksi mendalam, B - Menulis beberapa ayat mudah, C - Melukis gambar dan menulis label]", "👨‍🏫 Pembentangan Hasil: Wakil kumpulan membentangkan hasil kerja di hadapan kelas. Penerangan meliputi objektif, proses dan hasil. Kumpulan lain menilai menggunakan rubrik mudah. [Dif: A - Membentang dengan yakin dan menjawab soalan, B - Membentang dengan bimbingan guru, C - Menunjukkan hasil kerja]", "📝 Kuiz Lisan: Guru mengemukakan soalan secara lisan. Murid menjawab menggunakan papan putih mini. Semua murid menunjukkan jawapan serentak. Guru memberi maklum balas segera. [Dif: A - Soalan KBAT dengan penerangan, B - Soalan pemahaman aras sederhana, C - Soalan aneka pilihan]", "💭 Refleksi 3J: Murid menulis 3 J - Jelas (apa yang jelas), Jelik (apa yang susah), Janji (apa yang akan dibuat). Aktiviti ini membantu murid merenung pembelajaran. [Dif: A - Menulis 3J dalam ayat lengkap, B - Menulis 3J dalam frasa pendek, C - Melukis gambar 3J]", "✏️ Peta I-Think: Murid melengkapkan peta i-Think (Peta Bulatan, Peta Buih, Peta Pokok) berdasarkan topik. Guru menyediakan templat kosong. [Dif: A - Melengkapkan peta tanpa bantuan, B - Mengisi ruang kosong dengan kata kunci, C - Mewarna dan menampal label]", "🎯 Ujian Pantas: Guru memberikan 5 soalan ringkas untuk dijawab dalam masa 5 minit. Soalan merangkumi pelbagai aras. Jawapan disemak bersama-sama. [Dif: A - Soalan KBAT dan penyelesaian masalah, B - Soalan objektif dan struktur, C - Soalan padanan dan benar/palsu]", "🤝 Sesi Perkongsian: Murid berkongsi apa yang dipelajari dengan rakan sekelas secara lisan atau bertulis. Setiap murid mendapat giliran untuk berkongsi. [Dif: A - Berkongsi dalam bentuk penerangan lengkap, B - Berkongsi dalam 3-4 ayat ringkas, C - Menunjuk bahan yang dipelajari]", "🏆 Kuiz Berkumpulan: Soalan diajukan kepada kumpulan secara bergilir. Kumpulan berbincang dan memberikan jawapan. Mata diberikan untuk jawapan betul. [Dif: A - Soalan KBAT untuk mata bonus, B - Soalan pemahaman biasa, C - Soalan asas untuk semua kumpulan]", "📸 Pameran Hasil: Hasil kerja murid dipamerkan di sudut kelas atau papan kenyataan. Murid melawat pameran dan meninggalkan komen pada sticky note. [Dif: A - Menulis komen yang membina dan spesifik, B - Menulis komen ringkas yang positif, C - Menampal stiker pada hasil kerja]", "🗣️ Sesi Soal Jawab: Murid diberi peluang untuk bertanya soalan tentang apa yang belum difahami. Rakan sekelas atau guru memberi penerangan. [Dif: A - Bertanya soalan aras tinggi, B - Bertanya soalan mudah, C - Menjawab soalan rakan]", "🎲 Spin and Answer: Guru menyediakan roda berputar dengan soalan. Murid memutar roda dan menjawab soalan berdasarkan petunjuk roda. [Dif: A - Soalan KBAT berbentuk esei ringkas, B - Soalan objektif, C - Soalan bergambar]", "📊 Carta Pencapaian: Murid menanda pencapaian mereka pada carta atau graf mudah. Mereka merekod jumlah jawapan betul atau tugasan yang disiapkan. [Dif: A - Menganalisis carta dan menulis refleksi, B - Menanda pada carta dengan bimbingan, C - Mewarna carta mengikut pencapaian]", "💬 Sembang Sidang: Murid duduk dalam bulatan dan berbincang tentang topik. Setiap murid wajib memberi satu pendapat atau pandangan. Guru menjadi fasilitator. [Dif: A - Memberi pendapat bernas dengan alasan, B - Memberi pendapat ringkas, C - Mengangguk atau menggeleng]", "🎭 Lakonan Semula: Murid melakonkan semula situasi atau konsep yang dipelajari dalam bentuk sketsa pendek. Tempoh lakonan 2-3 minit. [Dif: A - Menulis skrip dan melakonkan dengan kumpulan, B - Melakonkan dengan bimbingan guru, C - Menjadi penonton dan menilai]", "🧩 Cabaran PBL: Murid diberi masalah terbuka untuk diselesaikan secara berkumpulan. Mereka membentangkan penyelesaian dalam tempoh 10 minit. [Dif: A - Menyelesaikan masalah dengan kreatif, B - Menyelesaikan masalah dengan panduan, C - Memberi input mudah dalam kumpulan]", "📝 Jurnal Refleksi: Murid menulis jurnal refleksi tentang apa yang dipelajari. Tulisannya dimasukkan ke dalam portfolio pembelajaran. [Dif: A - Menulis jurnal dengan refleksi mendalam, B - Menulis jurnal 3-4 ayat, C - Melukis gambar dan menulis label]", "🌟 Bintang Tugasan: Murid menilai tugasan sendiri atau rakan menggunakan rubrik bintang (1-5 bintang). Mereka memberi justifikasi penilaian secara lisan. [Dif: A - Menilai dengan rubrik dan memberi komen, B - Menilai dengan bintang, C - Menampal bintang pada tugasan]", "📞 Cabutan Soalan: Guru menyediakan uncang berisi soalan. Murid mencabut satu soalan dan menjawab di hadapan kelas. Soalan pelbagai aras. [Dif: A - Soalan mencabar KBAT, B - Soalan pemahaman, C - Soalan kemahiran asas]", "🔍 Semak Rakan: Murid menukar buku latihan dengan rakan untuk menyemak jawapan. Mereka menanda jawapan betul dan membetulkan jawapan salah. [Dif: A - Menyemak dan memberi komen penambahbaikan, B - Menyemak jawapan dengan bimbingan, C - Memadankan jawapan dengan skema]", "🎯 Sasaran Refleksi: Murid menulis refleksi pada kertas berbentuk anak panah dan menampalnya pada papan sasaran kelas mengikut tahap kefahaman mereka. [Dif: A - Menulis refleksi lengkap dan menampalnya, B - Menulis refleksi ringkas, C - Menampal anak panah pada sasaran]", "📋 Perbincangan Meja Bulat: Setiap kumpulan berbincang tentang topik dan menulis kesimpulan pada kertas mahjong. Hasil perbincangan dibentangkan secara ringkas. [Dif: A - Menulis kesimpulan lengkap dan membentang, B - Menulis isi penting dengan bimbingan, C - Mewarna dan menghias kertas mahjong]"], "c": ["📋 Rumusan isi penting: Guru membimbing murid melengkapkan peta konsep atau peta i-Think. Murid mengisi tempat kosong dengan maklumat yang betul berdasarkan pembelajaran hari ini. Rumusan dibuat secara kolaboratif oleh seluruh kelas. [Dif: A - Melengkapkan peta konsep sendiri tanpa bantuan, B - Mengisi separuh daripada peta dengan bimbingan, C - Mewarnakan dan menampal label pada peta]", "🎫 Exit Ticket: Murid menulis jawapan pada kertas kecil atau sticky note sebelum keluar kelas. Soalan mudah seperti Satu perkara yang saya belajar hari ini... atau Saya masih kabur tentang... Guru mengumpul dan menyemak exit ticket untuk menilai kefahaman. [Dif: A - Menulis jawapan dalam ayat lengkap, B - Menulis perkataan atau frasa, C - Melukis gambar dan menulis label]", "✅ Permainan Betul atau Salah: Guru menyatakan beberapa kenyataan berkaitan topik. Murid berdiri jika betul dan duduk jika salah. Atau menggunakan kad hijau (betul) dan kad merah (salah). Aktiviti ini menyeronokkan dan menguji kefahaman dengan cepat. [Dif: A - Memberi alasan kenapa betul atau salah, B - Menjawab betul atau salah dengan yakin, C - Meniru tindakan rakan]", "🙏 Doa dan nyanyian lagu penutup. Refleksi secara lisan oleh 2-3 orang murid terpilih. Guru memimpin doa dan murid mengaminkan. Suasana pembelajaran ditutup dengan positif. [Dif: A - Memimpin doa dan memberi refleksi, B - Berkongsi refleksi ringkas, C - Mendengar dan mengaminkan doa]", "📚 Guru memberikan latihan pengukuhan sebagai kerja rumah. Latihan berasaskan topik yang dipelajari. Guru menerangkan arahan dengan jelas dan memberi contoh. Murid menyimpan latihan dalam beg untuk dibuat di rumah. [Dif: A - Latihan KBAT dan penyelesaian masalah, B - Latihan aras sederhana, C - Latihan asas pengukuhan]", "🔮 Preview pembelajaran seterusnya: Guru menunjukkan gambar atau mengemukakan soalan teaser tentang topik akan datang. Murid meramal apa yang akan dipelajari untuk membangkitkan minat dan rasa ingin tahu. [Dif: A - Meramal dalam ayat lengkap, B - Meramal dalam satu perkataan, C - Melihat gambar dengan bimbingan]", "🎯 Murid melengkapkan What Stuck With You Today? pada sticky note. Mereka menulis konsep atau kemahiran yang paling diingati daripada pembelajaran hari ini. Sticky note dilekatkan pada papan khas di sudut kelas. [Dif: A - Menulis dalam ayat lengkap dan jelas, B - Menulis frasa pendek, C - Melukis gambar]", "🔄 Sesi soal jawab pantas menggunakan papan putih mini. Guru bertanya soalan berkaitan topik. Murid menulis jawapan pada papan dan menunjukkan serentak. Guru memberi maklum balas segera. Aktiviti ini membolehkan guru menilai kefahaman semua murid dengan cepat. [Dif: A - Soalan KBAT yang mencabar, B - Soalan aras sederhana, C - Menunjukkan jawapan yang ditulis]", "⭐ Murid meletakkan magnet atau penanda pada carta Tahap Kefahaman yang mengandungi tiga bahagian: Faham, Ragu-ragu dan Tidak Faham. Guru dapat melihat secara visual tahap kefahaman kelas dan merancang tindakan susulan. [Dif: A - Menerangkan pilihan tahap kefahaman, B - Meletakkan magnet pada tahap sendiri, C - Membantu rakan meletakkan magnet]", "✏️ Jurnal refleksi harian: Murid menulis satu perenggan pendek tentang pembelajaran hari ini. Fokus pada apa yang dipelajari, apa yang dirasai dan apa yang akan dilakukan. Guru membaca dan memberi komen motivasi. [Dif: A - Menulis perenggan lengkap dengan refleksi, B - Menulis 3 ayat mudah, C - Melukis gambar berserta label]", "📋 Peta Konsep: Guru dan murid bersama-sama melukis peta konsep di papan putih. Murid mengisi tempat kosong dengan perkataan yang betul. Peta konsep dirujuk semula pada sesi akan datang. [Dif: A - Melukis peta konsep sendiri tanpa bantuan, B - Mengisi separuh peta dengan bimbingan, C - Menampal label pada peta]", "🎫 Tiket Keluar 2: Murid menulis pada tiket keluar: 'Saya faham... Saya belum faham... Saya akan...' Tiket dikutip guru untuk penilaian. [Dif: A - Menulis dalam perenggan lengkap, B - Menulis frasa ringkas, C - Melukis muka senyum/sedih]", "✅ Kuiz Betul/Salah 2: Guru menyatakan 5 kenyataan. Murid menggunakan kad hijau (betul) dan merah (salah). Semua murid menunjukkan serentak. [Dif: A - Memberi alasan kenapa betul/salah, B - Menjawab betul/salah dengan yakin, C - Meniru rakan]", "🙏 Refleksi Akhir: Murid menutup sesi dengan bacaan doa atau kata-kata motivasi. 2-3 orang murid dipilih untuk memberi refleksi lisan. Kelas ditutup dengan positif. [Dif: A - Memimpin doa dan memberi refleksi bermakna, B - Memberi refleksi ringkas, C - Mendengar dan mengaminkan]", "📚 Latihan Pengukuhan: Guru memberikan lembaran kerja sebagai latihan pengukuhan. Latihan merangkumi soalan pelbagai aras. Guru menerangkan cara menjawab. [Dif: A - Latihan KBAT dan penyelesaian masalah, B - Latihan pemahaman dan aplikasi, C - Latihan asas pengukuhan]", "🔮 Gerbang Masa Depan: Guru menunjukkan gambar atau objek yang berkaitan dengan topik akan datang. Murid meramal apa yang akan dipelajari untuk membina rasa ingin tahu. [Dif: A - Meramal dalam ayat lengkap, B - Meramal dalam satu perkataan, C - Melihat gambar ramalan rakan]", "📝 Catatan Refleksi: Murid menulis catatan ringkas dalam buku refleksi atau jurnal. Catatan fokus pada pengalaman pembelajaran hari ini. [Dif: A - Menulis catatan dengan refleksi dan perancangan, B - Menulis 3-4 ayat ringkas, C - Melukis gambar berserta label]", "🔄 Roda Penutup: Guru menyediakan roda berputar dengan soalan rumusan. Murid memutar roda dan menjawab soalan secara lisan. [Dif: A - Soalan rumusan aras tinggi, B - Soalan rumusan aras sederhana, C - Soalan aras asas]", "⭐ Penilaian Kendiri: Murid meletakkan magnet atau penanda pada carta Tahap Kefahaman: Faham, Ragu-ragu, Tidak Faham. Guru melihat taburan kefahaman kelas. [Dif: A - Menerangkan pilihan tahap kefahaman, B - Meletakkan magnet pada tahap sendiri, C - Membantu rakan meletakkan magnet]", "✏️ Karangan Kilat: Murid menulis 2-3 ayat rumusan tentang apa yang dipelajari dalam masa 3 minit. Hasil bacaan dikongsi dengan rakan. [Dif: A - Menulis rumusan lengkap dalam ayat gramatis, B - Menulis rumusan dalam frasa, C - Menulis perkataan kunci]", "🎵 Lagu Penutup: Murid menyanyikan lagu penutup yang mengandungi kata kunci topik. Lagu dinyanyikan sambil membuat gerakan. [Dif: A - Mencipta gerakan sendiri, B - Menyanyi dengan gerakan yang diajar, C - Menepuk irama]", "📦 Kotak Memori: Murid menulis satu perkara yang ingin diingat dari pembelajaran hari ini pada kertas. Kertas dimasukkan ke dalam 'Kotak Memori' kelas. [Dif: A - Menulis ayat penuh dengan penerangan, B - Menulis frasa ringkas, C - Melukis gambar]", "🔔 Loceng Refleksi: Loceng dibunyikan. Murid yang memegang loceng berkongsi satu perkara yang dipelajari. Loceng dipassing kepada rakan seterusnya. [Dif: A - Berkongsi 3 perkara dalam ayat lengkap, B - Berkongsi 1 perkara ringkas, C - Menunjuk bahan pembelajaran]", "📊 Survei Pantas: Murid mengangkat tangan untuk menjawab soalan survei seperti 'Siapa rasa seronok?', 'Siapa rasa susah?'. Guru merekod maklum balas. [Dif: A - Memberi alasan untuk jawapan survei, B - Mengangkat tangan, C - Meniru rakan]", "📖 Cerita Penutup: Guru membacakan cerita pendek yang mengikat semua konsep yang dipelajari. Murid mendengar dan mengaitkan dengan pengalaman pembelajaran. [Dif: A - Mengaitkan cerita dengan topik dalam ayat, B - Menceritakan semula sebahagian cerita, C - Menunjuk watak dalam cerita]", "🎯 Challenge Card: Murid diberi kad cabaran untuk diselesaikan di rumah. Kad mengandungi tugasan menyeronokkan berkaitan topik. [Dif: A - Cabaran aras tinggi penyelesaian masalah, B - Cabaran aras sederhana, C - Cabaran asas]", "🗣️ Perbincangan Penutup: Guru membimbing perbincangan akhir untuk merumuskan isi pelajaran. Murid digalakkan bertanya soalan. [Dif: A - Merumus dalam ayat sendiri, B - Memberi pendapat tentang topik, C - Mendengar rumusan guru]", "📸 Memori Foto: Guru mengambil gambar hasil kerja atau aktiviti murid. Gambar dimuat naik ke Google Classroom atau kumpulan WhatsApp kelas. [Dif: A - Menulis kapsyen gambar, B - Menamakan gambar, C - Melihat dan mengingati]", "💎 Pesanan Guru: Guru memberi pesanan atau kata-kata semangat yang berkaitan dengan topik dan nilai murni. Murid mendengar dan merenung. [Dif: A - Menulis semula pesanan dalam jurnal, B - Mengulang pesanan, C - Mengangguk faham]", "🌱 Janji Pembelajaran: Murid menulis satu janji untuk mempraktikkan apa yang dipelajari. Janji ditampal di sudut janji kelas. Rujukan pada sesi akan datang. [Dif: A - Menulis janji dalam ayat lengkap, B - Menulis janji ringkas, C - Melukis gambar janji]"]}, "en": {"i": ["🎵 Sing the topic song from the coursebook (e.g. Super Minds 'Let's Play!', Get Smart Plus 'Where are you from?'). Teacher leads with audio; pupils do the actions. After singing, ask What's the topic today? [Diff: A - Create a new verse using target vocabulary, B - Sing with actions and answer the question, C - Clap along and repeat key words]", "🎬 Play the unit opener video or listen to the audio story from the textbook page. Pupils watch/listen once, then answer: Who are the characters? Where are they? Link answers to the day's unit. [Diff: A - Retell the story in own words, B - Name characters and setting, C - Point to pictures]", "🧩 Unit picture walk: flip through the textbook unit pages. Pupils predict the topic from images and captions before the lesson begins. [Diff: A - Predict in full sentences with reasons, B - Predict the topic in one word, C - Point to the title page]", "🎭 Act out the coursebook story with finger puppets. Teacher narrates using the exact dialogue from the unit's story (e.g. 'The Spider', 'Dilly's Doughnut', 'The King of Kites'). [Diff: A - Perform with own dialogue, B - Repeat character lines, C - Move the puppet on cue]", "🖼️ Word mat warm-up: display the unit's target vocabulary (from the picture dictionary page). Pupils call out words they know and act them out. [Diff: A - Use words in sentences, B - Say the words, C - Point and repeat]", "❓ Question circle: pass a ball while asking unit questions like What's your name? / Where are you from? / What's your favourite food? Pupils answer using the lesson's target structure. [Diff: A - Ask a follow-up question, B - Answer in a full sentence, C - Answer with one word]", "🔄 Spot the difference between two scenes from the unit. Pupils describe what is different using unit language (e.g. There is/There are, has got). [Diff: A - Describe in full sentences, B - Name the differences, C - Point to the differences]", "👂 Audio bingo: play vocabulary from the unit audio CD. Pupils tick the matching pictures/words in their books. First full line shouts Bingo! [Diff: A - Also spell the word, B - Tick the picture, C - Listen and repeat]", "🎈 Vocabulary chant from the unit's chant page (e.g. 'It's a busy, busy week'). Pupils chant with rhythm and add actions. [Diff: A - Lead the chant, B - Chant with the group, C - Clap the rhythm]", "📦 Mystery box with unit objects (e.g. school things for Unit 1 At School). Pupils feel and guess using It's a... [Diff: A - Describe the object, B - Guess the object, C - Point to the picture]", "🎼 Sound guessing for phonics: play the unit's letter sound (e.g. /s/, /ae/, /i/). Pupils identify words starting with the sound. [Diff: A - Say three words with the sound, B - Say one word with the sound, C - Listen and repeat the sound]", "👀 Picture flash: show unit flashcards for 30 seconds. Pupils memorise and name as many as they can. [Diff: A - Use them in sentences, B - Name the words, C - Point to the flashcard]", "🤔 Provocative question linked to the unit topic, e.g. 'What would happen if you could fly?' (Unit At the Beach / Adventure Time). Pupils share ideas. [Diff: A - Give reasons, B - Give a short answer, C - Listen to a friend's idea]", "🎯 Target throw: draw a target with unit questions. Pupils throw a ball and answer the question they hit (e.g. How old are you? / Can you swim?). [Diff: A - Answer in a full sentence, B - Answer with a word, C - Repeat the question]", "🧠 Recall relay: close books, recall the previous unit's key words and phrases. Teacher writes them on the board to link prior learning. [Diff: A - Recall and use in a sentence, B - Recall the words, C - Read them aloud]", "🎪 Spontaneous drama: give a situation from the unit (e.g. at the beach, at the pet show). Pupils act it out using unit phrases. [Diff: A - Create the dialogue, B - Use given phrases, C - Mime with support]", "🔦 Story highlight: read the first page of the unit story without finishing. Pupils predict the ending. [Diff: A - Predict in sentences, B - Predict one word, C - Look at the pictures]", "🎲 Question dice: prepare a dice with unit questions on each face. Pupils roll and answer. [Diff: A - Explain the answer, B - Answer the question, C - Repeat the answer]", "🌈 Word rainbow: write unit vocabulary on coloured strips. Pupils pick a colour, read the word and mime it. [Diff: A - Use in a sentence, B - Read the word, C - Point to the picture]", "🕵️ Class detective: hide unit flashcards around the room. Pupils find them and say the word. [Diff: A - Make a sentence with it, B - Say the word, C - Show the card]", "🌊 Question wave: first pupil asks the neighbour a unit question; the answer passes along the line. [Diff: A - Ask a new question, B - Answer and pass, C - Repeat the answer]", "🔐 Clue boxes: 3-4 numbered boxes contain unit picture clues. Groups open one and guess the topic. [Diff: A - Describe the clue, B - Guess the word, C - Open and show]", "⭐ Star spin: a star on the board with unit questions at each point. Pupils spin a pointer and answer. [Diff: A - Answer with details, B - Give a short ans ding level. [Diff: A - Write a reflection, B - Write one word, C - Place a sticker]", "📋 Round table discussion: groups discuss the unit and write conclusions on mahjong paper. [Diff: A - Lead the discussion, B - Contribute ideas, C - Draw the conclusion]"], "c": ["📋 Summarise the unit using a mind map/i-Think map; teacher guides pupils to complete it. [Diff: A - Suggest connections, B - Identify key words, C - Point to pictures]", "🎫 Exit ticket: write one thing learned from the unit lesson before leaving. [Diff: A - Write a sentence, B - Write a word, C - Draw and label]", "✅ True or False game: unit statements; pupils stand for true, sit for false. [Diff: A - Justify the answer, B - Say true/false, C - Copy the group]", "🙏 Closing reflection: 2-3 pupils give oral reflections; teacher summarises the unit lesson. [Diff: A - Lead the reflection, B - Share a sentence, C - Listen]", "📚 Homework: reinforcement worksheets based on the unit. Teacher explains instructions. [Diff: A - Challenge questions, B - Standard questions, C - Basic questions]", "🔮 Preview next lesson: show a picture/teaser about the next unit. Pupils predict. [Diff: A - Predict in sentences, B - Predict one word, C - Look at the picture]", "🎯 What Stuck With You Today?: pupils write the key idea from the unit on a sticky note. [Diff: A - Write a sentence, B - Write a word, C - Draw it]", "🔄 Quick Q&A with mini-whiteboards: unit review questions. [Diff: A - Write sentences, B - Write words, C - Show true/false]", "⭐ Understanding chart: pupils place a magnet on Understand / Unsure / Don't Understand. [Diff: A - Explain the choice, B - Place the magnet, C - Copy a friend]", "✏️ Daily reflection journal: write a short paragraph about today's unit learning. [Diff: A - Full paragraph, B - 2-3 sentences, C - Draw and label]", "📋 Concept map: teacher and pupils draw a unit concept map; pupils fill in blanks. [Diff: A - Add new branches, B - Fill the blanks, C - Point to the words]", "🎫 Exit ticket 2: 'I understand... I don't understand... I will...' for the unit. [Diff: A - Write all three, B - Complete two, C - Draw one]", "✅ True/False Quiz 2: 5 unit statements with green/red cards. [Diff: A - Explain why, B - Show green/red, C - Watch and show]", "🙏 Closing reflection with motivational words; 2-3 pupils share. [Diff: A - Give a message, B - Share a sentence, C - Listen]", "📚 Homework assignment: unit worksheets as reinforcement with various levels. [Diff: A - Challenge tasks, B - Standard tasks, C - Basic tasks]", "🔮 Future gateway: show a unit-related picture; pupils predict the next topic. [Diff: A - Predict in detail, B - Predict one word, C - Look at the picture]", "📝 Reflection note: brief notes in the reflection book about today's unit lesson. [Diff: A - Write a paragraph, B - Write sentences, C - Draw and label]", "🔄 Closure wheel: spin a wheel with unit summary questions and answer orally. [Diff: A - High-level questions, B - Standard questions, C - Picture questions]", "⭐ Self-assessment: magnet on the Understanding chart (Understand/Unsure/Don't Understand). [Diff: A - Explain the choice, B - Place the magnet, C - Copy a friend]", "✏️ Lightning summary: write 2-3 sentences summarising today's unit in 3 minutes. [Diff: A - Write full sentences, B - Write key words, C - Draw]", "🎵 Closing song: sing a unit song containing target vocabulary with movements. [Diff: A - Create movements, B - Sing along, C - Clap the beat]", "📦 Memory box: write one thing to remember from the unit; papers go in the Memory Box. [Diff: A - Write a sentence, B - Write a word, C - Draw it]", "🔔 Reflection bell: the pupil holding the bell shares one thing learned; the bell passes around. [Diff: A - Share a full sentence, B - Share one word, C - Pass the bell]", "📊 Quick survey: hands up for 'Who enjoyed the lesson?' 'Who found it difficult?'. [Diff: A - Give a reason, B - Vote with hands, C - Watch the vote]", "📖 Closing story: a short story tying together today's unit concepts. [Diff: A - Retell the story, B - Answer a question, C - Look at pictures]", "🎯 Challenge card: fun unit-based tasks to complete at home. [Diff: A - Challenge tasks, B - Standard tasks, C - Basic tasks]", "🗣️ Final discussion: summarise the unit; pupils ask questions. [Diff: A - Ask/answer questions, B - Contribute an idea, C - Listen]", "📸 Photo memory: photos of unit work are shared on Google Classroom/WhatsApp. [Diff: A - Write a caption, B - Select the photo, C - Look at the photos]", "💎 Teacher's message: motivational words linked to the unit's values. Pupils reflect. [Diff: A - Share a thought, B - Repeat the message, C - Listen]", "🌱 Learning promise: pupils write one promise to practise the unit skills; posted on the promise board. [Diff: A - Write a sentence, B - Write one word, C - Draw it]"]}, "zh": {"i": ["🎵 学生唱与主题相关的歌曲。教师用吉他或录音带领，同时在白板上显示歌词。学生分组创作与歌词匹配的创意动作。唱完后，教师就歌曲内容提问以激发思维并联系课程主题。[分层: A - 自创新歌词和创意动作, B - 在指导下唱歌并跟随示范, C - 拍手跟节奏]", "🎬 播放与主题相关的短视频（2-3分钟），如自然现象、日常情境或有趣故事。观看前教师提出2-3个引导性问题以激活先备知识。观看时学生做简要笔记或记住重要信息。观看后学生根据视频内容猜测课程主题。[分层: A - 用完整句子联系视频内容和主题并举例, B - 用一个词或短语猜主题, C - 将视频中的图片与主题匹配]", "🧩 找朋友游戏：准备图片卡和词语卡。每个学生随机拿一张卡。教师发出信号后，学生走动找到配对的伙伴（图片配词语）。配对的伙伴坐在一起读卡。这个活动帮助学生以有趣的方式掌握新词汇。[分层: A - 将词语与句子描述配对, B - 将图片与正确词语配对, C - 将相同图片配对]", "🎭 教师使用手指玩偶或手偶以吸引人的语调和多变的面部表情讲故事。玩偶作为媒介来传递与主题相关的内容。讲故事时教师在特定部分停下来问预测性问题。学生猜测角色、情节和可吸取的道德价值观。[分层: A - 用自己的话创造性地复述故事, B - 用语调重复主要角色的对话, C - 说出故事中角色的名字]", "🖼️ 准备4-6张顺序打乱的图片。学生分组根据对主题的理解将图片按正确顺序排列。排列后每组解释形成的故事情节。教师引导学生识别最逻辑的顺序。[分层: A - 排列图片并用自己句子创作完整故事, B - 排列图片并读提供的句子, C - 在指导下排列顺序]", "❓ 带与主题相关的实物或有趣图片。物品放在班前或分发给小组。教师提出引导性问题如你看到了什么？你感觉到了什么？或你想知道什么？以激发好奇心。学生根据观察口头回答。[分层: A - 用完整句子回答并给原因和例子, B - 用适当短语回答, C - 指认并点头或摇头]", "🔄 找不同游戏：展示两幅相似的图片，有几处不同。学生分组或个人比较并找出尽可能多的不同。这个活动训练观察能力和注意力。[分层: A - 用完整句子解释不同之处, B - 找出并指出不同, C - 匹配两幅图中的相同物体]", "👂 播放与主题相关的声音或简短音频，如动物叫声、车辆声、自然声或环境声。学生仔细听并辨认声音来源。这个活动刺激听觉技能并提高主动聆听能力。[分层: A - 猜测并详细描述声音特征, B - 准确辨认声音来源, C - 选择匹配声音的正确图片]", "🎈 传话球游戏：学生坐成圆圈。教师拿着球开始提问。球被随机传递。接球者必须自信地回答再传给下一个。这个活动建立学生在小组前说话的自信心。[分层: A - 用完整句子回答高阶思维问题并给理由, B - 用短语回答简单问题, C - 用提示帮助朋友回答]", "📦 神秘箱：准备一个封闭的箱子，里面装有与主题相关的物品。学生轮流把手伸进箱子，不看不摸物品并凭触觉猜。猜完后拿出物品确认。这个活动激发好奇心并训练推理能力。[分层: A - 全面描述物品的特征, B - 准确猜出物品, C - 触摸并指向匹配的图片]", "🎼 声音猜测：教师播放雨声、风声、动物叫声或车声。学生聆听并猜测声音。这个活动刺激听觉并与课程主题联系起来。[分层: A - 用完整句子解释声音与主题的联系, B - 准确猜出声音, C - 指向声音来源的图片]", "👀 图片快闪：教师展示与主题相关的图片合集30秒。学生尽可能记住。观看后列出记得的图片。[分层: A - 用完整句子列出并联系图片, B - 说出记得的图片名称, C - 指向匹配的图片]", "🤔 挑衅性问题：教师提出挑战性问题如'如果...会怎样？'或'我们可以...？'。学生有思考时间后再回答。[分层: A - 用理由和例子回答, B - 给简短意见, C - 从给定答案中选择]", "🎯 投靶游戏：教师在白板上画一个有三个圆圈的靶子。学生投软镖或球。每个圆圈按难度写有问题。[分层: A - 中心圈为高阶思维题, B - 中间圈为标准题, C - 外圈为简单题]", "🧠 回忆环节：学生闭眼回忆上节课学过的内容。教师用简单问题引导。这个活动激活长期记忆。[分层: A - 用完整句子说5件事, B - 说3个相关词, C - 指向上节课的图片]", "🎪 即兴戏剧：教师给一个简单情境，学生即兴表演。表演与将要学习的主题相关。[分层: A - 用对话和表情表演, B - 在教师指导下表演, C - 观察并给评论]", "🔦 故事悬念：教师讲一个有趣的短故事但不讲完。学生猜测结局。故事与学习主题相关。[分层: A - 创造自己的创意结局, B - 从给定结局中选择, C - 画结局图片]", "🎲 问题骰子：教师准备一个大型骰子，每面有问题。学生轮流掷骰子并回答与主题或先备知识相关的问题。[分层: A - 骰子上的高阶思维题, B - 标准水平题, C - 有帮助的图片题]", "🌈 词语彩虹：教师将关键词写在彩色纸条上。学生选一种颜色并读词。然后用简单句子解释意思。[分层: A - 解释意思并给例句, B - 读并说意思, C - 认词并指图片]", "🕵️ 班级侦探：教师将物品或图片藏在课室各处。学生当侦探寻找藏好的物品。每个物品与学习主题有关。[分层: A - 解释物品与主题的联系, B - 说出找到的物品名称, C - 指向并模仿声音]", "🌊 问题波浪：学生坐成圆圈。教师向左边的学生提问。学生回答后问下一个。问题波浪围绕主题传递。[分层: A - 向朋友问高阶思维问题, B - 准确回答, C - 聆听并重复]", "🔐 神秘箱2：教师准备3-4个编号的封闭箱子。每个箱子包含与主题相关的线索。小组选择箱子打开并解决挑战。[分层: A - 独立解决挑战, B - 在朋友帮助下解决, C - 得到教师帮助]", "⭐ 星星转盘：教师在白板上画一个星星，每个角有问题。学生掷骰子并根据所得数字回答问题。[分层: A - 解决问题的高阶思维题, B - 理解题, C - 基本技能题]", "🌿 自然观察：教师带学生到外面或窗边观察自然。学生分享他们看到、听到和感觉到的东西。[分层: A - 用短段落描述观察, B - 说3-5个观察到的项目, C - 指向并命名物体]", "📞 传声筒：教师提供玩具电话或纸杯电话。学生结对谈论主题。这个活动建立沟通能力和说话自信。[分层: A - 用完整句子讨论, B - 问和答简单问题, C - 聆听并重复]", "🎤 迷你卡拉OK：教师准备玩具麦克风和主题歌曲歌词。学生单独或分组跟着音乐唱歌。[分层: A - 自己创作动作唱歌, B - 在歌词指导下唱歌, C - 跟着节奏拍手]", "🧩 迷你填字游戏：教师准备简单的填字游戏网格，有4-6个字。学生结对根据图片提示填空。[分层: A - 不需要帮助完成, B - 在搭档帮助下完成, C - 将词与图片匹配]", "🏆 小组竞赛：教师将学生分成4-5组。提出与主题相关的问题。第一个正确回答的小组得分。[分层: A - 高阶思维题得加分, B - 标准题, C - 所有小组的基本题]", "📸 快照记忆：教师展示一张图片5秒后藏起来。学生凭记忆画或描述图片。[分层: A - 完整画和描述, B - 凭记忆画, C - 选择匹配的图片]", "🎭 比手画脚：教师不出声表演与主题相关的动作。学生猜动作。[分层: A - 为他人表演比手画脚, B - 正确猜出动作, C - 模仿教师]"], "p": ["📇 使用彩色大号字卡介绍新词汇。每张卡包含吸引人的图片和清晰的文字。教师展示卡片并正确发音。学生以全班、小组和个人形式认读、拼写和说出词语。将图片与词语联系起来以便理解。[分层: A - 用新词造句, B - 正确说出和拼写词语, C - 跟教师重复]", "👥 使用Think-Pair-Share技巧进行小组讨论。教师提出与主题相关的问题或议题。学生有1-2分钟独立思考（Think）。然后与同伴讨论（Pair）分享想法。最后选定的几组与全班分享（Share）。[分层: A - 用完整句子分享想法并给理由, B - 用短语分享观点, C - 听并重复朋友的想法]", "🔗 准备图片卡和词语卡。学生在桌子或白板上将图片与正确词语配对。教师指导并给反馈。配对后大声说词语。[分层: A - 配对并写简单句子, B - 配对并说出词语, C - 配相同的图片]", "🗣️ 听和重复关键短语的练习。教师用正确语调和重音说短语。学生以全班、小组和个人形式仔细听和重复。强调难词的发音和句子语调。[分层: A - 用正确语调和表情说短语, B - 在帮助下说简单短语, C - 说关键的词]", "📋 分类卡游戏：学生拿到词语卡需要分类到正确的组别如动物、植物、颜色或形状。教师在白板或桌子上提供类别。学生将卡贴在正确类别下同时说出词语。[分层: A - 分类并给出分类理由, B - 在朋友指导下分类, C - 匹配给的例子]", "📝 全班口头练习：教师展示图片或物品。学生齐声回答以建立信心。然后个别回答以进行评估。教师即时反馈。[分层: A - 用完整句子回答, B - 用一个词回答, C - 举手或指向答案]", "🎯 按时间类别（日、月、年）排列词语卡。学生拿到打乱的词语卡，分组按正确顺序排列。[分层: A - 排列并用时间造句, B - 按正确顺序排列卡, C - 将卡与图片匹配]", "🎲 教育棋盘游戏：学生掷骰子并按数字移动。每个格子包含与主题相关的问题如猜词、回答问题或造句。学生必须正确回答才能继续移动。[分层: A - 高阶思维水平题, B - 标准水平题, C - 帮助朋友回答]", "🃏 禁忌词游戏：学生选一张卡，必须向朋友描述这个词但不能说出这个词。其他朋友猜被描述的词。这个活动训练思维和沟通能力。[分层: A - 用完整句子描述, B - 用身体语言和手势, C - 向朋友展示图片]", "✏️ 画一个关于主题先备知识的简单思维导图。教师引导学生识别主要思想和辅助细节。学生在纸上或用数字应用画自己的思维导图。[分层: A - 带子主题和分支的完整导图, B - 有引导的部分导图, C - 在导图上涂色和贴图片]", "📖 轮流朗读：学生在小组内轮流读短文。每个学生读1-2句。教师纠正发音和语调。[分层: A - 用正确的语调和表情读, B - 在指导下读简单句, C - 逐字读]", "🃏 闪卡游戏：教师准备图片闪卡。结对轮流根据图片猜词。卡按主题分类。[分层: A - 用词造句, B - 正确说出词, C - 将卡与实物匹配]", "✂️ 剪贴配对：学生从杂志或工作纸剪下图片和词。在练习簿中将图片与正确的词配对。[分层: A - 根据配对写句子, B - 配对并整齐贴好, C - 给配对的图片上色]", "🎵 拼写歌：教师通过歌曲或节奏口诀教学生拼写。学生边拍桌子或拍手边拼写。[分层: A - 按音节拼写, B - 拼写3-4个字母的词, C - 看着词卡拼写]", "🗣️ 对子交谈：学生结对用给定短语谈论主题。教师提供对话框架。每对2-3分钟。[分层: A - 不需要框架用自己的句子交谈, B - 使用提供的框架, C - 重复朋友的短语]", "🧮 字母卡排序：学生收到字母卡组。教师说一个词，学生按正确顺序排列字母。[分层: A - 不需要例子排列, B - 使用词卡排列, C - 抄朋友]", "🎯 投掷并说出：教师在地板上画编号圆圈。学生将小球投进圆圈。根据投中的数字说词或短语。[分层: A - 说出并造句, B - 正确说出短语, C - 说出基本词]", "📝 整洁抄写：学生在练习簿中整齐抄写短句。教师强调书写、字距和整洁。[分层: A - 整齐抄写短段落, B - 抄写2-3个简单句, C - 沿着点抄写字]", "🔍 找词游戏：学生在字母网格中找隐藏的词。找到的词上色。[分层: A - 找6-8个隐藏词, B - 找4-5个容易的词, C - 在图片帮助下找词]", "🎪 阅读摊位：教师设置3-4个阅读摊位，有不同材料（故事、事实、诗歌、漫画）。学生访问每个摊位并阅读材料。[分层: A - 读并写摘要, B - 读并说主要内容, C - 看图并读能读的部分]", "📇 卡片配对：教师准备问题和答案卡。学生轮流取问题卡并找匹配的答案卡。[分层: A - 回答理解题, B - 将问题与答案匹配, C - 将图片与词匹配]", "✏️ 圈出答案：教师分发有多层次问题的工作纸。学生读问题并圈出正确答案。[分层: A - 回答并写句子, B - 圈出正确答案, C - 给正确答案上色]", "🗂️ 迷你作品集：学生整理和更新他们的学习作品集。教师指导他们选择最好的作品放入作品集。[分层: A - 给作品写简短反思, B - 按日期整理作品, C - 给作品集封面上色]", "🔗 词语接龙：学生坐成圆圈。第一个学生说一个词。下一个学生以前一个词的最后一个字开头说新词。[分层: A - 说有挑战性的词, B - 说简单的词, C - 在朋友帮助下说词]", "🎲 棋盘游戏：教师准备简单的棋盘游戏有编号路径。学生掷骰子移动。每格有任务如读、拼写或说。[分层: A - 高阶思维任务如造句, B - 标准任务, C - 基本任务如指认]", "📣 新闻播报：学生轮流当'新闻播报员'，在班前用麦克风呈现事实或信息。[分层: A - 自信流利地呈现, B - 读提供的稿子, C - 读一两个字]", "🖍️ 按码上色：教师提供上色纸，有基于词的颜色代码。学生读词并按码上色。[分层: A - 整齐在线上色, B - 在代码指导下上色, C - 自由上色]", "👥 与同桌分享：学生与同桌在2分钟内分享他们对主题的了解。然后选几名学生与全班分享。[分层: A - 分享4-5个相关事实, B - 分享2-3个简单点, C - 听并重复]", "📋 检查清单：学生用图片检查清单检查自己的理解。在知道的项目打✓，不知道的打?。[分层: A - 写自己的清单, B - 在提供的清单上打勾, C - 在教师帮助下打勾]", "🎬 幻灯片展示：教师展示关于主题的简短幻灯片。每张幻灯片有一个词或概念配图片。学生齐读。[分层: A - 解释幻灯片中的概念, B - 读幻灯片上的词, C - 指向幻灯片上的图片]"], "d": ["📖 结对阅读短文。教师准备3个难度级别（容易、标准、挑战）的短文。学生与同伴轮流阅读并讨论内容。教师提供分层理解题涵盖字面、推理和高阶思维水平。学生口头或书面回答。[分层: A - 读高级短文回答高阶思维题, B - 读标准短文回答字面题, C - 读图画短文画答案]", "✍️ 使用i-Think思维图（圆圈图、气泡图、树状图）写段落。学生写之前用思维图规划写作。个人或结对照写。教师提供写作框架和检查清单指导。[分层: A - 写内容组织良好语法正确的完整段落, B - 用框架和短语写引导句, C - 排列给的句子并描写]", "🎭 角色扮演活动：学生表演与主题相关的日常情景对话。教师提供各种情景卡。学生分组设计对话并练习后在班前表演。教师评估语调、发音和表情。[分层: A - 根据情景创造性地创作自己的对话, B - 用给对话并改编, C - 在教师指导下表演对话]", "🖼️ 画廊漫步：学生作品展示在桌子上或墙上。学生分组走动看朋友作品并记录重要信息。他们在便利贴或反馈卡上留言。每组在每站停2-3分钟。[分层: A - 写有建设性、具体和有意义的评论, B - 写简短积极评论, C - 在作品上贴贴纸或标记]", "📘 基于主题制作折叠小书。教师用A4纸提供小书模板。学生创造性地填写内容包括定义、图片、例子和总结。小书包含课堂摘要。[分层: A - 用自己的话和插图填写完整内容, B - 用问题和图片填写引导内容, C - 涂色并贴给的标签]", "🏫 站点式学习：学生分组轮流到4-5个不同任务的站点。每站5-7分钟。站点包括阅读、写作、涂色、游戏和创意。教师监测并在需要帮助的站点指导。[分层: A - 带复杂任务的高阶思维挑战站, B - 带明确指示的标准任务站, C - 带密切支持的教师辅导站]", "🧩 语言游戏：Scrabble、Boggle、词语卡游戏或填字游戏。学生分组玩以加强词汇、拼写和句子结构。游戏在规定时间内轮换。[分层: A - 用找到的词造句, B - 在网格中找隐藏的词, C - 匹配字母组成词]", "🗺️ 分组创建思维导图或思考图。用马尼拉纸和彩色马克笔。学生画带图片和颜色的创意思维导图。每组呈现自己的导图。作品展示在教室角落。[分层: A - 完整导图带子主题和详细分支, B - 带相关主要思想的圆圈图, C - 在朋友帮助下画图]", "💻 使用Quizizz、Kahoot!、Google Classroom或Wordwall等教育应用。学生用手机、平板或电脑个人或分组回答互动测验。问题涵盖各种难度。分数实时显示。[分层: A - 带推理的高阶思维题, B - 带选项的标准题, C - 带答案选项的图片题]", "🎨 手工艺活动：制作与主题相关的海报、剪贴簿、3D模型或立体模型。学生用彩纸、回收盒、胶水、剪刀、彩铅和回收材料。作品展示和呈现。[分层: A - 没有范例创造性地制作手工艺, B - 用给的模板和范例, C - 帮助涂色和装饰]", "🔬 小组实验或调查。学生进行科学活动以验证假设。他们分组记录观察、分析数据并得出结论。教师逐步指导。[分层: A - 用变量控制设计自己的实验, B - 按提供的实验步骤操作, C - 帮助朋友记录数据和观察]", "📊 小组项目：学生分组完成项目并呈现作品。项目包括研究、信息收集、分析和创意呈现。项目为期1-2周。[分层: A - 有深入研究和分析的复杂项目, B - 有指导的标准项目, C - 帮助小组完成简单任务]", "🎪 学习嘉年华：学生设置与主题相关的互动展位。每组管理一个展位，活动包括测验、游戏或展览。其他班或教师参观展位。[分层: A - 独立完全管理和运营展位, B - 在指导下帮助管理展位, C - 参观和参与展位活动]", "📝 项目式学习：学生分组完成文件夹或剪贴簿。项目包括标题、目标、内容、插图和总结。参考来源包括书籍、互联网和访谈。[分层: A - 内容和创意详细的完整文件夹, B - 有引导内容的剪贴簿, C - 带标签的图片和材料收集]", "🎯 热座活动：一名学生坐在班前的热座上。同学轮流问与主题相关的问题。热座上的学生必须自信清晰地回答。这个活动建立自信心和流利度。[分层: A - 问有挑战性和深度的问题, B - 自信准确回答, C - 记录答案并帮助朋友]", "📚 小组阅读：学生分成小组。每组按水平阅读不同的段落。读后讨论内容并完成思维导图。[分层: A - 高级段落配高阶思维题, B - 标准水平段落, C - 图片段落配简单题]", "✍️ 创意写作：学生根据刺激图片写短文或故事。教师提供词库和短语。[分层: A - 写3-4段有创意的段落, B - 在指导下写1-2段, C - 写3-5个简单句]", "🎭 角色扮演2：学生表演涉及礼貌用语的日常情境。例子：在商店、图书馆或教师办公室。分组创作对话。[分层: A - 创造性创作自己的对话, B - 改编给定的对话, C - 在指导下表演短对话]", "📊 条形图和图表：学生根据给定数据构建条形图或图表。他们口头或书面解释数据并得出结论。[分层: A - 构建图表并用段落解释, B - 用引导性问题构建图表, C - 给准备好的图表上色]", "🎨 创意文件夹：学生个人或分组完成主题文件夹。包括标题、内容、图片、插图和总结。[分层: A - 内容详细完整的文件夹, B - 有引导内容和例子的文件夹, C - 带标签的图片收集]", "🧪 语言实验：学生进行语言实验如按字母顺序排列词、识别句型或分类词类。[分层: A - 不需要例子进行实验, B - 使用引导性工作纸, C - 对词卡分类]", "📝 连环图写作：学生根据4-6张连环图写作。写作前按正确顺序排列图片。[分层: A - 写语法正确的完整作文, B - 每张图写2-3句, C - 每张图写词]", "🔍 文本研究：学生研究样本文本以识别语言特征如形容词、动词或连词。他们标记和分类找到的词。[分层: A - 识别和分类所有词类, B - 在指导下找关键词, C - 将词与词类匹配]", "📖 精读：学生精读段落并回答多层次的理解题，涵盖字面、推理和评价水平。[分层: A - 带推理的高阶思维题, B - 有选择的推理题, C - 字面图片题]", "🤝 拼图合作学习：每个组员成为特定子主题的专家。他们与其他组的专家讨论，然后回原组教学。[分层: A - 成为有效的专家教同伴, B - 在材料指导下成为专家, C - 接受专家同伴的教学]", "🎮 游戏化学习：学生玩教育游戏如Wordwall、Kahoot或Quizizz。问题与主题相关。得分被追踪并表扬赢家。[分层: A - 限时高阶思维题, B - 标准题, C - 图片题]", "📽️ 数字演示：学生用PowerPoint、Canva或Google Slides准备简短演示。在班前呈现。[分层: A - 完整的创意演示, B - 用提供的模板演示, C - 帮助准备幻灯片]", "📰 班级简报项目：学生制作班级简报，包含新闻、短文、诗歌和艺术作品。分发给其他班或家长。[分层: A - 写文章和编辑内容, B - 在指导下写短文, C - 给简报上色和装饰]", "🎯 分组焦点任务：每组得到不同水平的特定任务。A组-挑战性任务，B组-标准任务，C组-基本任务。[分层: A - 高阶思维解决问题任务, B - 理解和应用任务, C - 识别任务]", "🔬 探究项目：学生分组进行探究项目。他们提出问题、找信息、分析并得出结论。[分层: A - 有假设和分析的完整探究, B - 有引导性问题的探究, C - 从给定来源收集信息]"], "ps": ["👨‍🏫 选定小组在班前呈现作品。小组代表用海报、幻灯片或模型等辅助工具呈现。解释涵盖目标、过程和成果。其他组给反馈和提问。[分层: A - 自信、清晰、创造性地呈现, B - 在教师指导和不记帮助下呈现, C - 展示作品由教师解释]", "📝 使用Kahoot!或Quizizz进行个人或小组快速测验。问题涵盖从基础到高阶思维的各种难度。学生在限定时间内作答。分数和排名实时显示以提高动力。[分层: A - 带推理的高阶思维题, B - 带选项的标准题, C - 带答案选项的图片题]", "💬 反射圈：每位学生口头分享今天学到的一件事。教师随机选几位学生分享。反射也可以在学习日志中书面完成。[分层: A - 用完整句子分享并举例和联系, B - 用短语简短分享, C - 指向图片或学习材料]", "✏️ 3-2-1活动：学生写3件学到的事、2件有趣的事和1个仍然想知道的问题。写在纸或便利贴上。然后贴在教室角落的反射板上。[分层: A - 用正确句子完整写, B - 用提示问题写引导内容, C - 画图并写标签]", "🗣️ 全班集思广益总结课程。教师以思维导图格式把学生想法写在白板上。学生讨论想法之间的联系并一起做结论。[分层: A - 给有洞察力和联系的想法, B - 用适当理由同意或不同意, C - 复述朋友的想法]", "⭐ 同伴互评：学生用简单量规如星星或笑脸评估朋友的作品。学生就给优势和改进建议给出口头或书面评论。[分层: A - 准确客观地使用评估量规, B - 给星星和短评, C - 在作品上贴贴纸]", "📊 迷你展览：所有作品展示在教室角落或桌子上。学生分组走动看展览。选几位学生向参观者解释他们的作品。[分层: A - 创造性地布置和组织展览, B - 清晰解释作品, C - 参观和看展览]", "🎯 快速口头测验：教师随机提出即兴问题以测试理解。学生口头回答。问题涵盖从简单到高阶思维的各种水平。[分层: A - 挑战思维的进阶题, B - 标准水平题, C - 有帮助和提示的简单题]", "🔄 圆桌活动：小组中每位学生轮流在一张纸上写一个想法。纸按顺时针方向轮转直到所有组员都贡献。与全班分享结果。[分层: A - 用语法正确的句子写完整想法, B - 写相关的关键词, C - 画相关图片]", "💭 在简短学习日志中写书面反思。学生写学到了什么、什么有趣以及什么还不清楚。教师阅读并给评论和鼓励。[分层: A - 写带深度反思的完整段落, B - 写几个简单句子, C - 画图并写标签]", "👨‍🏫 小组呈现：小组代表在班前呈现作品。呈现涵盖目标、过程和成果。其他组用简单量规评估。[分层: A - 自信呈现并回答问题, B - 在教师指导下呈现, C - 展示作品]", "📝 口头测验：教师口头提出问题。学生用小白板回答。大家同时展示答案即时反馈。[分层: A - 带解释的高阶思维题, B - 标准理解题, C - 选择题]", "💭 3R反思：学生写3R - 回忆（记得什么）、反应（感觉如何）、联系（如何应用）。[分层: A - 用完整句子写3R, B - 用短语写, C - 画3R图片]", "✏️ i-Think思维图：学生根据主题完成i-Think思维图（圆圈图、气泡图、树状图）。教师提供空白模板。[分层: A - 不需要帮助完成, B - 用关键词填空, C - 上色和贴标签]", "🎯 快速测试：教师给5个简答题，5分钟内完成。问题涵盖各种水平。一起检查答案。[分层: A - 高阶思维解决问题题, B - 客观和结构题, C - 配对和是非题]", "🤝 分享环节：学生口头或书面与同学分享所学内容。每个学生有机会分享。[分层: A - 作为完整解释分享, B - 用3-4个短句分享, C - 指向学习材料]", "🏆 小组测验：轮流给小组提问。小组讨论并给出答案。答对得分。[分层: A - 加分的高阶思维题, B - 标准理解题, C - 所有小组的基本题]", "📸 作品展览：学生作品展示在班级板报或角落。学生参观展览并在便利贴上留言。[分层: A - 写建设性具体评论, B - 写简短积极评论, C - 在作品上贴贴纸]", "🗣️ 问答环节：学生有机会问还不理解的问题。同学或教师解释。[分层: A - 问高阶思维问题, B - 问简单问题, C - 回答同伴的问题]", "🎲 转盘答题：教师准备有问题的转盘。学生转动转盘并根据指针回答问题。[分层: A - 高阶思维论述题, B - 客观题, C - 图片题]", "📊 成就图表：学生在简单图表上标记自己的成就。他们记录正确答案或已完成的任务。[分层: A - 分析图表并写反思, B - 在指导下标记图表, C - 按成就上色]", "💬 圆圈讨论时间：学生坐成圆圈讨论主题。每个学生必须给一个意见或观点。教师引导。[分层: A - 给有见地的意见并说明理由, B - 给简短意见, C - 点头或摇头]", "🎭 重演：学生用短剧重演所学的情境或概念。时长2-3分钟。[分层: A - 写剧本并表演, B - 在指导下表演, C - 当观众并评估]", "🧩 PBL挑战：学生得到开放式问题在小组中解决。10分钟内呈现解决方案。[分层: A - 创造性解决, B - 在指导下解决, C - 在小组中给简单意见]", "📝 反思日志：学生在反思日志中写所学内容。条目放入学习作品集。[分层: A - 写有深度反思的日志, B - 写3-4句, C - 画图并写标签]", "🌟 星评任务：学生用星评量规（1-5星）评估自己或同伴的作品。口头证明评分。[分层: A - 用量规评估并给评论, B - 用星评分, C - 在作品上贴星]", "📞 抽题回答：教师准备装有问题的袋子。学生抽一个问题并在班前回答。[分层: A - 挑战性高阶思维题, B - 理解题, C - 基本技能题]", "🔍 同伴检查：学生与同伴交换练习簿检查答案。他们标记正确答案并纠正错误。[分层: A - 检查并给改进意见, B - 在指导下检查, C - 对照答案]", "🎯 反思靶子：学生在箭形纸上写反思并按理解水平贴在靶子板上。[分层: A - 写完整反思并贴, B - 写简短反思, C - 将箭贴在靶子上]", "📋 圆桌讨论：每组讨论主题并在马尼拉纸上写结论。结果简短呈现。[分层: A - 写完整结论并呈现, B - 在指导下写要点, C - 上色和装饰纸]"], "c": ["📋 用思维图或i-Think图总结。教师引导学生完成概念图。学生根据今天的学习用正确信息填空。全班合作完成总结。[分层: A - 独立完成概念图, B - 在指导下填一半图, C - 涂色并在图上贴标签]", "🎫 Exit Ticket：学生离开前在小纸或便利贴上写答案。简单问题如今天我学到的一件事或我仍然困惑的是。教师收集并检查以评估理解。[分层: A - 用完整句子写答案, B - 写词语或短语, C - 画图并写标签]", "✅ 对或错游戏：教师陈述与主题相关的说法。学生认为对就站，错就坐。或用绿卡（对）和红卡（错）。这个有趣的游戏快速测试理解。[分层: A - 给出对或错的理由, B - 自信答对或错, C - 跟朋友的动作]", "🙏 结束祈祷或歌曲。选2-3名学生口头反思。教师领祷学生回应。学习在积极氛围中结束。[分层: A - 领祷并给反思, B - 分享简短反思, C - 听并对祈祷回应]", "📚 教师布置巩固练习作为家庭作业。作业基于所学主题。教师清楚说明指示并给例子。学生把作业收进书包。[分层: A - 高阶思维和解决问题作业, B - 标准题, C - 基础巩固题]", "🔮 预习下节课：教师展示图片或提出关于下节课的引导性问题。学生预测将要学的内容以激发兴趣和好奇心。[分层: A - 用完整句子预测, B - 用一个词预测, C - 在指导下看图]", "🎯 学生在便利贴上完成今天学到的。他们写下今天学习中最记得的概念或技能。便利贴在教室角落的专设板上。[分层: A - 用清晰完整句子写, B - 写短短语, C - 画图]", "🔄 用小白板进行快速问答。教师问与主题相关的问题。学生把答案写在小白板上并同时展示。教师即时反馈。这个活动让教师快速评估全班理解。[分层: A - 挑战性高阶思维题, B - 标准水平题, C - 展示写的答案]", "⭐ 学生在理解程度表（理解/不确定/不理解三个部分）上放磁铁或标记。教师可以直观看到全班的理解水平并计划后续行动。[分层: A - 解释理解水平选择, B - 在自已的水平上放磁铁, C - 帮朋友放磁铁]", "✏️ 每日反思日志：学生写关于今天学习的短段落。重点写学到了什么、感受如何以及将要做什么。教师阅读并给鼓励性评论。[分层: A - 写带反思的完整段落, B - 写3个简单句子, C - 画带标签的图]", "📋 概念图：教师和学生一起在白板上画概念图。学生用正确的词填空。概念图将来参考。[分层: A - 画自己的概念图, B - 在指导下填一半图, C - 在图上贴标签]", "🎫 出门票2：学生在出门票上写：'我理解... 我不理解... 我将...'。票收集用于评估。[分层: A - 用完整段落写, B - 用短语写, C - 画笑脸/哭脸]", "✅ 是非题测验2：教师说5个陈述。学生用绿卡（对）和红卡（错）。大家同时展示。[分层: A - 给对或错的理由, B - 自信回答, C - 跟同伴]", "🙏 结束反思：学生以祈祷或励志语结束。选2-3名学生口头反思。课堂积极结束。[分层: A - 领祷并给有意义反思, B - 给简短反思, C - 聆听并回应]", "📚 家庭作业：教师给工作纸作为巩固练习。任务涵盖各种水平。教师解释如何作答。[分层: A - 高阶思维解决问题作业, B - 理解和应用题, C - 基础巩固]", "🔮 未来之门：教师展示与下节课相关的图片或物品。学生预测将要学的内容。[分层: A - 用完整句子预测, B - 用一个词预测, C - 看预测图片]", "📝 反思笔记：学生在反思簿或日志中写简短笔记。重点写今天的学习体验。[分层: A - 写有反思和计划的笔记, B - 写3-4句, C - 画图并写标签]", "🔄 结束转盘：教师准备有总结问题的转盘。学生转动并口头回答。[分层: A - 高阶总结题, B - 标准总结题, C - 基础水平题]", "⭐ 自我评估：学生在理解水平表（理解/不确定/不理解）上放磁铁。教师看到全班理解分布。[分层: A - 解释水平选择, B - 在自己水平上放磁铁, C - 帮朋友放磁铁]", "✏️ 闪电总结：学生在3分钟内写2-3句总结学到的内容。与同伴分享。[分层: A - 写语法正确的完整总结, B - 用短语写总结, C - 写关键词]", "🎵 结束歌：学生唱包含主题关键词的结束歌。边唱边做动作。[分层: A - 创造自己的动作, B - 用教的动作唱, C - 拍节奏]", "📦 记忆盒：学生在纸上写今天学习中要记住的一件事。纸放入班级'记忆盒'。[分层: A - 写带解释的完整句, B - 写短语, C - 画图]", "🔔 反思铃：响铃。拿铃的学生分享学到的一件事。铃传给下一个学生。[分层: A - 用完整句子分享3件事, B - 分享1件简单事, C - 指向学习材料]", "📊 快速调查：学生举手回答调查问题如'谁喜欢今天课堂？'、'谁觉得难？'。[分层: A - 给调查答案的理由, B - 举手, C - 模仿同伴]", "📖 结束故事：教师读一个将所有概念联系起来的短故事。学生聆听并联系学习体验。[分层: A - 用句子将故事与主题联系, B - 复述故事的一部分, C - 指向故事角色]", "🎯 挑战卡：学生收到在家完成的挑战卡。卡包含有趣的主题相关任务。[分层: A - 高阶解决问题挑战, B - 标准水平挑战, C - 基础挑战]", "🗣️ 最后讨论：教师引导最后讨论以总结课程。鼓励学生提问。[分层: A - 用自己的话总结, B - 给关于主题的意见, C - 听教师的总结]", "📸 照片记忆：教师拍学生作品或活动的照片。照片上传到Google Classroom或班级WhatsApp群。[分层: A - 写照片说明, B - 命名照片, C - 看和记住]", "💎 教师寄语：教师给与主题和价值观相关的寄语或励志语。学生聆听和反思。[分层: A - 在日志中写寄语, B - 重复寄语, C - 点头理解]", "🌱 学习承诺：学生写一个承诺来实践所学内容。承诺贴在班级承诺板上。[分层: A - 用完整句子写承诺, B - 写简短承诺, C - 画承诺图片]"]}, "pra": {"i": ["Aktiviti Set Induksi 1: Aktiviti pembelajaran prasekolah untuk fasa Set Induksi. Guru menggunakan pelbagai pendekatan bagi memastikan pembelajaran berkesan dan menyeronokkan. Aktiviti ini sesuai untuk murid 4+ dan 5+ dengan penyesuaian mengikut keperluan individu.", "Aktiviti Set Induksi 2: Aktiviti pembelajaran prasekolah untuk fasa Set Induksi. Guru menggunakan pelbagai pendekatan bagi memastikan pembelajaran berkesan dan menyeronokkan. Aktiviti ini sesuai untuk murid 4+ dan 5+ dengan penyesuaian mengikut keperluan individu.", "Aktivi
