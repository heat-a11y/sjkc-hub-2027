<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🇲🇾 SJKC Hub 2027 — eRPH-PM & Penjana Kertas Ujian</title>
<link rel="stylesheet" href="/tailwind.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script defer src="curriculum-db.js"></script>
<script defer src="rpt-data.js"></script>
<script defer src="exam-browser.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1E3A5F">
<meta name="description" content="eRPH-PM — Rancangan Pengajaran Harian Malaysia (SJKC) — fully offline-capable lesson plan generator.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); }); }
</script>
</head>
<body class="bg-[#FFF8F0] text-[#3A2A1A] font-sans antialiased" x-data="app()">


<div class="flex h-screen">
  <aside class="sidebar-transition fixed inset-y-0 left-0 z-40 flex w-72 flex-col text-white md:static" x-bind:class="sO?'translate-x-0':'-translate-x-full md:translate-x-0'" style="background:linear-gradient(180deg,#1E3A5F,#162D4A)">
    <div class="flex h-14 items-center gap-2 border-b border-white/10 px-4"><span class="flex h-8 w-8 items-center justify-center rounded-xl bg-[#C4956A] text-sm font-bold">🇲🇾</span><div><p class="text-sm font-semibold">eRPH-PM</p><p class="text-[9px] text-blue-200/70">SJK(C) PIN MIN, BIDOR</p></div></div>
    <div class="border-b border-white/10 p-3"><p class="mb-1.5 text-[10px] font-semibold uppercase tracking-wide text-blue-300/50"><span>👨‍🏫 </span><span x-text="t('guru')"></span></p>
      <select x-model="tg" @change="sv()" class="w-full rounded-lg bg-slate-800/50 px-2.5 py-2 text-xs text-slate-200 border border-slate-600"><option value="" x-text="t('pilihGuru')"></option><template x-for="(info,code) in D.TEACHERS" :key="code"><option :value="code" x-text="info.n+' ('+code+')'+(info.c?' '+info.c:'')"></option></template></select>
      <button @click="tui.open=!tui.open" class="mt-1.5 w-full text-left text-[10px] text-blue-200/70 hover:text-white" x-text="tui.open?'▾ '+(t('guru')):'▸ '+(t('guru'))"></button>
      <div x-show="tui.open" x-cloak class="mt-1.5 space-y-1.5 rounded-lg border border-white/10 bg-black/20 p-2">
        <template x-for="(info,code) in D.TEACHERS" :key="code">
          <div class="flex items-center justify-between gap-1">
            <span class="truncate text-[10px] text-slate-300" x-text="code+' · '+(info.n||'')+(info.c?' '+info.c:'')"></span>
            <span class="flex shrink-0 gap-1">
              <button @click="gLoad(code)" class="text-[10px] text-slate-300 hover:text-white" x-text="'✏️'"></button>
              <button @click="gDel(code)" class="text-[10px] text-red-400 hover:text-red-300" x-text="'🗑️'"></button>
            </span>
          </div>
        </template>
        <div class="space-y-1.5 border-t border-white/10 pt-1.5">
          <input x-model="tui.code" x-show="!tui.editing" :placeholder="t('gCode')" class="w-full rounded-md bg-slate-900/60 border border-slate-600 px-2 py-1 text-[10px] uppercase text-slate-200 placeholder-slate-400 focus:outline-none focus:border-[#C4956A]">
          <input x-model="tui.n" :placeholder="t('gName')" class="w-full rounded-md bg-slate-900/60 border border-slate-600 px-2 py-1 text-[10px] text-slate-200 placeholder-slate-400 focus:outline-none focus:border-[#C4956A]">
          <input x-model="tui.c" :placeholder="t('gCn')" class="w-full rounded-md bg-slate-900/60 border border-slate-600 px-2 py-1 text-[10px] text-slate-200 placeholder-slate-400 focus:outline-none focus:border-[#C4956A]">
          <div class="flex gap-1.5">
            <button @click="gSave()" class="flex-1 rounded-md bg-[#C4956A] px-2 py-1 text-[10px] font-semibold text-white hover:bg-[#8B5A2B]" x-text="t('gSave')"></button>
            <button @click="gAdd()" class="rounded-md bg-slate-600 px-2.5 py-1 text-[10px] font-semibold text-white hover:bg-slate-500" x-text="t('gAdd')"></button>
          </div>
        </div>
      </div>
    </div>
    <nav class="flex-1 space-y-0.5 overflow-y-auto p-2">
      <template x-for="tab in tabs" :key="tab.id">
        <button @click="sw(tab.id)" class="flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-xs font-medium transition-colors" :class="a===tab.id?'bg-[#C4956A]/20 text-[#C4956A]':'text-blue-200/80 hover:bg-white/10 hover:text-white'"><span x-text="tab.i"></span><span x-text="t(tab.l)"></span><span x-show="tab.c" class="ml-auto rounded-full bg-[#C4956A]/20 px-1.5 py-0.5 text-[9px] text-[#C4956A]" x-text="tab.c"></span></button>
      </template>
    </nav>
    <div class="border-t border-white/10 p-3 text-center text-[9px] text-blue-300/40"><span>🇲🇾 v4.1 | </span><span x-text="t('footer')"></span></div>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-14 items-center gap-2 border-b border-[#C4956A]/10 bg-[#FFF8F0]/95 backdrop-blur-md px-3 shadow-sm">
      <button @click="sO=!sO" class="rounded-lg p-1.5 text-[#8B5A2B] hover:bg-[#C4956A]/10 md:hidden"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
      <div class="flex items-center gap-1.5 text-xs font-medium text-[#8B5A2B]"><span x-text="tI()"></span><span x-text="tL()"></span></div>
      <div class="ml-auto flex items-center gap-2 text-xs text-[#8B5A2B]/60"><span x-text="tg?sl().length+' slot':''"></span><template x-if="rph.length"><span class="rounded-full bg-[#C4956A]/20 px-2 py-0.5 text-[10px] font-medium text-[#8B5A2B]" x-text="rph.length+' RPH'"></span></template><span x-show="savedAt" class="rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-medium text-emerald-600" x-text="'💾 '+savedAt"></span>
        <select x-model="uiLang" @change="setLang(uiLang)" class="ml-1 rounded-lg border border-[#C4956A]/20 bg-white px-1.5 py-1 text-[11px] font-semibold text-[#8B5A2B] focus:outline-none" title="UI Language"><option value="bm">BM</option><option value="en">EN</option><option value="zh">中文</option></select>
        <button @click="toggleDark()" class="rounded-lg border border-[#C4956A]/20 bg-white px-1.5 py-1 text-[11px] hover:bg-[#FFF8F0]" :title="t('dark_toggle')" x-text="dark?'☀️':'🌙'"></button>
      </div>
    </header>
    <div x-show="storageFull" x-cloak class="flex flex-wrap items-center gap-2 border-b border-red-300 bg-red-50 px-3 py-2 text-xs text-red-700">
      <span x-text="t('warnStorage')"></span>
      <button @click="bakExport()" class="rounded border border-red-300 bg-white px-2 py-1 font-semibold hover:bg-red-100" x-text="t('bak_remindBtn')"></button>
      <button @click="storageFull=false" class="ml-auto text-red-400 hover:text-red-700">✕</button>
    </div>
    <div x-show="multiTab" x-cloak class="flex flex-wrap items-center gap-2 border-b border-amber-300 bg-amber-50 px-3 py-2 text-xs text-amber-800">
      <span x-text="t('warnMultiTab')"></span>
      <button @click="location.reload()" class="rounded border border-amber-300 bg-white px-2 py-1 font-semibold hover:bg-amber-100" x-text="t('reload')"></button>
      <button @click="multiTab=false" class="ml-auto text-amber-500 hover:text-amber-800">✕</button>
    </div>
    <main class="flex-1 overflow-y-auto p-2 md:p-4">

      <!-- 📅 JADUAL -->
      <section x-show="a==='tt'" x-cloak class="max-w-6xl mx-auto">
        <template x-if="!tg"><div class="flex h-48 items-center justify-center text-[#8B5A2B]/60 text-sm" x-text="t('tt_empty')"></div></template>
        <template x-if="tg">
          <div><div class="mb-2 flex items-center justify-between"><h2 class="text-base font-bold text-[#3A2A1A]"><span x-text="t('tt_title')"></span> <span x-text="tN()"></span></h2><div class="flex gap-2"><span x-show="currentWeek&&weekParity()" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-[#FFF8F0] px-2 py-2 text-xs font-medium text-[#8B5A2B]" x-text="weekParity()==='ganjil'?t('tt_altOdd'):t('tt_altEven')"></span><button @click="wkPrint()" x-show="sl().length" class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50" x-text="t('wk_print')"></button><button @click="expTT(tg)" x-show="sl().length" class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50" x-text="t('tt_csv')"></button><button @click="gen()" x-show="sl().length" class="btn-jana inline-flex items-center gap-1 rounded-lg px-3.5 py-2 text-xs font-semibold text-white shadow-md" style="background:linear-gradient(135deg,#C4956A,#8B5A2B)" x-text="t('tt_jana')"></button></div></div>
          <div class="overflow-x-auto rounded-xl border border-[#C4956A]/20 bg-white shadow-sm"><table class="w-full min-w-[760px] text-xs"><thead><tr class="border-b bg-[#FFF8F0]"><th class="px-1.5 py-2 text-left font-semibold text-[#8B5A2B] w-20" x-text="t('tt_time')"></th><template x-for="d in D.DAYS" :key="d"><th class="px-1.5 py-2 text-center font-semibold text-[#8B5A2B]"><div x-text="d"></div><div class="text-[9px] font-normal opacity-60" x-text="dayDate(d)"></div></th></template></tr></thead>
          <tbody><template x-for="per in D.PERIODS" :key="per[0]"><tr class="border-b border-[#C4956A]/10" :class="per[0]==='REHAT'?'bg-amber-50/50':''"><td class="px-1.5 py-1 text-[10px] font-medium text-[#8B5A2B]/60" x-text="per[0]+' '+per[1]+'-'+per[2]"></td><template x-for="d in D.DAYS" :key="d"><td @click="editSlot(tg,d,per[0])" class="px-0.5 py-0.5 text-center border-l border-[#C4956A]/10 align-top cursor-pointer hover:bg-[#C4956A]/5 transition-colors min-h-[32px]"><template x-for="s in gS(d,per[0])" :key="s.c+s.s"><div class="rounded border px-1 py-0.5 text-[10px] leading-tight mb-0.5" :class="clr(s.s)"><div class="font-semibold text-[9px]" x-text="s.n"></div><div class="text-[8px] opacity-70" x-text="s.c.replace('Tahun ','Y')"></div></div></template></td></template></tr></template></tbody></table></div><p class="mt-1 text-[9px] text-[#8B5A2B]/40 italic" x-text="t('tt_hint')"></p></div>
        </template>
      </section>

      <!-- ⚡ JANA RPH -->
      <section x-show="a==='rph'" x-cloak class="max-w-4xl mx-auto">
        <div x-show="rph.length && bakOverdue()" class="mb-3 flex flex-wrap items-center gap-2 rounded-lg border border-amber-300 bg-amber-50 p-2 text-xs text-[#78350f]">
          <span x-text="bakRemindText()"></span>
          <button @click="bakExport()" class="inline-flex items-center gap-1 rounded-lg border border-amber-300 bg-white px-2.5 py-1 text-[11px] font-semibold text-amber-700 hover:bg-amber-100" x-text="t('bak_remindBtn')"></button>
        </div>
        <div class="mb-3 flex flex-wrap items-center gap-2">
          <button @click="gen()" x-show="tg" class="inline-flex items-center gap-1 rounded-lg px-4 py-2 text-xs font-semibold text-white shadow-md" style="background:linear-gradient(135deg,#C4956A,#8B5A2B)" x-text="t('rph_jana')"></button>
          <select x-model="currentWeek" @change="sv()" class="rounded-lg border border-[#C4956A]/20 bg-white px-2 py-1.5 text-xs font-medium text-[#3A2A1A]"><option value="" x-text="t('rph_week')"></option><template x-for="w in D.TAKWIM" :key="w.m"><option :value="w.m" x-text="(w.l?w.l:'Minggu '+w.m+' ('+w.s+' - '+w.e+')')" :disabled="w.m===0"></option></template></select>
          <button @click="regenActsAll()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-green-300 bg-green-50 px-3 py-2 text-xs font-medium text-green-700 hover:bg-green-100"x-text="t('rph_janaAll')"></button>
          <button @click="pdfCompact=!pdfCompact;sv()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100" x-text="pdfCompact?t('pdfNormal'):t('pdfCompact')"></button>
          <button @click="tplSave()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs font-medium text-[#8B5A2B] hover:bg-[#FFF8F0]" x-text="t('tplSave')"></button>
          <label class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs font-medium text-[#8B5A2B] hover:bg-[#FFF8F0]" x-show="rph.length"><span x-text="t('tplLoad')"></span><input type="file" accept=".json,application/json" class="hidden" @change="tplLoad($event)"></label>
          <select x-model="histSel" @change="loadHist()" class="rounded-lg border border-[#C4956A]/20 bg-white px-2 py-1.5 text-xs font-medium text-[#3A2A1A]"><option value="" x-text="t('tplHist')+' — '+t('tplNone')"></option><template x-for="(h,i) in hist" :key="i"><option :value="i" x-text="(new Date(h.ts)).toLocaleString()+' · '+h.tag+' · '+h.rph.length+' RPH'"></option></template></select>
          <button @click="regenAll()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-blue-300 bg-blue-50 px-3 py-2 text-xs font-medium text-blue-700 hover:bg-blue-100"x-text="t('rph_refresh')"></button>
          <button @click="alignAll()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-purple-300 bg-purple-50 px-3 py-2 text-xs font-medium text-purple-700 hover:bg-purple-100"x-text="t('rph_serasi')"></button>
          <button @click="validOpen=!validOpen" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-rose-300 bg-rose-50 px-3 py-2 text-xs font-medium text-rose-700 hover:bg-rose-100"x-text="t('rph_valid')"></button>
          <button @click="fixAll()" x-show="rph.length && validIssues().length" class="inline-flex items-center gap-1 rounded-lg border border-orange-300 bg-orange-50 px-3 py-2 text-xs font-medium text-orange-700 hover:bg-orange-100"x-text="t('rph_validfix')"></button>
          <button @click="iRef()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-amber-300 bg-amber-50 px-3 py-2 text-xs font-medium text-amber-700 hover:bg-amber-100"x-text="t('rph_sisip')"></button>
          <button @click="pAll()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/20 bg-white px-3 py-2 text-xs font-medium text-[#8B5A2B] hover:bg-[#FFF8F0]"x-text="t('rph_pdfAll')"></button>
          <button @click="setAutoWk()" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs font-medium text-[#8B5A2B] hover:bg-[#FFF8F0]" x-text="t('rph_weekAuto')"></button>
          <button @click="copyPrevWeek()" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs font-medium text-[#8B5A2B] hover:bg-[#FFF8F0]" x-text="t('copyPrev')"></button>
          <button @click="doneAll(!rph.some(p=>!p.done))" x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs font-medium text-[#8B5A2B] hover:bg-[#FFF8F0]" x-text="rph.some(p=>!p.done)?t('rph_doneAll'):t('rph_unmarkAll')"></button>
          <label class="inline-flex items-center gap-1.5 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs text-[#8B5A2B]"><input type="checkbox" x-model="autoLock" @change="sv()" class="accent-[#C4956A]"><span x-text="t('rph_autoLock')"></span></label>
          <div class="flex items-center gap-1 rounded-lg border border-[#C4956A]/20 bg-white px-2 py-1"><span class="text-xs text-[#8B5A2B]/60">🔍</span><input x-model="fq" type="text" :placeholder="t('rph_search')" class="w-28 sm:w-40 bg-transparent px-1 py-0.5 text-xs text-[#3A2A1A] focus:outline-none"><select x-model="fd" class="rounded bg-transparent py-0.5 text-xs text-[#8B5A2B] focus:outline-none"><option value="all" x-text="t('rph_statusA')"></option><option value="open" x-text="t('rph_statusO')"></option><option value="done" x-text="t('rph_statusD')"></option></select></div>
          <span x-show="rph.length" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs font-medium text-[#8B5A2B]">✅ <span x-text="t('rph_complete')"></span> <b x-text="completeness().pct+'%'"></b><span class="opacity-60" x-text="'('+completeness().ready+'/'+completeness().total+')'"></span>  |  <span x-text="t('rph_aligned')"></span> <b x-text="completeness().apct+'%'" style="color:#7c3aed"></b><span class="opacity-60" x-text="'('+completeness().aligned+'/'+completeness().total+')'"></span></span>
          <span class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-2 py-1.5 text-xs font-medium text-[#8B5A2B]"><span x-text="t('rph_range')"></span><input type="number" min="1" max="48" x-model="rangeA" :placeholder="t('rph_from')" class="w-14 rounded border border-[#C4956A]/20 bg-[#FFF8F0] px-1 py-0.5 text-xs"><span class="opacity-60">–</span><input type="number" min="1" max="48" x-model="rangeB" :placeholder="t('rph_to')" class="w-14 rounded border border-[#C4956A]/20 bg-[#FFF8F0] px-1 py-0.5 text-xs"><button @click="genRange()" :disabled="!tg||!rangeA||!rangeB" class="rounded px-2 py-0.5 text-xs font-semibold text-white disabled:opacity-50" style="background:linear-gradient(135deg,#C4956A,#8B5A2B)">⚡</button></span>
          <button @click="allDocx()" x-show="rph.length" :disabled="!!wordBusy" class="inline-flex items-center gap-1 rounded-lg border border-blue-300 bg-blue-50 px-3 py-2 text-xs font-medium text-blue-700 hover:bg-blue-100 disabled:opacity-60" x-text="wordBusy||t('wordAll')"></button>
          <span class="inline-block rounded-lg border border-red-300 bg-red-50 px-2 py-1"><button @click="rph=[];sv()" x-show="rph.length" class="text-xs font-medium text-red-600 hover:text-red-800"x-text="t('rph_padam')"></button></span>
        </div>
        <div x-show="rph.length" class="mb-3 flex flex-wrap items-center gap-2 rounded-lg border border-[#C4956A]/20 bg-white p-2">
          <label class="inline-flex items-center gap-1 text-xs font-medium text-[#8B5A2B]"><input type="checkbox" class="accent-[#C4956A]" :checked="selCount()>0 && selCount()===filteredRph().length" @change="selAll($event.target.checked)"><span x-text="t('bulk_selAll')"></span></label>
          <span x-show="selCount()" class="text-xs font-semibold text-[#8B5A2B]" x-text="ttl('bulk_selN',{n:selCount()})"></span>
          <button @click="selAll(false)" x-show="selCount()" class="rounded border border-[#C4956A]/20 bg-[#FFF8F0] px-2 py-1 text-xs text-[#8B5A2B]" x-text="t('bulk_selNone')"></button>
          <button @click="bulkDupWeek()" x-show="selCount()" class="rounded-lg border border-blue-300 bg-blue-50 px-3 py-1.5 text-xs font-medium text-blue-700 hover:bg-blue-100" x-text="t('bulk_dupWeek')"></button>
          <button @click="bulkDupCls()" x-show="selCount()" class="rounded-lg border border-indigo-300 bg-indigo-50 px-3 py-1.5 text-xs font-medium text-indigo-700 hover:bg-indigo-100" x-text="t('bulk_dupCls')"></button>
          <button @click="bulkEdit()" x-show="selCount()" class="rounded-lg border border-emerald-300 bg-emerald-50 px-3 py-1.5 text-xs font-medium text-emerald-700 hover:bg-emerald-100" x-text="t('bulk_edit')"></button>
          <button @click="bulkDel()" x-show="selCount()" class="rounded-lg border border-red-300 bg-red-50 px-3 py-1.5 text-xs font-medium text-red-600 hover:bg-red-100" x-text="t('bulk_del')"></button>
        </div>
        <template x-if="!rph.length"><div class="flex h-48 items-center justify-center text-[#8B5A2B]/60 text-sm"x-text="t('rph_empty')"></div></template>
        <template x-if="rph.length"><div class="space-y-4"><template x-for="(p,i) in filteredRph()" :key="p.id">
<div @input.debounce.400ms="markDirty(p)" @change.debounce.400ms="markDirty(p)">
  <div x-show="i===0||filteredRph()[i-1].d!==p.d" class="day-divider border-l-4" 
    :style="'border-left-color:'+({Isnin:'#60a5fa',Selasa:'#fb923c',Rabu:'#4ade80',Khamis:'#a78bfa',Jumaat:'#fb7185'})[p.d]+';background:'+({Isnin:'#eff6ff',Selasa:'#fff7ed',Rabu:'#f0fdf4',Khamis:'#faf5ff',Jumaat:'#fff1f2'})[p.d]">
    <span style="font-size:1.3rem" x-text="({Isnin:'🌙',Selasa:'🔥',Rabu:'💡',Khamis:'⭐',Jumaat:'🌙'})[p.d]||'📅'"></span>
    <span style="font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em" x-text="p.d"></span>
    <span style="margin-left:auto;font-size:.85rem;font-weight:501;opacity:.7" x-text="('Minggu '+p._wk)"></span>
  </div>

          <div class="flex items-end gap-1 mb-2">
            <span class="text-[9px] text-[#8B5A2B]/60 w-6 text-right" x-text="t('cov_rpt')"></span>

            <span><span class="inline-block h-2 w-2 rounded-full bg-amber-400"></span> <span x-text="t('prog_mid')"></span></span>
            <span><span class="inline-block h-2 w-2 rounded-full bg-emerald-400"></span> <span x-text="t('prog_high')"></span></span>
          </div>

              <tbody><template x-for="(r,i) in progRows()" :key="r.n">

                <button @click="examRegen()" class="shrink-0 rounded-lg border border-[#C4956A]/30 bg-[#FFF8F0] px-2.5 py-1.5 text-xs font-bold text-[#8B5A2B] hover:bg-[#C4956A]/10" title="Varian Baharu">🎲</button>
              </div>
            </label>
          </div>

          <div class="flex flex-wrap items-center gap-3 border-t border-[#C4956A]/10 pt-2.5 text-xs text-[#3A2A1A]">
            <label class="inline-flex items-center gap-1.5"><input type="checkbox" x-model="ex.pictures" @change="examGen()" class="accent-[#C4956A]"><span x-text="t('exam_pics')"></span></label>
            <label class="inline-flex items-center gap-1.5"><input type="checkbox" x-model="ex.answer_sheet" @change="examGen()" class="accent-[#C4956A]"><span x-text="t('exam_sheet')"></span></label>
            <label class="inline-flex items-center gap-1.5"><input type="checkbox" x-model="ex.answer_key" @change="examGen()" class="accent-[#C4956A]"><span x-text="t('exam_key')"></span></label>
            <label class="inline-flex items-center gap-1.5"><input type="checkbox" x-model="ex.ab_set" @change="examGen()" class="accent-[#C4956A]"><span x-text="t('exam_ab')"></span></label>
            <button @click="examSyncFromRph()" class="ml-auto inline-flex items-center gap-1 rounded-lg border border-purple-300 bg-purple-50 px-3 py-1.5 text-xs font-semibold text-purple-700 hover:bg-purple-100" x-text="t('exam_syncRph')"></button>
          </div>

          <!-- Action Bar -->
          <div class="flex flex-wrap items-center gap-2 border-t border-[#C4956A]/10 pt-3">

            <button @click="examDlDocx('paper_b_b64','_SetB')" x-show="ex.res && ex.res.docx && ex.res.docx.paper_b_b64" class="inline-flex items-center gap-1 rounded-lg border border-sky-300 bg-sky-50 px-3 py-2 text-xs font-semibold text-sky-700 hover:bg-sky-100">⬇️ DOCX Set B</button>
            <button @click="examDlDocx('teacher_b64','_TEACHER_JSU')" x-show="ex.res && ex.res.docx && ex.res.docx.teacher_b64" class="inline-flex items-center gap-1 rounded-lg border border-emerald-300 bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-700 hover:bg-emerald-100" x-text="t('exam_dlTeacher')"></button>
            <button @click="examDlDocx('marksheet_b64','_BORANG_MARKAH')" x-show="ex.res && ex.res.docx && ex.res.docx.marksheet_b64" class="inline-flex items-center gap-1 rounded-lg border border-indigo-300 bg-indigo-50 px-3 py-2 text-xs font-semibold text-indigo-700 hover:bg-indigo-100" x-text="t('exam_dlMarksheet')"></button>
            <button @click="examPrint()" x-show="ex.res" class="inline-flex items-center gap-1 rounded-lg border border-[#C4956A]/30 bg-white px-3 py-2 text-xs font-semibold text-[#8B5A2B] hover:bg-[#FFF8F0]" x-text="t('exam_printBtn')"></button>
          </div>
        </div>

        <!-- Sub-view Switcher -->
        <div class="flex flex-wrap gap-2">
          <button @click="ex.view='paper'" class="rounded-lg px-3.5 py-2 text-xs font-semibold transition-colors" :class="ex.view==='paper'?'bg-[#1E3A5F] text-white shadow':'bg-white text-[#8B5A2B] border border-[#C4956A]/20'" x-text="t('exam_tabPaper')"></button>
          <button @click="ex.view='key'" class="rounded-lg px-3.5 py-2 text-xs font-semibold transition-colors" :class="ex.view==='key'?'bg-[#1E3A5F] text-white shadow':'bg-white text-[#8B5A2B] border border-[#C4956A]/20'" x-text="t('exam_tabKey')"></button>
          <button @click="ex.view='sheet'" class="rounded-lg px-3.5 py-2 text-xs font-semibold transition-colors" :class="ex.view==='sheet'?'bg-[#1E3A5F] text-white shadow':'bg-white text-[#8B5A2B] border border-[#C4956A]/20'" x-text="t('exam_tabSheet')"></button>
          <button @click="ex.view='marks'" class="rounded-lg px-3.5 py-2 text-xs font-semibold transition-colors" :class="ex.view==='marks'?'bg-[#1E3A5F] text-white shadow':'bg-white text-[#8B5A2B] border border-[#C4956A]/20'" x-text="t('exam_tabMarks')"></button>
        </div>

        <!-- Paper Preview -->
        <div x-show="ex.view==='paper'" class="rounded-xl border border-[#C4956A]/20 bg-white p-2 shadow-sm">

        </div>

        <!-- Answer Key + JSU Preview -->
        <div x-show="ex.view==='key'" class="rounded-xl border border-[#C4956A]/20 bg-white p-4 shadow-sm space-y-4">
          <template x-if="ex.res && ex.res.html">
            <div>
              <div class="prose max-w-none text-xs" x-html="ex.res.html.answer_key"></div>
              <div class="mt-6 border-t border-[#C4956A]/20 pt-4 text-xs overflow-x-auto" x-html="ex.res.html.jsu"></div>
            </div>
          </template>
        </div>

        <!-- OMR + Writing Answer Sheet Preview -->
        <div x-show="ex.view==='sheet'" class="rounded-xl border border-[#C4956A]/20 bg-white p-4 shadow-sm">

          </template>
        </div>

        <!-- Interactive Borang Markah -> Rekod Transit & PBD Sync -->
        <div x-show="ex.view==='marks'" class="rounded-xl border border-[#C4956A]/20 bg-white p-4 shadow-sm space-y-3">

              <h3 class="text-sm font-bold text-[#3A2A1A]" x-text="t('exam_marksTitle')+' — Tahun '+ex.year"></h3>

            </div>
            <button @click="examApplyMarksToTp()" class="inline-flex items-center gap-1 rounded-lg px-4 py-2 text-xs font-semibold text-white shadow-md" style="background:linear-gradient(135deg,#059669,#047857)" x-text="t('exam_applyTpBtn')"></button>
          </div>
          <div class="overflow-x-auto rounded-lg border border-[#C4956A]/20">
            <table class="w-full text-xs">
              <thead>
                <tr class="border-b bg-[#FFF8F0] text-[#8B5A2B]">
                  <th class="px-2 py-2 text-left w-8">#</th>

                  <th class="px-2 py-2 text-center w-28">Bahagian B (Penulisan /25)</th>
                  <th class="px-2 py-2 text-center w-24">Jumlah (/50)</th>

                  <th class="px-2 py-2 text-center w-28">Cadangan TP</th>
                </tr>
              </thead>

                <template x-for="(stu, idx) in examClassPupils()" :key="stu">

                    <td class="px-2 py-1.5 font-medium text-slate-700" x-text="stu"></td>
                    <td class="px-2 py-1.5 text-center">
                      <input type="number" min="0" max="25" :value="examScoreGet(stu,'obj')" @input="examScoreSet(stu,'obj',$event.target.value)" class="w-16 rounded border border-[#C4956A]/30 bg-[#FFF8F0] px-1.5 py-1 text-center text-xs font-semibold">
                    </td>
                    <td class="px-2 py-1.5 text-center">
                      <input type="number" min="0" max="25" :value="examScoreGet(stu,'wrt')" @input="examScoreSet(stu,'wrt',$event.target.value)" class="w-16 rounded border border-[#C4956A]/30 bg-[#FFF8F0] px-1.5 py-1 text-center text-xs font-semibold">
                    </td>
                    <td class="px-2 py-1.5 text-center font-bold text-[#1E3A5F]" x-text="examScoreTotal(stu)+' / 50'"></td>
                    <td class="px-2 py-1.5 text-center font-semibold text-[#8B5A2B]" x-text="(examScoreTotal(stu)*2)+'%'"></td>
                    <td class="px-2 py-1.5 text-center">
                      <span class="rounded-full px-2.5 py-0.5 text-[10px] font-bold" :class="examScoreTp(stu)>=5?'bg-emerald-100 text-emerald-700':examScoreTp(stu)>=3?'bg-amber-100 text-amber-700':'bg-rose-100 text-rose-700'" x-text="'TP '+examScoreTp(stu)"></span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <div class="mb-3"><h2 class="text-base font-bold text-[#3A2A1A]" x-text="t('data_title')"></h2><p class="text-xs text-[#8B5A2B]/60" x-text="t('data_sub')"></p></div>

          <button @click="dataMode='rpt'" class="rounded-lg px-3 py-1.5 text-xs font-semibold" :class="dataMode==='rpt'?'bg-[#C4956A]/20 text-[#8B5A2B]':'bg-white text-[#8B5A2B]/60'" x-text="t('data_rpt')"></button>
          <button @click="dataMode='dskp'" class="rounded-lg px-3 py-1.5 text-xs font-semibold" :class="dataMode==='dskp'?'bg-[#C4956A]/20 text-[#8B5A2B]':'bg-white text-[#8B5A2B]/60'" x-text="t('data_dskp')"></button>

          <label class="text-xs font-semibold text-[#3A2A1A]" x-text="t('pbd_subject')"></label>

          <button @click="dataSaveRpt()" x-show="dataMode==='rpt'" class="inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-semibold text-white" style="background:linear-gradient(135deg,#C4956A,#8B5A2B)" x-text="t('data_save')"></button>
          <button @click="dataSaveCur()" x-show="dataMode==='dskp'" class="inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-semibold text-white" style="background:linear-gradient(135deg,#C4956A,#8B5A2B)" x-text="t('data_save')"></button>
          <span x-show="dataMsg" class="text-[11px] font-medium text-green-700" x-text="dataMsg"></span>
        </div>

          <template x-if="rptRow()">

                <label class="text-xs"><span class="font-semibold text-[#8B5A2B]" x-text="t('data_topic')"></span><input x-model="rptRow().topic" class="mt-0.5 w-full rounded-lg border border-[#C4956A]/20 bg-[#FFF8F0] px-2 py-1.5 text-xs"></label>

                <div><div class="flex items-center justify-between"><span class="text-xs font-semibold text-emerald-600" x-text="t('sp')"></span><button @click="rptRow().sp.push(['',''])" class="text-[11px] text-[#C4956A]" x-text="t('tambah')"></button></div>
                  <template x-for="(row,i) in rptRow().sp" :key="'sp'+i"><div class="mt-1 flex gap-1"><input x-model="row[0]" :placeholder="t('data_code')" class="w-20 rounded border border-[#C4956A]/20 bg-[#FFF8F0] px-1.5 py-1 text-xs font-mono"><input x-model="row[1]" :placeholder="t('data_desc')" class="flex-1 rounded border border-[#C4956A]/20 bg-[#FFF8F0] px-1.5 py-1 text-xs"><button @click="rptRow().sp.splice(i,1)" class="text-red-400">✕</button></div></template></div>

          <button @click="imp.m='stu'" class="rounded-lg px-3 py-1.5 text-xs font-semibold" :class="imp.m==='stu'?'bg-[#C4956A]/20 text-[#8B5A2B]':'bg-white text-[#8B5A2B]/60'" x-text="t('imp_stu')"></button>

              <label class="inline-flex cursor-pointer items-center gap-1 rounded-lg border border-[#C4956A]/20 bg-white px-3 py-1.5 text-xs font-medium text-[#8B5A2B] hover:bg-[#FFF8F0]"><span>📄 </span><span x-text="t('imp_choose')"></span><input type="file" accept=".pdf,.csv,.txt,.xlsx,.xls,text/csv,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" @change="impFile($event)"></label>

  {t:'📊 Analisis Kesilapan', d:'Kumpul kerja murid dan kenal pasti corak kesilapan yang sama. Tunjuk contoh kesilapan di papan dan bincang mengapa salah. Bimbing murid membetulkan dan beri soalan hampir sama untuk mengukuhkan.'},
  {t:'🗣️ Bacaan Berulang Berpandu', d:'Pilih petikan pendek 3-4 baris. Guru membaca dahulu, murid ikut, kemudian murid membaca sendiri. Ulang 2-3 kali pada hari yang sama dan sekali lagi keesokan hari untuk membina kefasihan.'},
  {t:'✍️ Ejaan Bergambar', d:'Tunjukkan gambar bersama perkataan. Murid menyalin perkataan sambil menyebut huruf. Tutup perkataan dan minta murid menulis semula berdasarkan gambar. Semak serta-merta dan ulang bagi perkataan yang salah.'},
  {t:'🧩 Susun Perkataan Jadi Ayat', d:'Beri kad perkataan berselerak. Murid menyusun menjadi ayat yang gramatis. Bimbing murid menyemak tanda baca dan huruf besar. Baca ayat dengan kuat selepas disusun.'},
  {t:'🎲 Permainan Kad Nombor', d:'Gunakan kad nombor untuk permainan padanan, susun tertib atau "lebih besar/lebih kecil". Main secara berpasangan supaya murid saling menyemak. Gantikan kad baharu apabila murid menguasai.'},
  {t:'🔢 Garis Nombor Lantai', d:'Lekatkan pita nombor 0-10 di lantai. Murid melompat ke hadapan untuk tambah dan ke belakang untuk tolak. Setiap lompatan disebut dengan kuat untuk mengaitkan gerakan dengan operasi.'},
  {t:'🪙 Wang Mainan', d:'Sediakan wang mainan dan barang mainan berharga mudah. Murid memainkan peranan penjual dan pembeli. Bimbing mengira jumlah dan baki wang secara langkah demi langkah.'},
  {t:'⏰ Jam Mainan', d:'Gunakan jam mainan untuk membaca dan menetapkan waktu. Murid memutarkan jarum mengikut arahan guru. Kaitkan waktu dengan jadual harian di sekolah dan di rumah.'},
  {t:'📏 Ukur Objek Sekeliling', d:'Murid mengukur panjang meja, buku atau pensel menggunakan pembaris atau benang. Rekod hasil dalam jadual mudah. Bandingkan objek mana lebih panjang atau lebih pendek.'},
  {t:'🌱 Jurnal Pemerhatian', d:'Murid merekod perubahan tumbuhan, cuaca atau haiwan dalam jurnal bergambar. Bimbing murid menulis satu ayat pemerhatian setiap hari. Bincangkan corak yang dilihat pada hujung minggu.'},
  {t:'🗺️ Peta Bercerita', d:'Beri peta mudah atau gambar bersiri. Murid menceritakan laluan atau jalan cerita menggunakan perkataan arah dan penanda urutan. Bimbing dengan soalan pemandu.'},
  {t:'🎭 Main Peranan Situasi Harian', d:'Pilih situasi seperti membeli di kedai atau menanyakan arah. Beri skrip ringkas kepada murid. Lakonkan di hadapan kelas kemudian bincangkan ayat yang digunakan.'},
  {t:'🎵 Nyanyian Berirama', d:'Ciptakan lirik mudah mengikut lagu kanak-kanak untuk fakta penting. Murid menyanyi sambil bertepuk tangan. Ulang setiap hari agar hafalan kekal.'},
  {t:'🖐️ Aktiviti Kinestetik', d:'Gunakan pergerakan seperti tepuk, lompat dan hormat untuk mewakili konsep (contoh suku kata, nombor). Murid melakukan gerakan semasa menyebut jawapan. Sesuai untuk murid yang sukar duduk diam.'},
  {t:'🧠 Kad Imbas Pantas', d:'Tunjukkan kad imbas selama 2 saat dan minta murid menyebut dengan pantas. Kumpulkan kad yang murid belum kuasai dan ulang kad tersebut lebih kerap. Jadikan sebagai permainan untuk kurangkan tekanan.'},
  {t:'📖 Buku Besar Berulang', d:'Baca buku besar bersama murid dengan penunjuk. Fokus kepada ayat berulang yang sama. Minta murid membaca ayat berulang itu sendiri untuk membina keyakinan.'},
  {t:'🅰️ Papan Putih Berpasangan', d:'Murid berpasangan menulis jawapan pada papan putih mini serentak. Rakan menyemak dan membetulkan. Guru memberi satu soalan selepas satu pengukuhan.'},
  {t:'🏆 Tiket Kemajuan Harian', d:'Mulakan dengan satu set cabaran mudah yang murid boleh selesaikan. Beri satu bintang pada carta kemajuan setiap kali berjaya. Naikkan kesukaran sedikit apabila carta penuh untuk mengekalkan motivasi.'}

REM_EN.push(
  {t:'🧱 Concrete–Pictorial–Abstract', d:'Start with real objects (blocks, seeds, counters) to build understanding. Once the pupil can succeed, move to pictures and drawings. Finally use symbols and numbers. Do not jump to abstract work before the pupil is confident at the concrete stage.'},
  {t:'🎯 Scaffolded Drills', d:'Prepare five questions that move from very easy to moderate. The pupil solves them one at a time with guidance on the first. Praise every success and add one challenging question at the end.'},
  {t:'📊 Error Analysis', d:'Collect pupils\' work and identify repeated error patterns. Show an example of the error on the board and discuss why it is wrong. Guide pupils to correct it and give a similar question to reinforce.'},
  {t:'🗣️ Repeated Guided Reading', d:'Choose a short three- or four-line passage. The teacher reads first, the pupil echoes, then the pupil reads alone. Repeat two or three times the same day and once again the next day to build fluency.'},
  {t:'✍️ Picture Spelling', d:'Show a picture with the matching word. The pupil copies the word while sounding the letters. Cover the word and ask the pupil to rewrite it from the picture. Check immediately and repeat missed words.'},
  {t:'🧩 Build a Sentence', d:'Give scrambled word cards. The pupil arranges them into a complete, grammatical sentence. Guide checking of punctuation and capital letters. Read the sentence aloud once completed.'},
  {t:'🎲 Number Card Games', d:'Use number cards for matching, ordering or "greater/less than" games. Play in pairs so pupils check each other. Replace with new cards once the pupil has mastered them.'},
  {t:'🔢 Floor Number Line', d:'Stick a masking-tape number line 0-10 on the floor. Pupils jump forward to add and backward to subtract. Say each jump aloud to link movement to the operation.'},
  {t:'🪙 Toy Money Shop', d:'Provide toy money and simple priced items. Pupils role-play shopkeeper and customer. Guide counting the total and change step by step.'},
  {t:'⏰ Toy Clock Practice', d:'Use a toy clock to read and set times. Pupils turn the hands following the teacher\'s instructions. Link times to the daily school and home routine.'},
  {t:'📏 Measure Around You', d:'Pupils measure the length of desks, books or pencils using a ruler or string. Record results in a simple table. Compare which objects are longer or shorter.'},
  {t:'🌱 Observation Journal', d:'Pupils record changes in plants, weather or animals in a picture journal. Guide them to write one observation sentence each day. Discuss the patterns seen at the end of the week.'},
  {t:'🗺️ Story Map', d:'Give a simple map or picture sequence. Pupils narrate the route or story using direction words and sequence markers. Support with guiding questions.'},
  {t:'🎭 Everyday Role Play', d:'Choose a situation such as buying at a shop or asking for directions. Give pupils a short script. Act it out in front of the class, then discuss the sentences used.'},
  {t:'🎵 Rhythmic Singing', d:'Create simple lyrics to a nursery tune for key facts. Pupils sing along with clapping. Repeat daily so the memory sticks.'},
  {t:'🖐️ Kinaesthetic Activities', d:'Use movement such as clapping, jumping and saluting to represent concepts (for example syllables or numbers). Pupils move as they say the answer. Ideal for pupils who find it hard to sit still.'},
  {t:'🧠 Fast Flashcards', d:'Flash a card for two seconds and ask the pupil to say it quickly. Keep the cards the pupil has not mastered and repeat those more often. Play it as a game to reduce pressure.'},
  {t:'📖 Repeated Big Book', d:'Read a big book with pupils using a pointer. Focus on the repeated sentence. Ask the pupil to read that repeated sentence alone to build confidence.'},
  {t:'🅰️ Paired Mini Whiteboards', d:'Pupils in pairs write answers on mini whiteboards at the same time. Partners check and correct. The teacher gives one reinforcement question after each.'},
  {t:'🏆 Daily Progress Ticket', d:'Begin with a short set of easy challenges the pupil can complete. Give a star on a progress chart for each success. Raise the difficulty slightly when the chart is full to keep motivation high.'}
);

  {t:'🌱 观察日志', d:'学生在图画日志中记录植物、天气或动物的变化。引导每天写一句观察句子。周末讨论所看到的规律。'},
  {t:'🗺️ 故事地图', d:'给出简易地图或连环图。学生用方向词和顺序词讲述路线或故事。用引导性问题辅助。'},

  {t:'🎵 节奏吟唱', d:'用童谣曲调创作简单歌词来记重点。学生边拍手边唱。每天重复以巩固记忆。'},
  {t:'🖐️ 动觉活动', d:'用拍手、跳跃、敬礼等动作代表概念（如音节、数字）。学生边说答案边做动作。适合难以静坐的学生。'},
  {t:'🧠 快速字卡', d:'展示字卡两秒，请学生快速说出。保留学生未掌握的字卡并更频繁复习。以游戏方式进行以减轻压力。'},
  {t:'📖 重复大书阅读', d:'用指读棒与学生共读大书。聚焦反复出现的句子。请学生单独朗读该句以建立信心。'},
  {t:'🅰️ 配对小白板', d:'学生两人一组同时在小黑板上写答案。同伴检查并订正。每次巩固后教师再给一道题。'},
  {t:'🏆 每日进度票', d:'先给一组学生能完成的简单挑战。每成功一次在进度表上给一颗星。表满后稍微提高难度，以保持动力。'}

const REF = {"bm": ["Seramai 12 orang murid dapat menguasai objektif pembelajaran pada hari ini. Tiga orang murid masih memerlukan bimbingan tambahan terutamanya dalam kemahiran membaca dan menulis. Aktiviti set induksi menggunakan video dan soal jawab berjaya menarik minat murid. Langkah pengajaran perlu dipercepatkan pada sesi akan datang bagi memastikan semua murid dapat mengikuti PdP dengan lancar. BBM yang pelbagai perlu digunakan untuk mengekalkan fokus murid.", "Objektif PdP tercapai dengan jayanya. Murid dapat menyelesaikan tugasan yang diberikan dengan baik terutamanya dalam aktiviti berkumpulan. Mereka menunjukkan semangat kerjasama yang tinggi semasa menyiapkan projek. Masa pengajaran perlu diurus dengan lebih efisien kerana aktiviti berkumpulan mengambil masa yang agak lama. Aktiviti hands-on sangat membantu murid memahami konsep abstrak dengan lebih jelas.", "15 daripada 18 orang murid mencapai objektif pembelajaran yang ditetapkan. Tiga orang murid perlu menjalani aktiviti pemulihan secara individu pada sesi akan datang. Aktiviti pembelajaran yang menggunakan pendekatan belajar sambil bermain sangat berkesan dan berjaya menarik minat murid. Mereka lebih mudah mengingati konsep yang dipelajari melalui aktiviti yang menyeronokkan dan interaktif.", "Penguasaan murid pada hari ini adalah memuaskan. PdP berjalan seperti yang dirancang tanpa sebarang gangguan. Murid memberi kerjasama yang baik sepanjang sesi PdP dan aktif melibatkan diri dalam perbincangan. Bahan bantu mengajar yang disediakan membantu meningkatkan kefahaman murid terhadap topik yang diajar. Latihan pengukuhan akan diberikan untuk memantapkan lagi kefahaman murid.", "Majoriti murid dapat menguasai standard pembelajaran yang ditetapkan. Beberapa orang murid masih perlukan latihan tambahan terutamanya dalam kemahiran menulis ayat gramatis. Aktiviti kumpulan yang dijalankan berjaya meningkatkan kemahiran kolaboratif dan komunikasi sesama murid. Mereka saling membantu dan berkongsi idea dalam menyelesaikan tugasan yang diberikan.", "Objektif PdP tercapai sepenuhnya. Murid aktif dalam perbincangan dan memberikan idea yang bernas semasa aktiviti gallery walk. Pentaksiran formatif yang dijalankan secara berterusan menunjukkan perkembangan positif dari segi kefahaman murid. Pendekatan pembelajaran abad ke-21 yang diaplikasikan berjaya meningkatkan penglibatan murid secara aktif dalam sesi PdP.", "PdP berjalan lancar dan mencapai objektif yang ditetapkan. Murid dapat mengaitkan pembelajaran dengan kehidupan harian mereka terutamanya semasa sesi sumbangsaran. Aktiviti gallery walk yang dijalankan didapati sangat efektif untuk meningkatkan penglibatan murid dan memberi peluang kepada mereka untuk belajar daripada rakan sebaya. Murid juga dapat memberi maklum balas yang membina.", "Semua murid mencapai objektif minimum yang ditetapkan pada hari ini. Pembelajaran abad ke-21 telah diaplikasikan dalam aktiviti seperti Think-Pair-Share dan Gallery Walk. Refleksi murid pada akhir sesi menunjukkan kefahaman yang baik terhadap topik yang dipelajari. Murid juga dapat menghubungkaitkan pengetahuan baru dengan pengalaman sedia ada mereka.", "Objektif PdP tercapai dengan cemerlang. Murid berjaya menyelesaikan tugasan berkumpulan dengan baik dan menunjukkan kreativiti yang tinggi. Kemahiran berfikir aras tinggi (KBAT) telah diterapkan dalam aktiviti penyelesaian masalah dan murid dapat mengaplikasikannya dengan baik. Mereka berjaya menjana idea-idea kreatif dan inovatif sepanjang sesi PdP.", "Penguasaan murid sangat memuaskan. PdP berjalan mengikut perancangan dan masa diperuntukkan dengan baik untuk setiap aktiviti. Murid bersedia untuk sesi pembelajaran akan datang dan menunjukkan minat yang tinggi untuk meneruskan pembelajaran. Penggunaan pelbagai teknik pengajaran seperti simulasi dan main peranan berjaya mengekalkan minat murid sepanjang sesi.", "Objektif tercapai dengan baik. Murid dapat mengaplikasikan pengetahuan yang dipelajari dalam situasi baru terutamanya semasa aktiviti penyelesaian masalah. Latihan pengukuhan telah diberikan sebagai kerja rumah untuk mengukuhkan lagi kefahaman murid. Guru akan menyemak latihan tersebut pada sesi akan datang dan memberi maklum balas yang konstruktif.", "Seramai 10 orang murid mencapai tahap penguasaan 4 dan ke atas. Lima orang murid masih pada tahap 3 dan memerlukan latihan tambahan. Aktiviti pemulihan akan dijalankan pada sesi akan datang secara berfokus mengikut keperluan individu murid. Guru akan menyediakan lembaran kerja khas dan bimbingan rapat untuk murid-murid ini.", "PdP berjalan dengan lancar dan menyeronokkan. Murid seronok dengan aktiviti yang disediakan terutamanya aktiviti permainan bahasa yang interaktif. Bahan bantu mengajar yang pelbagai dan berwarna-warni berjaya membantu meningkatkan kefahaman murid terhadap konsep yang diajar. Murid juga lebih bersemangat untuk belajar dalam suasana yang ceria.", "Objektif PdP tercapai dengan jayanya. Murid dapat bekerjasama dalam kumpulan dan menyelesaikan tugasan yang diberikan tepat pada masanya. Pentaksiran rakan sebaya yang dijalankan berjalan dengan baik dan murid dapat memberi maklum balas yang membina kepada rakan mereka. Aktiviti ini juga membantu meningkatkan kemahiran sosial murid.", "Murid menunjukkan minat yang sangat tinggi terhadap topik yang diajar pada hari ini. Mereka aktif bertanya dan memberi pendapat semasa sesi perbincangan. PdP akan datang perlu diteruskan dengan aktiviti yang lebih mencabar bagi memenuhi keperluan murid yang cemerlang manakala aktiviti pemulihan perlu disediakan untuk murid yang masih lemah.", "PdP hari ini berjalan lancar dengan 80% murid mencapai objektif yang ditetapkan. Bimbingan tambahan telah diberikan kepada murid yang lemah secara individu semasa aktiviti pemulihan. Aktiviti pengayaan pula diberikan kepada murid cemerlang untuk mencabar pemikiran mereka. Pendekatan differentiated learning ini berjaya memenuhi keperluan pembelajaran murid yang pelbagai.", "Aktiviti pembelajaran yang pelbaga kumpulan masing-masing.", "PdP berjalan seperti yang dirancang tanpa sebarang masalah. Murid memahami konsep yang diajar dengan baik terutamanya selepas aktiviti hands-on dijalankan. Latihan pengukuhan yang diberikan pada akhir sesi dapat diselesaikan dengan baik oleh majoriti murid. Refleksi murid pada akhir sesi menunjukkan mereka seronok dengan pembelajaran hari ini.", "Majoriti murid mencapai objektif yang ditetapkan. Walau bagaimanapun, beberapa orang murid masih lemah dalam kemahiran membaca dan menulis. Intervensi khas akan dijalankan untuk murid-murid ini pada sesi akan datang. Guru akan menyediakan bahan bacaan bergambar dan latihan menulis yang lebih mudah untuk membantu mereka menguasai kemahiran asas.", "PdP berjalan lancar dan mencapai objektif yang disasarkan. Murid dapat mengenal pasti dan memahami konsep utama yang diajar dengan baik. Aktiviti hands-on yang dijalankan sangat membantu murid yang lemah untuk memahami topik yang diajar. Mereka dapat belajar secara konkrit melalui pengalaman langsung dan bahan maujud.", "Objektif PdP tercapai dengan baik. Murid menunjukkan sikap yang sangat positif terhadap pembelajaran pada hari ini. Mereka bekerjasama dalam kumpulan dan saling membantu antara satu sama lain. Semangat toleransi dan hormat-menghormati dapat dipupuk melalui aktiviti berkumpulan yang dijalankan. Murid juga mendengar pendapat rakan dengan baik.", "Murid dapat menguasai standard pembelajaran yang ditetapkan dengan jayanya. PdP berjalan lancar mengikut perancangan. Aktiviti pengayaan dan pemulihan telah dijalankan mengikut keperluan murid. Murid cemerlang diberi tugasan tambahan yang lebih mencabar manakala murid pemulihan diberi bimbingan rapat secara individu.", "PdP hari ini sangat menyeronokkan. Murid belajar sambil bermain melalui aktiviti yang menarik dan interaktif. Mereka dapat mengingati konsep yang diajar dengan lebih mudah melalui pendekatan belajar sambil bermain. Suasana pembelajaran yang ceria dan santai membantu murid berasa lebih selesa untuk belajar dan bertanya.", "Objektif PdP tercapai dengan jayanya. Murid menunjukkan peningkatan yang memberangsangkan dari segi kefahaman terhadap topik yang diajar. Bimbingan berterusan diperlukan untuk murid pemulihan bagi memastikan mereka tidak tercicir dalam pembelajaran. Guru akan memberi perhatian lebih kepada murid-murid ini pada sesi akan datang.", "Keseluruhan PdP berjalan dengan jayanya dan mencapai objektif yang ditetapkan. Murid mencapai objektif pembelajaran yang disasarkan. Aktiviti yang pelbagai seperti perbincangan kumpulan, gallery walk dan pembentangan berjaya membantu memenuhi keperluan pembelajaran murid yang berbeza gaya pembelajaran.", "PdP hari ini berjaya menarik minat murid melalui aktiviti yang interaktif dan menyeronokkan. Murid dapat berkolaborasi dengan baik dalam kumpulan masing-masing dan saling membantu. Pendekatan pembelajaran secara berkumpulan ini bukan sahaja meningkatkan kefahaman malah memupuk semangat kerjasama dan toleransi dalam kalangan murid.", "Objektif pembelajaran tercapai dengan cemerlang. Penggunaan teknologi dalam PdP seperti video, animasi dan kuiz interaktif berjaya meningkatkan penglibatan dan minat murid. Murid seronok belajar dengan cara yang menyeronokkan dan lebih mudah memahami konsep yang abstrak melalui visualisasi yang menarik.", "Murid dapat menguasai kemahiran yang diajar dengan bimbingan guru yang rapat. Latihan pengukuhan akan diberikan untuk memantapkan lagi kefahaman mereka terutamanya dalam aspek yang masih lemah. Guru akan menyediakan lembaran kerja tambahan dan soalan latihan yang pelbagai untuk tujuan ini.", "PdP berjalan lancar dengan penglibatan aktif daripada murid. Mereka aktif bertanya dan memberi respons semasa sesi soal jawab. Pendekatan belajar sambil bermain yang digunakan sangat sesuai untuk topik yang diajar pada hari ini. Murid dapat memahami konsep dengan lebih mudah melalui aktiviti yang menyeronokkan.", "Objektif PdP tercapai sepenuhnya pada hari ini. Pembentangan hasil kerja murid menunjukkan usaha dan kreativiti yang tinggi. Mereka berjaya menghasilkan kerja yang berkualiti dan menarik. Pentaksiran formatif yang dijalankan secara berterusan sepanjang sesi PdP membantu guru mengenal pasti kekuatan dan kelemahan murid.", "Seramai 16 orang murid mencapai objektif pembelajaran yang ditetapkan. Dua orang murid memerlukan perhatian khusus dan akan diberikan aktiviti pemulihan secara individu. Guru akan menyediakan modul pemulihan khas untuk murid-murid ini dan memantau perkembangan mereka dari semasa ke semasa.", "Murid dapat mengaplikasikan pengetahuan yang dipelajari dalam situasi baru dengan baik. Pendekatan kontekstual yang digunakan berjaya membantu murid memahami topik dengan lebih mendalam dan bermakna. Mereka dapat mengaitkan pembelajaran dengan situasi sebenar dalam kehidupan harian mereka.", "PdP hari ini berjaya meningkatkan kemahiran berfikir kritis murid. Mereka dapat menyelesaikan masalah yang diberikan dengan cara yang kreatif dan inovatif. Soalan KBAT yang dikemukakan mencabar pemikiran murid dan menggalakkan mereka untuk berfikir di luar kotak. Murid seronok dengan cabaran yang diberikan.", "Objektif PdP tercapai dengan baik. Penggunaan BBM yang kreatif dan pelbagai seperti video interaktif, gambar bergerak dan bahan maujud berjaya menarik minat murid. Mereka lebih mudah memahami konsep abstrak melalui visual yang menarik dan bahan konkrit yang boleh disentuh dan dilihat.", "Majoriti murid dapat menyelesaikan tugasan yang diberikan dengan baik dan tepat pada masanya. Walau bagaimanapun, beberapa orang murid memerlukan bimbingan tambahan dalam kemahiran menulis dan membaca. Guru akan memberi tumpuan kepada kemahiran ini pada sesi akan datang dengan menyediakan lebih banyak latihan.", "PdP berjalan lancar dengan penglibatan aktif daripada keseluruhan murid. Aktiviti berkumpulan yang dijalankan berjaya menggalakkan kerjasama, komunikasi dan interaksi sesama murid. Mereka saling membantu dan berkongsi idea dalam menyelesaikan tugasan. Suasana pembelajaran yang positif dan kondusif dapat dilihat sepanjang sesi.", "Objektif PdP tercapai dengan cemerlang. Murid dapat menguasai kemahiran bertutur dengan yakin terutamanya semasa sesi pembentangan dan main peranan. Aktiviti main peranan yang dijalankan sangat membantu murid meningkatkan keyakinan diri dan kemahiran berkomunikasi dalam bahasa yang betul.", "Murid menunjukkan sikap yang sangat positif dan minat yang tinggi terhadap pembelajaran. PdP berjalan lancar mengikut perancangan. Pentaksiran formatif yang dijalankan secara berterusan menunjukkan perkembangan positif dari segi penguasaan murid terhadap standard pembelajaran yang ditetapkan.", "PdP hari ini berjaya mencapai objektif yang ditetapkan dengan jayanya. Murid dapat bekerja secara berkumpulan dan individu dengan baik. Mereka menunjukkan disiplin yang tinggi semasa menjalankan aktiviti dan mendengar arahan guru dengan teliti. Hasil kerja yang dihasilkan juga berkualiti.", "Objektif PdP tercapai dengan memuaskan. Murid dapat mengenal pasti dan memahami konsep yang diajar dengan baik terutamanya selepas aktiviti hands-on dijalankan. Latihan pengukuhan akan diberikan untuk memantapkan lagi kefahaman murid terhadap topik yang dipelajari pada hari ini.", "Murid seronok dengan aktiviti yang disediakan pada hari ini. Mereka dapat belajar dalam suasana yang menyeronokkan dan tidak tertekan. PdP berjalan lancar dengan penglibatan aktif daripada murid. Mereka tidak segan untuk bertanya dan memberi pendapat semasa sesi perbincangan dijalankan.", "PdP berjalan lancar mengikut perancangan yang telah ditetapkan. Murid dapat menguasai kemahiran yang diajar dengan baik. Refleksi murid pada akhir sesi menunjukkan mereka memahami isi pelajaran yang disampaikan dan dapat menghubungkaitkan dengan pengetahuan sedia ada.", "Objektif PdP tercapai dengan baik. Murid dapat menjawab soalan yang dikemukakan dengan betul terutamanya soalan pemahaman dan aplikasi. Aktiviti pengayaan dan pemulihan telah dijalankan mengikut keperluan murid bagi memastikan setiap murid mendapat manfaat yang optimum daripada sesi PdP.", "Majoriti murid menunjukkan perkembangan positif dalam pembelajaran. Walau bagaimanapun, beberapa orang murid masih memerlukan bimbingan tambahan terutamanya dalam kemahiran menulis dan membaca. Sesi PdP akan datang akan memberi lebih fokus kepada aktiviti pemulihan untuk murid-murid yang masih lemah.", "PdP hari ini sangat memberangsangkan. Murid dapat menguasai objektif pembelajaran dengan cemerlang tanpa sebarang masalah. Aktiviti yang pelbagai dan interaktif yang dijalankan sepanjang sesi berjaya membantu proses pembelajaran murid dan menjadikan pengalaman pembelajaran lebih bermakna dan menyeronokkan."], "en": ["12 pupils achieved the learning objectives today. 3 pupils need additional guidance especially in reading and writing skills. The set induction activity using video and questioning successfully engaged pupils. Teaching pace needs to be adjusted next session to ensure all pupils can follow the lesson smoothly. Various teaching aids should be used to maintain pupil focus throughout the session.", "Learning objectives achieved successfully. Pupils completed the given tasks well especially in group activities. They showed high cooperative spirit while completing projects. Time management needs to be more efficient as group activities took quite long. Hands-on activities greatly helped pupils understand abstract concepts more clearly.", "15 out of 18 pupils achieved the set learning objectives. Three pupils need individual remedial activities in the next session. The learn-through-play approach was very effective and successfully attracted pupils' interest. They could remember concepts more easily through fun and interactive activities.", "Pupil mastery today was satisfactory. The lesson proceeded as planned without any disruptions. Pupils cooperated well throughout the session and actively participated in discussions. The teaching aids provided helped improve pupils' understanding of the topic taught. Reinforcement exercises will be given to further consolidate pupils' understanding.", "The majority of pupils mastered the prescribed learning standards. A few pupils still need additional practice especially in writing grammatically correct sentences. Group activities successfully improved pupils' collaborative and communication skills. They helped each other and shared ideas in completing the given tasks.", "Learning objectives fully achieved. Pupils were active in discussions and contributed brilliant ideas during the gallery walk activity. Formative assessment conducted continuously showed positive progress in pupils' understanding. The 21st century learning approach applied successfully increased pupils' active engagement in the lesson.", "The lesson went well and achieved the set objectives. Pupils could relate learning to their daily lives especially during the brainstorming session. The gallery walk activity was very effective in increasing pupil engagement and providing opportunities for peer learning. Pupils also provided constructive feedback to their friends.", "All pupils achieved the minimum set objectives today. 21st century learning was applied through activities like Think-Pair-Share and Gallery Walk. Pupil reflections at the end of the session showed good understanding of the topic learned. Pupils could also connect new knowledge with their prior experience.", "Learning objectives achieved excellently. Pupils completed group tasks well and showed high creativity. Higher order thinking skills (HOTS) were incorporated into problem-solving activities and pupils applied them well. They successfully generated creative and innovative ideas throughout the session.", "Pupil mastery was very satisfactory. The lesson followed the plan well with time allocated properly for each activity. Pupils are ready for the next learning session and showed high interest to continue learning. The use of various teaching techniques like simulation and role-play successfully maintained pupil interest.", "Objectives achieved well. Pupils could apply the knowledge learned in new situations especially during problem-solving activities. Reinforcement exercises given as homework to further strengthen pupils' understanding. Teacher will check the exercises next session and provide constructive feedback.", "10 pupils achieved mastery level 4 and above. 5 pupils are still at level 3 and need additional practice. Remedial activities will be conducted next session focusing on individual pupil needs. Teacher will prepare special worksheets and provide close guidance for these pupils.", "The lesson went smoothly and was enjoyable. Pupils enjoyed the activities provided especially the interactive language games. Various colorful teaching aids helped improve pupils' understanding of the concepts taught. Pupils were more enthusiastic to learn in a cheerful atmosphere.", "Learning objectives achieved successfully. Pupils cooperated in groups and completed the given tasks on time. Peer assessment conducted went well and pupils provided constructive feedback to their friends. This activity also helped improve pupils' social skills.", "Pupils showed very high interest in the topic taught today. They actively asked questions and gave opinions during the discussion session. The next lesson needs to continue with more challenging activities to meet the needs of excellent pupils while remedial activities need to be prepared for weak pupils.", "Today's lesson went well with 80% of pupils achieving the set objectives. Additional guidance was given to weak pupils individually during remedial activities. Enrichment activities were given to excellent pupils to challenge their thinking. This differentiated learning approach successfully met the diverse learning needs of pupils.", "Various interactive learning activities successfully helped maintain pupil interest throughout the lesson. They did not feel bored and were always actively engaged. The lesson proceeded according to plan and allocated time. Pupils cooperated well and listened to teacher instructions carefully.", "Learning objectives achieved satisfactorily. Pupils mastered the skills taught especially reading and writing skills. Group activities conducted successfully fostered cooperation and mutual assistance among pupils. Teaching time needs to be extended slightly next session to give pupils more discussion opportunities.", "The lesson went well and was organized. Pupils paid attention throughout the session and were not easily distracted. Oral questions posed by the teacher were answered correctly by the majority of pupils. Written exercises showed encouraging improvement compared to previous sessions. Pupils are becoming more confident to answer questions.", "14 pupils achieved the learning objectives. 4 pupils are still in the remedial process and need special attention. Differentiated learning activities conducted successfully helped meet the learning needs of pupils at different mastery levels. Teacher will continue to monitor the progress of these remedial pupils periodically.", "Learning objectives largely achieved. Pupils completed the given tasks within the allocated time. The use of various teaching aids such as videos, pictures and real objects successfully improved pupils' understanding of the concepts taught. Pupils could remember lesson content more easily through attractive visuals.", "Pupils were very enthusiastic during group activities. They completed the tasks well and showed close cooperation. The presentations at the end of the session showed great effort from each group. Pupils were brave enough to come forward to present their group work.", "The lesson proceeded as planned without any issues. Pupils understood the concepts taught well especially after hands-on activities. The reinforcement exercises given at the end of the session were completed well by the majority of pupils. Pupil reflections at the end showed they enjoyed today's learning.", "Majority of pupils achieved the set objectives. However, a few pupils are still weak in reading and writing skills. Special intervention will be conducted for these pupils next session. Teacher will prepare picture reading materials and simpler writing exercises to help them master basic skills.", "The lesson went well and achieved the targeted objectives. Pupils could identify and understand the main concepts taught well. Hands-on activities greatly helped weak pupils understand the topic. They could learn concretely through direct experience and real objects.", "Learning objectives achieved well. Pupils showed very positive attitudes towards learning today. They cooperated in groups and helped each other. Values of tolerance and mutual respect were fostered through group activities. Pupils also listened to their friends' opinions attentively.", "Pupils mastered the prescribed learning standards successfully. The lesson went smoothly according to plan. Enrichment and remedial activities were conducted according to pupil needs. Excellent pupils were given additional challenging tasks while remedial pupils received close individual guidance.", "Today's lesson was very enjoyable. Pupils learned through play using interesting and interactive activities. They could remember the concepts taught more easily through the learn-through-play approach. The cheerful and relaxed learning atmosphere helped pupils feel more comfortable to learn and ask questions.", "Learning objectives achieved successfully. Pupils showed encouraging improvement in understanding the topic taught. Continuous guidance is needed for remedial pupils to ensure they do not fall behind in learning. Teacher will give more attention to these pupils in the next session.", "The overall lesson was successful and achieved the set objectives. Pupils achieved the targeted learning outcomes. Various activities such as group discussions, gallery walks and presentations successfully helped meet the learning needs of pupils with different learning styles.", "Today's lesson successfully attracted pupils' interest through interactive and enjoyable activities. Pupils collaborated well in their respective groups and helped each other. The group learning approach not only improved understanding but also fostered cooperation and tolerance among pupils.", "Learning objectives achieved excellently. The use of technology in teaching and learning such as videos, animations and interactive quizzes successfully increased pupil engagement and interest. Pupils enjoyed learning in a fun way and understood abstract concepts more easily through attractive visualizations.", "Pupils mastered the skills taught with close teacher guidance. Reinforcement exercises will be given to further strengthen their understanding especially in aspects that are still weak. Teacher will prepare additional worksheets and various practice questions for this purpose.", "The lesson went smoothly with active participation from pupils. They actively asked questions and responded during the question and answer session. The learn-through-play approach used was very suitable for the topic taught today. Pupils understood the concepts more easily through fun activities.", "Learning objectives fully achieved today. Pupil presentations showed high effort and creativity. They successfully produced quality and attractive work. Formative assessment conducted continuously throughout the session helped the teacher identify pupils' strengths and weaknesses.", "16 pupils achieved the set learning objectives. Two pupils need special attention and will be given individual remedial activities. Teacher will prepare a special remedial module for these pupils and monitor their progress periodically.", "Pupils could apply the knowledge learned in new situations well. The contextual approach used successfully helped pupils understand the topic more deeply and meaningfully. They could connect learning with real situations in their daily lives.", "Today's lesson successfully improved pupils' critical thinking skills. They could solve given problems creatively and innovatively. The HOTS questions posed challenged pupils' thinking and encouraged them to think outside the box. Pupils enjoyed the challenges given.", "Learning objectives achieved well. Creative and varied use of teaching aids such as interactive videos, animated pictures and real objects successfully attracted pupils' interest. They understood abstract concepts more easily through attractive visuals and concrete materials that could be touched and seen.", "Majority of pupils completed the given tasks well and on time. However, a few pupils need additional guidance in writing and reading skills. Teacher will focus on these skills next session by providing more practice exercises.", "The lesson went smoothly with active participation from all pupils. Group activities conducted successfully encouraged cooperation, communication and interaction among pupils. They helped each other and shared ideas in completing tasks. A positive and conducive learning atmosphere was observed throughout the session.", "Learning objectives achieved excellently. Pupils mastered speaking skills confidently especially during presentation and role-play sessions. Role-play activities greatly helped pupils increase their confidence and communication skills in the correct language.", "Pupils showed very positive attitudes and high interest in learning. The lesson went smoothly according to plan. Formative assessment conducted continuously showed positive development in pupils' mastery of the prescribed learning standards.", "Today's lesson successfully achieved the set objectives. Pupils could work both in groups and individually well. They showed high discipline during activities and listened to teacher instructions carefully. The work produced was also of good quality.", "Learning objectives achieved satisfactorily. Pupils could identify and understand the concepts taught well especially after hands-on activities. Reinforcement exercises will be given to further strengthen pupils' understanding of the topic learned today.", "Pupils enjoyed the activities provided today. They could learn in a fun and stress-free atmosphere. The lesson went smoothly with active participation from pupils. They were not shy to ask questions and give opinions during the discussion session.", "The lesson proceeded according to the planned schedule. Pupils mastered the skills taught well. Pupil reflections at the end of the session showed they understood the lesson content delivered and could connect it with prior knowledge.", "Learning objectives achieved well. Pupils answered the questions posed correctly especially comprehension and application questions. Enrichment and remedial activities were conducted according to pupil needs to ensure each pupil benefited optimally from the lesson.", "Majority of pupils showed positive development in learning. However, a few pupils still need additional guidance especially in writing and reading skills. The next lesson session will focus more on remedial activities for pupils who are still weak.", "Today's lesson was very encouraging. Pupils mastered the learning objectives excellently without any issues. Various interactive activities conducted throughout the session successfully helped pupils' learning process and made the learning experience more meaningful and enjoyable."], "zh": ["今天有12名学生达到了学习目标。3名学生需要额外指导，特别是在阅读和写作方面。使用视频和问答的导入活动成功吸引了学生的兴趣。下次授课需要调整教学节奏，确保所有学生都能跟上课程。应该使用多样化的教具来保持学生的注意力。", "教学目标成功达成。学生能够很好地完成分配的任务，尤其是在小组活动中。他们展现了高度的合作精神。小组活动花费了相当长的时间，因此时间管理需要更有效率。动手操作活动大大帮助学生更清楚地理解抽象概念。", "15名/18名学生达到了预设的学习目标。三名学生需要在下次课进行个别补救活动。通过游戏学习的方法非常有效，成功吸引了学生的兴趣。通过有趣和互动的活动，他们更容易记住所学的概念。", "今天学生的掌握程度令人满意。教学按计划顺利进行，没有任何干扰。学生在整个过程中积极配合，并积极参与讨论。所提供的教具有助于提高学生对所教主题的理解。将给予巩固练习以进一步加强学生的理解。", "大多数学生掌握了规定的学习标准。少数学生需要额外的练习，特别是在写语法正确的句子方面。进行的小组活动成功提高了学生的协作和沟通能力。他们互相帮助，分享想法，完成分配的任务。", "教学目标完全达成。学生在讨论中很活跃，并在画廊漫步活动中贡献了 brilliant 的想法。持续进行的形成性评估显示了学生在理解方面的积极进展。所应用的21世纪学习方法成功提高了学生的积极参与度。", "教学顺利，达到了设定的目标。学生能够将学习与日常生活联系起来，尤其是在集思广益环节。画廊漫步活动非常有效地提高了学生的参与度，并提供了同伴学习的机会。学生也能向朋友提供建设性的反馈。", "所有学生都达到了今天设定的最低目标。通过Think-Pair-Share和Gallery Walk等活动应用了21世纪学习技能。课程结束时的学生反思显示了对所学主题的良好理解。学生也能将新知识与他们之前的经验联系起来。", "教学目标出色地达成。学生很好地完成了小组任务，并展现了高度的创造力。高层次思维技能被融入解决问题的活动中，学生很好地应用了它们。他们在整个过程中成功产生了创造性和创新性的想法。", "学生的掌握程度非常令人满意。教学按计划进行，时间为每个活动适当分配。学生已准备好接受下一堂课，并对继续学习表现出高度兴趣。使用各种教学技巧，如模拟和角色扮演，成功保持了学生的兴趣。", "目标很好地达成。学生能够在新的情况下应用所学知识，特别是在解决问题的活动中。布置了巩固练习作为家庭作业，以进一步加强学生的理解。教师将在下次课检查这些练习并提供建设性反馈。", "10名学生达到了掌握水平4及以上。5名学生仍在水平3，需要额外的练习。下次课将根据个别学生的需要进行补救活动。教师将为这些学生准备特殊的工作纸并提供密切指导。", "教学顺利且愉快。学生喜欢所提供的活动，尤其是互动的语言游戏。各种彩色教具有助于提高学生对所教概念的理解。学生在愉快的氛围中更有学习热情。", "教学目标成功达成。学生在小组中合作并按时完成了分配的任务。进行的同伴评估进展顺利，学生向朋友提供了建设性的反馈。这项活动也有助于提高学生的社交技能。", "学生对今天所教的主题表现出非常高的兴趣。他们在讨论环节积极提问并发表意见。下次课需要继续以更具挑战性的活动来满足优秀学生的需求，同时需要为弱生准备补救活动。", "今天的课顺利进行，80%的学生达到了设定的目标。在补救活动期间，对弱生进行了个别额外指导。给优秀学生提供了充实活动以挑战他们的思维。这种分层学习方法成功满足了学生多样化的学习需求。", "各种互动的学习活动成功帮助保持了学生整节课的兴趣。他们不感到无聊，始终积极参与。教学按计划和分配的时间顺利进行。学生配合良好，仔细听教师的指示。", "教学目标令人满意地达成。学生掌握了所教的技能，尤其是阅读和写作技能。进行的小组活动成功培养了学生之间的合作和互助精神。下次课需要稍微延长教学时间，给学生更多讨论的机会。", "教学顺利且有组织。学生整节课都专心听讲，不容易分心。大多数学生正确回答了教师提出的口头问题。书面练习显示出比前几节课令人鼓舞的进步。学生越来越自信地回答问题。", "14名学生达到了学习目标。4名学生仍在补救过程中，需要特别关注。进行的分层学习活动成功满足了不同掌握水平学生的学习需求。教师将继续定期监测这些补救学生的进展。", "教学目标大体达成。学生在规定时间内完成了分配的任务。使用各种教具，如视频、图片和实物，成功提高了学生对所教概念的理解。通过有吸引力的视觉材料，学生更容易记住课程内容。", "学生在小组活动中非常积极。他们很好地完成了任务，并展现了密切的合作。课程结束时的呈现展示出每个小组的巨大努力。学生勇敢地走上前呈现他们的小组作业。", "教学按计划进行，没有任何问题。学生在动手操作活动后很好地理解了所教的概念。大多数学生很好地完成了课程结束时给出的巩固练习。课程结束时的学生反思显示他们喜欢今天的学习。", "大多数学生达到了设定的目标。然而，少数学生在阅读和写作技能方面仍然薄弱。下次课将为这些学生进行特别干预。教师将准备图画阅读材料和更简单的写作练习，帮助他们掌握基本技能。", "教学顺利，达到了目标。学生能够很好地识别和理解所教的主要概念。动手活动大大帮助了弱生理解主题。他们能够通过直接经验和实物进行具体学习。", "教学目标很好地达成。学生今天对学习表现出非常积极的态度。他们在小组中合作并互相帮助。通过小组活动培养了宽容和相互尊重的价值观。学生也认真倾听朋友的意见。", "学生成功掌握了规定的学习标准。教学按计划顺利进行。根据需要进行了充实和补救活动。给优秀学生分配了额外的挑战性任务，而补救学生则接受了密切的个别指导。", "今天的课非常有趣。学生通过有趣和互动的活动在玩中学。通过玩中学的方法，他们更容易记住所教的概念。愉快和轻松的学习氛围帮助学生更舒适地学习和提问。", "教学目标成功
