<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kemaskini Masuk — SJKC PIN MIN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1f4e79 0%, #2a6fb0 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 40px 36px; width: 100%;
    max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.25); text-align: center;
  }
  .logo { font-size: 40px; margin-bottom: 8px; }
  h1 { font-size: 20px; color: #1f4e79; margin-bottom: 4px; }
  .sub { color: #667; font-size: 13px; margin-bottom: 24px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 16px; border: 1.5px solid #ccd;
    border-radius: 10px; margin-bottom: 12px; text-align: center; letter-spacing: 1px;
  }
  input:focus { outline: none; border-color: #2a6fb0; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff;
    background: #2a6fb0; border: none; border-radius: 10px; cursor: pointer;
  }
  button:hover { background: #1f5e99; }
  .err { color: #c0392b; font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🔒</div>
    <h1>Akses Staf Sahaja</h1>
    <div class="sub">SJKC PIN MIN — Sila masukkan kata laluan staf</div>
    <input type="password" id="pw" placeholder="Kata laluan" autofocus autocomplete="current-password">
    <button id="btn">Masuk</button>
    <div class="err" id="err"></div>
  </div>
<script>
async function tryLogin() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    if (r.ok) {
      window.location.href = "/";
    } else {
      const d = await r.json().catch(() => ({}));
      err.textContent = d.error || "Kata laluan salah. Sila cuba lagi.";
    }
  } catch (e) {
    err.textContent = "Ralat sambungan. Sila cuba lagi.";
  }
}
document.getElementById("btn").addEventListener("click", tryLogin);
document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
</script>
</body>
</html>
